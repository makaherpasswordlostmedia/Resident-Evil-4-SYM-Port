              glTexCoord2t16(inttot16(64), inttot16(64));   glVertex3v16(inttov16(7), 0, inttov16(7));
              glTexCoord2t16(0, inttot16(64));              glVertex3v16(-inttov16(7), 0, inttov16(7));
              glEnd();
              glBindTexture(0, 0);
              glPolyFmt(POLY_ALPHA(16) | POLY_CULL_NONE);
