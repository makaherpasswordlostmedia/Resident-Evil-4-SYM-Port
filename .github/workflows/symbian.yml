          volatile u32 shim_ms_flush, shim_ms_present, shim_polys_last;
          static u32 acc_flush, acc_present, acc_frames, last_log_ms, last_ui, last_frame_ms;
          void shim_present(void);

          void swiWaitForVBlank(void)
          {
              shim_trace("vblank");
              {
                  u32 t0 = host_ticks_ms();
                  if (last_frame_ms && t0 - last_frame_ms > 250)
                  {
                      char m[128];
                      snprintf(m, sizeof m, "SLOW FRAME %u: %u ms since the last vblank (render %u ms)", (unsigned)shim_frame_no,
                               (unsigned)(t0 - last_frame_ms), (unsigned)shim_ms_flush);
                      host_log(m);
                  }
              }
              shim_where = "present";
              shim_dma_run();
              u32 tp = host_ticks_ms();
              shim_present();
              acc_present += host_ticks_ms() - tp;
              shim_where = "vblank-wait";
              if (shim_pause)
              {
                  while (shim_pause && !shim_quit) host_sleep_ms(40);
                  vb_next3 = 0;
              }
              u32 now = host_ticks_ms();
              if (!vb_next3) vb_next3 = now * 3;
              vb_next3 += 50;                         /* 16.67 ms */
              u32 target = vb_next3 / 3;
              if (target > now) host_sleep_ms(target - now);
              else
              {
                  host_sleep_ms(1);                 /* always yield: the UI thread must get CPU time */
                  if (now - target > 100) vb_next3 = now * 3;
              }
              IntFn f = irq_fn[0];
              if (f) f();
              shim_frame_no++;
              last_frame_ms = host_ticks_ms();
              acc_frames++;
              acc_flush += shim_ms_flush;
              if (shim_frame_no == 1 || (shim_frame_no % 120) == 0)
              {
                  char m[160];
                  u32 t = host_ticks_ms();
                  u32 span = last_log_ms ? t - last_log_ms : 0;
                  snprintf(m, sizeof m, "frame %u: %u ms/%u fr, render %u ms, present %u ms, %u polys, ui+%u",
                           (unsigned)shim_frame_no, (unsigned)span, (unsigned)acc_frames,
                           (unsigned)(acc_frames ? acc_flush / acc_frames : 0),
                           (unsigned)(acc_frames ? acc_present / acc_frames : 0), (unsigned)shim_polys_last,
                           (unsigned)(shim_ui_ticks - last_ui));
                  last_ui = shim_ui_ticks;
                  host_log(m);
                  last_log_ms = t;
                  acc_flush = acc_present = acc_frames = 0;
              }
              if (shim_quit) host_exit_thread();
          }

