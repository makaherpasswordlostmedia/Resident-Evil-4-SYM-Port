          void CRe4Container::Tick()
              {
              ++shim_ui_ticks;
              if (!iGl)
                  {
                  return;
                  }
              const TBool wantGl = !shim_console_on;      // the error console is drawn by the window itself
              if (iGlWin && wantGl != iGlVisible)
                  {
                  iGlWin->MakeVisible(wantGl);
                  iGlVisible = wantGl;
                  iDirty = ETrue;
                  }
              if (!iBackground && iGlVisible)
                  {
                  iGl->Render();
                  }
              if (iDirty)
                  {
                  iDirty = EFalse;
                  DrawNow();
                  }
              }

