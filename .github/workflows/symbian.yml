          #!/bin/bash
          # Host build of the whole game against the shim (the OpenGL ES side is stubbed on the host). Run from the repo root
          # after tools/prepare.sh.
          set -euo pipefail
          S=symbian/shim
          mkdir -p /tmp/hc && rm -f /tmp/hc/*.o
