              m.m[5] = divf32(inttof32(2), t - b);
              m.m[10] = -divf32(inttof32(2), f - n);
              m.m[12] = -divf32(r + l, r - l);
              m.m[13] = -divf32(t + b, t - b);
              m.m[14] = -divf32(f + n, f - n);
              apply(&m);
          }

          static void frustum(int l, int r, int b, int t, int n, int f)
          {
              Mat m; memset(&m, 0, sizeof m);
              double dl = l / 4096.0, dr = r / 4096.0, db = b / 4096.0, dt = t / 4096.0, dn = n / 4096.0, df = f / 4096.0;
              m.m[0] = (int)(2 * dn / (dr - dl) * 4096);
              m.m[5] = (int)(2 * dn / (dt - db) * 4096);
              m.m[8] = (int)((dr + dl) / (dr - dl) * 4096);
              m.m[9] = (int)((dt + db) / (dt - db) * 4096);
              m.m[10] = (int)(-(df + dn) / (df - dn) * 4096);
              m.m[11] = -4096;
              m.m[14] = (int)(-2 * df * dn / (df - dn) * 4096);
              apply(&m);
