          /* ---------------------------------------------------------------- sprites */
          OamState oamMain;
          u8 shim_spr_gfx[32768];
          u16 shim_spr_pal[256];
          typedef struct { int x, y, pal, off, aff, dbl, hide, hflip, vflip; } Spr;
