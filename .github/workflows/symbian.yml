          /* ------------------------------------------------------------------ trace ring */
          typedef struct { const char *n; u32 f; } Trace;
          static Trace trace_ring[64];
          static volatile u32 trace_idx;
          volatile u32 shim_ui_ticks;

          void shim_trace(const char *n)
          {
              u32 i = trace_idx++;
              trace_ring[i & 63].n = n;
              trace_ring[i & 63].f = shim_frame_no;
          }

          /* "f12:glFlush f12:vblank x3 ..." oldest first, repeats collapsed */
          int shim_trace_dump(char *buf, int cap)
          {
              int len = 0;
              u32 end = trace_idx, start = end > 64 ? end - 64 : 0;
              for (u32 i = start; i < end && len < cap - 40;)
              {
                  const Trace *t = &trace_ring[i & 63];
                  u32 j = i + 1;
                  while (j < end && trace_ring[j & 63].n == t->n && trace_ring[j & 63].f == t->f) j++;
                  if (!t->n) { i = j; continue; }
                  len += snprintf(buf + len, cap - len, "f%u:%s", (unsigned)t->f, t->n);
                  if (j - i > 1) len += snprintf(buf + len, cap - len, "x%u", (unsigned)(j - i));
                  buf[len++] = ' ';
                  buf[len] = 0;
                  i = j;
              }
              return len;
          }

          /* last n calls, newest last: "glFlush vblank scanKeys" */
          int shim_trace_tail(char *buf, int cap, int n)
          {
              int len = 0;
              u32 end = trace_idx, start = end > (u32)n ? end - n : 0;
              buf[0] = 0;
              for (u32 i = start; i < end && len < cap - 24; i++)
              {
                  const char *nm = trace_ring[i & 63].n;
                  if (nm) len += snprintf(buf + len, cap - len, "%s ", nm);
              }
              return len;
          }

          /* ------------------------------------------------------------------ maths */
          static double my_sin(double x)
          {
              const double pi = 3.14159265358979323846;
              while (x > pi) x -= 2 * pi;
              while (x < -pi) x += 2 * pi;
              double x2 = x * x, t = x, s = x;
              for (int i = 1; i < 12; i++)
              {
                  t *= -x2 / ((2 * i) * (2 * i + 1));
                  s += t;
              }
              return s;
          }

          static s16 sin_tab[513];
          static int tab_ok;

          static void init_tab(void)
          {
              for (int i = 0; i <= 512; i++)
              {
                  double v = my_sin(6.28318530717958647692 * i / 512.0) * 4096.0;
                  sin_tab[i] = (s16)(v >= 0 ? v + 0.5 : v - 0.5);
              }
              tab_ok = 1;
          }

          int sinLerp(s16 a)
          {
              if (!tab_ok) init_tab();
              u32 ang = (u16)a & 0x7FFF;
              int i = ang >> 6, f = ang & 63;
              return sin_tab[i] + (((sin_tab[i + 1] - sin_tab[i]) * f) >> 6);
          }
          int cosLerp(s16 a) { return sinLerp((s16)(a + 8192)); }
          int tanLerp(s16 a)
          {
              double ang = 6.28318530717958647692 * ((u16)a & 0x7FFF) / 32768.0;
              double c = my_sin(ang + 1.57079632679489661923);
              if (c > -1e-6 && c < 1e-6) return 0x7FFFFFF;
              return (int)(my_sin(ang) / c * 4096.0);
          }

          u32 sqrt64(u64 a)
          {
              u64 r = 0, bit = (u64)1 << 62;
              while (bit > a) bit >>= 2;
              while (bit)
              {
                  if (a >= r + bit) { a -= r + bit; r = (r >> 1) + bit; }
                  else r >>= 1;
                  bit >>= 2;
              }
              return (u32)r;
          }
          u32 sqrt32(u32 a) { return sqrt64(a); }

