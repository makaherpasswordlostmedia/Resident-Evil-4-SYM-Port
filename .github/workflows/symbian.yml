          void *host_alloc(size_t n);
          void host_free(void *p);
          void *host_realloc(void *p, size_t n);
          int host_fopen(const char *path, const char *mode);
          int host_fread(int h, void *buf, int n);
          int host_fwrite(int h, const void *buf, int n);
