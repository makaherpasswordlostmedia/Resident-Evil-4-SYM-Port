          /* -------------------------------------------------------------- matrices */
          static void mat_ident(Mat *m) { memset(m, 0, sizeof *m); m->m[0] = m->m[5] = m->m[10] = m->m[15] = 4096; }
          static void mat_mul(Mat *out, const Mat *a, const Mat *b)      /* out = a, then b */
          {
              Mat r;
              for (int i = 0; i < 4; i++)
                  for (int j = 0; j < 4; j++)
                  {
                      s64 s = 0;
                      for (int k = 0; k < 4; k++) s += (s64)a->m[i * 4 + k] * b->m[k * 4 + j];
                      r.m[i * 4 + j] = (int)(s >> 12);
                  }
