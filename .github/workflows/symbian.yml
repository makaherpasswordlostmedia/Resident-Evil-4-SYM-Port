          void CRe4Container::ComputeLayout()
              {
              TSize s = Size();
              TInt w = s.iWidth, h = s.iHeight;
              if (w < h)
                  {
                  TInt t = w; w = h; h = t;
                  }
              TInt sw = w / 2;
              TInt sh = sw * 3 / 4;
              TInt minStrip = 96;
              if (h - sh < minStrip)
                  {
                  sh = h - minStrip;
                  sw = sh * 4 / 3;
                  }
              TInt x0 = (w - 2 * sw) / 2;
              iGlRect = TRect(x0, 0, x0 + 2 * sw, sh);
              iTopRect = TRect(x0, 0, x0 + sw, sh);
              iBotRect = TRect(x0 + sw, 0, x0 + 2 * sw, sh);

              TInt hs = h - sh;
              TInt cy = sh + hs / 2;
              iDpadR = hs / 2 - 2;
              iDpadC = TPoint(iDpadR + 8, cy);
              TInt bs = hs / 3;                       // face button size
              TInt fx = w - iDpadR - 8;
              iBtn[4] = TRect(fx + bs / 2, cy - bs / 2, fx + bs / 2 + bs, cy + bs / 2);               // A right
              iBtn[5] = TRect(fx - bs / 2, cy + bs / 2 - 4, fx + bs / 2, cy + bs / 2 - 4 + bs);       // B bottom
              iBtn[6] = TRect(fx - bs / 2, cy - bs / 2 - bs + 4, fx + bs / 2, cy - bs / 2 + 4);       // X top
              iBtn[7] = TRect(fx - bs / 2 - bs, cy - bs / 2, fx - bs / 2, cy + bs / 2);                // Y left
              TInt mx = w / 2;
              iBtn[0] = TRect(mx - 150, sh + 6, mx - 80, sh + 6 + hs / 3);                             // L
              iBtn[1] = TRect(mx + 80, sh + 6, mx + 150, sh + 6 + hs / 3);                             // R
              iBtn[2] = TRect(mx - 70, cy - hs / 6, mx - 5, cy + hs / 6);                              // SELECT
              iBtn[3] = TRect(mx + 5, cy - hs / 6, mx + 70, cy + hs / 6);                              // START
              iBtn[8] = TRect(mx - 40, h - hs / 3 - 2, mx + 40, h - 2);                                // QUIT
              TInt dx = iDpadC.iX;
              iBtn[9] = TRect(dx - bs / 2, cy - bs - bs / 2, dx + bs / 2, cy - bs / 2);                // UP
              iBtn[10] = TRect(dx - bs / 2, cy + bs / 2, dx + bs / 2, cy + bs + bs / 2);               // DOWN
              iBtn[11] = TRect(dx - bs - bs / 2, cy - bs / 2, dx - bs / 2, cy + bs / 2);               // LEFT
              iBtn[12] = TRect(dx + bs / 2, cy - bs / 2, dx + bs + bs / 2, cy + bs / 2);               // RIGHT
              }

          void CRe4Container::PushInput()
              {
              iDirty = ETrue;
              shim_set_input(iKeyBits | iPadBits, iTouch, iTouchX, iTouchY);
              }

          TUint CRe4Container::ButtonsAt(const TPoint& aPt) const
              {
              TUint bits = 0;
              for (TInt i = 0; i < KButtons; ++i)
                  {
                  if (i != 8 && iBtn[i].Contains(aPt))
                      {
                      bits |= KBtnBits[i];
                      }
                  }
              return bits;
              }

          void CRe4Container::ApplyPoint(const TPoint& aPt)
              {
              if (iBotRect.Contains(aPt))
                  {
                  iTouch = ETrue;
                  iTouchX = (aPt.iX - iBotRect.iTl.iX) * 256 / iBotRect.Width();
                  iTouchY = (aPt.iY - iBotRect.iTl.iY) * 192 / iBotRect.Height();
                  iPadBits = 0;
                  }
              else
                  {
                  iTouch = EFalse;
                  iPadBits = ButtonsAt(aPt);
                  }
              }

          void CRe4Container::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              static TInt logged = 0;
              if (aEvent.iType != TPointerEvent::EDrag && logged < 400)
                  {
                  ++logged;
                  Re4Log("pointer type=%d at %d,%d", (TInt)aEvent.iType, aEvent.iPosition.iX, aEvent.iPosition.iY);
                  }
              switch (aEvent.iType)
                  {
                  case TPointerEvent::EButton1Down:
                      if (iBtn[8].Contains(aEvent.iPosition))
                          {
                          TInt now = (TInt)User::NTickCount();
                          if (iQuitTick && now - iQuitTick < 2000)
                              {
                              static_cast<CAknAppUi*>(iEikonEnv->EikAppUi())->HandleCommandL(EEikCmdExit);
                              return;
                              }
                          iQuitTick = now ? now : 1;
                          }
                      ApplyPoint(aEvent.iPosition);
                      break;
                  case TPointerEvent::EDrag:
                      ApplyPoint(aEvent.iPosition);
                      break;
                  case TPointerEvent::EButton1Up:
                      iTouch = EFalse;
                      iPadBits = 0;
                      break;
                  default:
                      break;
                  }
              PushInput();
              }

          TKeyResponse CRe4Container::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              TUint bit = 0;
              switch (aKey.iScanCode)
                  {
                  case EStdKeyUpArrow:    bit = KDsUp; break;
                  case EStdKeyDownArrow:  bit = KDsDown; break;
                  case EStdKeyLeftArrow:  bit = KDsLeft; break;
                  case EStdKeyRightArrow: bit = KDsRight; break;
                  case EStdKeyEnter:
                  case EStdKeyDevice3:
                  case 'Z':               bit = KDsA; break;
                  case EStdKeyBackspace:
                  case 'X':               bit = KDsB; break;
                  case 'S':               bit = KDsX; break;
                  case 'A':               bit = KDsY; break;
                  case 'Q':               bit = KDsL; break;
                  case 'W':               bit = KDsR; break;
                  case EStdKeySpace:      bit = KDsStart; break;
                  case 'E':               bit = KDsSelect; break;
                  default:                break;
                  }
              static TInt keysLogged = 0;
              if (aType != EEventKey && keysLogged < 400)
                  {
                  ++keysLogged;
                  Re4Log("key type=%d scan=%d", (TInt)aType, (TInt)aKey.iScanCode);
                  }
              if (!bit)
                  {
                  return EKeyWasNotConsumed;
                  }
              if (aType == EEventKeyDown)
                  {
                  iKeyBits |= bit;
                  }
              else if (aType == EEventKeyUp)
                  {
                  iKeyBits &= ~bit;
                  }
              PushInput();
              return EKeyWasConsumed;
              }

          void CRe4Container::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(TRgb(200, 200, 200));
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(aDown ? TRgb(120, 120, 140) : TRgb(40, 40, 48));
              aGc.DrawRect(aRect);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TInt base = aRect.Height() / 2 + font->AscentInPixels() / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter);
              aGc.DiscardFont();
              }

          void CRe4Container::DrawFailure(CWindowGc& aGc) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbWhite);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              const TInt lineH = font->HeightInPixels() + 4;
              TInt y = font->AscentInPixels() + 8;
              TBuf<80> line;
              aGc.DrawText(_L("OpenGL ES 2.0 could not be started."), TPoint(8, y));
              y += lineH;
              line.Format(_L("Error code: %d"), iGlErr);
              aGc.DrawText(line, TPoint(8, y));
              y += lineH;
              aGc.DrawText(_L("This version has no software renderer."), TPoint(8, y));
              y += lineH;
              aGc.DrawText(_L("Details: E:\\RE4DS\\re4ds.log"), TPoint(8, y));
              aGc.DiscardFont();
              }

          void CRe4Container::DrawConsole(CWindowGc& aGc) const
              {
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(KRgbBlack);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbWhite);
              aGc.DrawRect(iBotRect);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TInt lineH = font->HeightInPixels() + 2;
              TInt y = iBotRect.iTl.iY + font->AscentInPixels() + 2;
              TInt cw = font->MaxNormalCharWidthInPixels();
              if (cw < 4) cw = 8;
              TInt cols = iBotRect.Width() / cw;
              if (cols > 60) cols = 60;
              if (cols < 8) cols = 8;
              TBuf<64> line;
              const char* p = shim_console;
              while (*p && y < iBotRect.iBr.iY)
                  {
                  line.Zero();
                  while (*p && *p != '\n' && line.Length() < cols)
                      {
                      line.Append(TChar((TUint8)*p));
                      ++p;
                      }
                  if (*p == '\n')
                      {
                      ++p;
                      }
                  aGc.DrawText(line, TPoint(iBotRect.iTl.iX + 4, y));
                  y += lineH;
                  }
              aGc.DiscardFont();
              }

          void CRe4Container::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.Clear();
              if (iGlFailed)
                  {
                  DrawFailure(gc);
                  }
              else if (shim_console_on)
                  {
                  DrawConsole(gc);
                  }

              TUint held = iKeyBits | iPadBits;
              DrawButton(gc, iBtn[0], KLblL, held & KDsL);
              DrawButton(gc, iBtn[1], KLblR, held & KDsR);
              DrawButton(gc, iBtn[2], KLblSel, held & KDsSelect);
              DrawButton(gc, iBtn[3], KLblStart, held & KDsStart);
              DrawButton(gc, iBtn[4], KLblA, held & KDsA);
              DrawButton(gc, iBtn[5], KLblB, held & KDsB);
              DrawButton(gc, iBtn[6], KLblX, held & KDsX);
              DrawButton(gc, iBtn[7], KLblY, held & KDsY);
              DrawButton(gc, iBtn[8], KLblQuit, EFalse);
              DrawButton(gc, iBtn[9], KLblUp, held & KDsUp);
              DrawButton(gc, iBtn[10], KLblDown, held & KDsDown);
              DrawButton(gc, iBtn[11], KLblLeft, held & KDsLeft);
              DrawButton(gc, iBtn[12], KLblRight, held & KDsRight);
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_gl.cpp <<'RE4_EOF'
          // GLES 2.0 renderer: draws the polygon batches the software DS layer prepared (clip-space
          // triangles, perspective-correct on the GPU), plus the sprite layer, the sub screen and the
          // fades. This is the only renderer: every failure makes NewL leave and the window reports it.
          #include <e32base.h>
          #include <e32std.h>
          #include <w32std.h>
          #include "re4ds.h"

          #if !(defined(RE4_GLES2) && __has_include(<GLES2/gl2.h>) && __has_include(<EGL/egl.h>))
          #error "RE4 DS needs EGL + OpenGL ES 2.0 (RE4_GLES2 and the SDK headers / libs) - there is no software renderer"
          #endif
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #ifndef EGL_OPENGL_ES2_BIT
          #define EGL_OPENGL_ES2_BIT 0x0004
          #endif
          #ifndef EGL_CONTEXT_CLIENT_VERSION
          #define EGL_CONTEXT_CLIENT_VERSION 0x3098
          #endif

          // ------------------------------------------------------------------ shaders
          static const char KVsGeo[] =
              "attribute vec4 aPos;\n"
              "attribute vec2 aUV;\n"
              "attribute vec4 aCol;\n"
              "varying vec4 vCol;\n"
              "varying vec2 vUV;\n"
              "void main(){ gl_Position = aPos; vCol = aCol; vUV = aUV; }\n";

          static const char KFsGeo[] =
              "#ifdef GL_FRAGMENT_PRECISION_HIGH\n"
              "precision highp float;\n"
              "#else\n"
              "precision mediump float;\n"
              "#endif\n"
              "varying vec4 vCol;\n"
              "varying vec2 vUV;\n"
              "uniform sampler2D uTex;\n"
              "uniform sampler2D uFog;\n"
              "uniform vec4 uFogCol;\n"
              "uniform float uUseTex;\n"
              "uniform float uUseFog;\n"
              "uniform float uCut;\n"
              "void main(){\n"
              "  vec4 c = vCol;\n"
              "  if (uUseTex > 0.5) {\n"
              "    vec4 t = texture2D(uTex, vUV);\n"
              "    if (t.a < uCut) discard;\n"
              "    c.rgb *= t.rgb;\n"
              "    c.a *= t.a;\n"
              "  } else if (c.a < 0.004) discard;\n"
              "  if (uUseFog > 0.5) {\n"
              "    float d = texture2D(uFog, vec2(gl_FragCoord.z, 0.5)).r;\n"
              "    c.rgb = mix(c.rgb, uFogCol.rgb, d);\n"
              "  }\n"
              "  gl_FragColor = c;\n"
              "}\n";

          static const char KVs2d[] =
              "attribute vec2 aPos;\n"
              "attribute vec2 aUV;\n"
              "varying vec2 vUV;\n"
              "void main(){ gl_Position = vec4(aPos, 0.0, 1.0); vUV = aUV; }\n";

          static const char KFs2d[] =
              "precision mediump float;\n"
              "varying vec2 vUV;\n"
              "uniform sampler2D uTex;\n"
              "uniform vec4 uColor;\n"
              "uniform float uUseTex;\n"
              "void main(){ gl_FragColor = (uUseTex > 0.5) ? texture2D(uTex, vUV) : uColor; }\n";

          static const GLfloat KQuadPos[8] = { -1.f, 1.f, 1.f, 1.f, -1.f, -1.f, 1.f, -1.f };   // strip: TL TR BL BR
          static const GLfloat KQuadUv[8] = { 0.f, 0.f, 1.f, 0.f, 0.f, 1.f, 1.f, 1.f };

          static GLuint CompileShader(GLenum aType, const char* aSrc)
              {
              GLuint s = glCreateShader(aType);
              glShaderSource(s, 1, &aSrc, NULL);
              glCompileShader(s);
              GLint ok = 0;
              glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              if (!ok)
                  {
                  char log[200];
                  GLsizei n = 0;
                  glGetShaderInfoLog(s, sizeof(log) - 1, &n, log);
                  log[n] = 0;
                  Re4Log("GLSL compile failed: %s", log);
                  glDeleteShader(s);
                  return 0;
                  }
              return s;
              }

          // attribute i is bound to aNames[i]
          static GLuint LinkProgram(const char* aVs, const char* aFs, const char* const* aNames, TInt aCount)
              {
              GLuint vs = CompileShader(GL_VERTEX_SHADER, aVs);
              GLuint fs = CompileShader(GL_FRAGMENT_SHADER, aFs);
              if (!vs || !fs)
                  {
                  return 0;
                  }
              GLuint p = glCreateProgram();
              glAttachShader(p, vs);
              glAttachShader(p, fs);
              for (TInt i = 0; i < aCount; ++i)
                  {
                  glBindAttribLocation(p, i, aNames[i]);
                  }
              glLinkProgram(p);
              GLint ok = 0;
              glGetProgramiv(p, GL_LINK_STATUS, &ok);
              glDeleteShader(vs);
              glDeleteShader(fs);
              if (!ok)
                  {
                  Re4Log("GLSL link failed");
                  glDeleteProgram(p);
                  return 0;
                  }
              return p;
              }

          static void SwapRB(TUint32* aPx, TInt aCount)       // 0xAARRGGBB -> bytes R,G,B,A in memory
              {
              for (TInt i = 0; i < aCount; ++i)
                  {
                  TUint32 c = aPx[i];
                  aPx[i] = (c & 0xFF00FF00u) | ((c >> 16) & 0xFFu) | ((c & 0xFFu) << 16);
                  }
              }

          // ------------------------------------------------------------------ setup
          CRe4Gl* CRe4Gl::NewL(RWindow& aWindow)
              {
              CRe4Gl* self = new (ELeave) CRe4Gl;
              CleanupStack::PushL(self);
              self->ConstructL(aWindow);
              CleanupStack::Pop(self);
              return self;
              }

          void CRe4Gl::ConstructL(RWindow& aWindow)
              {
              iWin = &aWindow;
              iBuf = (TUint32*)User::AllocL(256 * 192 * 4);
              InitEgl(aWindow);
              InitGl();
              iOk = ETrue;
              Re4Log("gles: ready %d x %d", iW, iH);
              }

          CRe4Gl::~CRe4Gl()
              {
              Teardown(EFalse);
              User::Free(iBuf);
              }

          void CRe4Gl::InitEgl(RWindow& aWindow)
              {
              EGLDisplay d = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              if (d == EGL_NO_DISPLAY)
                  {
                  Re4Log("gles: no EGL display");
                  User::Leave(KErrNotSupported);
                  }
              EGLint maj = 0, min = 0;
              if (!eglInitialize(d, &maj, &min))
                  {
                  Re4Log("gles: eglInitialize failed %x", (unsigned)eglGetError());
                  User::Leave(KErrNotSupported);
                  }
              iDisplay = d;
              eglBindAPI(EGL_OPENGL_ES_API);

              static const EGLint attrA[] = { EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                                              EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8, EGL_DEPTH_SIZE, 16, EGL_NONE };
              static const EGLint attrB[] = { EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                                              EGL_RED_SIZE, 5, EGL_GREEN_SIZE, 6, EGL_BLUE_SIZE, 5, EGL_DEPTH_SIZE, 16, EGL_NONE };
              static const EGLint attrC[] = { EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                                              EGL_DEPTH_SIZE, 16, EGL_NONE };
              const EGLint* sets[3] = { attrA, attrB, attrC };
              EGLConfig cfg = NULL;
              EGLint n = 0;
              TBool found = EFalse;
              for (TInt i = 0; i < 3 && !found; ++i)
                  {
                  n = 0;
                  if (eglChooseConfig(d, sets[i], &cfg, 1, &n) && n > 0)
                      {
                      found = ETrue;
                      }
                  }
              if (!found)
                  {
                  Re4Log("gles: no ES2 window config");
                  User::Leave(KErrNotSupported);
                  }
              iConfig = cfg;
              EGLSurface surf = eglCreateWindowSurface(d, cfg, &aWindow, NULL);
              if (surf == EGL_NO_SURFACE)
                  {
                  Re4Log("gles: eglCreateWindowSurface failed %x", (unsigned)eglGetError());
                  User::Leave(KErrNotSupported);
                  }
              iSurface = surf;
              static const EGLint ctxAttr[] = { EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE };
              EGLContext ctx = eglCreateContext(d, cfg, EGL_NO_CONTEXT, ctxAttr);
              if (ctx == EGL_NO_CONTEXT)
                  {
                  Re4Log("gles: eglCreateContext failed %x", (unsigned)eglGetError());
                  User::Leave(KErrNotSupported);
                  }
              iContext = ctx;
              if (!eglMakeCurrent(d, surf, surf, ctx))
                  {
                  Re4Log("gles: eglMakeCurrent failed %x", (unsigned)eglGetError());
                  User::Leave(KErrNotSupported);
                  }
              eglSwapInterval(d, 1);
              TSize sz = aWindow.Size();
              iW = sz.iWidth;
              iH = sz.iHeight;
              Re4Log("gles: EGL %d.%d, window %d x %d, vendor %s", (TInt)maj, (TInt)min, iW, iH,
                     (const char*)glGetString(GL_RENDERER));
              }

          void CRe4Gl::InitGl()
              {
              static const char* const geoAttr[3] = { "aPos", "aUV", "aCol" };
              static const char* const flatAttr[2] = { "aPos", "aUV" };
              iProgGeo = LinkProgram(KVsGeo, KFsGeo, geoAttr, 3);
              iProg2d = LinkProgram(KVs2d, KFs2d, flatAttr, 2);
              if (!iProgGeo || !iProg2d)
                  {
                  User::Leave(KErrNotSupported);
                  }
              iGeoU[0] = glGetUniformLocation(iProgGeo, "uTex");
              iGeoU[1] = glGetUniformLocation(iProgGeo, "uFog");
              iGeoU[2] = glGetUniformLocation(iProgGeo, "uFogCol");
              iGeoU[3] = glGetUniformLocation(iProgGeo, "uUseTex");
              iGeoU[4] = glGetUniformLocation(iProgGeo, "uUseFog");
              iGeoU[5] = glGetUniformLocation(iProgGeo, "uCut");
              iFlatU[0] = glGetUniformLocation(iProg2d, "uTex");
              iFlatU[1] = glGetUniformLocation(iProg2d, "uColor");
              iFlatU[2] = glGetUniformLocation(iProg2d, "uUseTex");

              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              GLuint t[3];
              glGenTextures(3, t);
              iTexOverlay = t[0];
              iTexBot = t[1];
              iTexFog = t[2];
              for (TInt i = 0; i < 2; ++i)
                  {
                  glBindTexture(GL_TEXTURE_2D, i == 0 ? iTexOverlay : iTexBot);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
                  glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, 256, 192, 0, GL_RGBA, GL_UNSIGNED_BYTE, NULL);
                  }
              glBindTexture(GL_TEXTURE_2D, iTexFog);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_LUMINANCE, 512, 1, 0, GL_LUMINANCE, GL_UNSIGNED_BYTE, NULL);
              iLastFogSeq = 0;
              glDisable(GL_CULL_FACE);          // culling was already done by the DS layer
              glDisable(GL_DITHER);
              }

          void CRe4Gl::Teardown(TBool aKeepTextures)
              {
              EGLDisplay d = (EGLDisplay)iDisplay;
              if (d)
                  {
                  eglMakeCurrent(d, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (iContext) eglDestroyContext(d, (EGLContext)iContext);
                  if (iSurface) eglDestroySurface(d, (EGLSurface)iSurface);
                  eglTerminate(d);
                  }
              iDisplay = iSurface = iContext = iConfig = NULL;
              iProgGeo = iProg2d = iTexOverlay = iTexBot = iTexFog = 0;
              for (TInt i = 0; i < KMaxTex; ++i)
                  {
                  iTex[i].iName = 0;                         // GL names died with the context
                  if (!aKeepTextures)
                      {
                      User::Free(iTex[i].iPx);
                      iTex[i].iPx = NULL;
                      }
                  }
              iOk = EFalse;
              }

          void CRe4Gl::Recover()
              {
              Re4Log("gles: context lost, rebuilding");
              Teardown(ETrue);
              TRAPD(err, InitEgl(*iWin); InitGl());
              if (err != KErrNone)
                  {
                  Re4Log("gles: rebuild failed %d, rendering stops", err);
                  return;
                  }
              for (TInt i = 0; i < KMaxTex; ++i)
                  {
                  if (iTex[i].iPx)
                      {
                      CreateGlTex(i);
                      }
                  }
              iOk = ETrue;
              }

          // ------------------------------------------------------------------ textures
          void CRe4Gl::CreateGlTex(TInt aId)
              {
              TTex& t = iTex[aId];
              GLuint n = 0;
              glGenTextures(1, &n);
              glBindTexture(GL_TEXTURE_2D, n);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              const TBool pot = !(t.iW & (t.iW - 1)) && !(t.iH & (t.iH - 1));     // REPEAT needs power-of-two in ES 2
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, (pot && t.iWrapS) ? GL_REPEAT : GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, (pot && t.iWrapT) ? GL_REPEAT : GL_CLAMP_TO_EDGE);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, t.iW, t.iH, 0, GL_RGBA, GL_UNSIGNED_BYTE, t.iPx);
              t.iName = n;
              }

          void CRe4Gl::FreeTex(TInt aId)
              {
              TTex& t = iTex[aId];
              if (t.iName)
                  {
                  GLuint n = t.iName;
                  glDeleteTextures(1, &n);
                  t.iName = 0;
                  }
              User::Free(t.iPx);
              t.iPx = NULL;
              }

          void CRe4Gl::PumpTextures()
              {
              ShimGlTexEv ev;
              while (shim_gl_next_tex(&ev))
                  {
                  if (ev.id <= 0 || ev.id >= KMaxTex)
                      {
                      User::Free(ev.px);
                      continue;
                      }
                  FreeTex(ev.id);
                  if (ev.kind == 1 && ev.px)
                      {
                      TTex& t = iTex[ev.id];
                      t.iPx = ev.px;                         // the pixels are ours now (shared heap)
                      t.iW = ev.w;
                      t.iH = ev.h;
                      t.iWrapS = ev.wrap_s;
                      t.iWrapT = ev.wrap_t;
                      SwapRB(t.iPx, ev.w * ev.h);
                      CreateGlTex(ev.id);
                      }
                  }
              }

          void CRe4Gl::UploadScreens()
              {
              for (TInt i = 0; i < 2; ++i)
                  {
                  host_lock();
                  Mem::Copy(iBuf, i == 0 ? shim_top : shim_bot, 256 * 192 * 4);
                  host_unlock();
                  SwapRB(iBuf, 256 * 192);
                  glBindTexture(GL_TEXTURE_2D, i == 0 ? iTexOverlay : iTexBot);
                  glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, 256, 192, GL_RGBA, GL_UNSIGNED_BYTE, iBuf);
                  }
              }

          // ------------------------------------------------------------------ drawing
          void CRe4Gl::DrawGeo(const ShimGlGeo& aG)
              {
              glUseProgram(iProgGeo);
              glEnable(GL_DEPTH_TEST);
              glDepthFunc(GL_LESS);
              glDepthMask(GL_TRUE);
              glDisable(GL_BLEND);
              glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

              const char* base = (const char*)aG.v;
              glEnableVertexAttribArray(0);
              glEnableVertexAttribArray(1);
              glEnableVertexAttribArray(2);
              glVertexAttribPointer(0, 4, GL_FLOAT, GL_FALSE, sizeof(ShimGlVert), base);
              glVertexAttribPointer(1, 2, GL_FLOAT, GL_FALSE, sizeof(ShimGlVert), base + 16);
              glVertexAttribPointer(2, 4, GL_UNSIGNED_BYTE, GL_TRUE, sizeof(ShimGlVert), base + 24);

              glActiveTexture(GL_TEXTURE1);
              glBindTexture(GL_TEXTURE_2D, iTexFog);
              if (aG.fog_on && aG.seq != iLastFogSeq)
                  {
                  glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, 512, 1, GL_LUMINANCE, GL_UNSIGNED_BYTE, aG.fog_lut);
                  iLastFogSeq = aG.seq;
                  }
              glActiveTexture(GL_TEXTURE0);
              glUniform1i(iGeoU[0], 0);
              glUniform1i(iGeoU[1], 1);
              glUniform4f(iGeoU[2], aG.fog_col[0] / 31.0f, aG.fog_col[1] / 31.0f, aG.fog_col[2] / 31.0f, 1.0f);

              TUint curFlags = 0xFFFFFFFFu;
              TInt curTex = -1;
              for (TInt i = 0; i < aG.nb; ++i)
                  {
                  const ShimGlBatch& b = aG.b[i];
                  if (b.flags != curFlags)
                      {
                      curFlags = b.flags;
                      const TBool trans = (b.flags & SHIM_GLB_TRANS) != 0;
                      if (trans) glEnable(GL_BLEND); else glDisable(GL_BLEND);
                      glDepthMask((b.flags & SHIM_GLB_DEPTHW) ? GL_TRUE : GL_FALSE);
                      glDepthFunc((b.flags & SHIM_GLB_DEQ) ? GL_LEQUAL : GL_LESS);
                      glUniform1f(iGeoU[4], (b.flags & SHIM_GLB_FOG) ? 1.0f : 0.0f);
                      glUniform1f(iGeoU[5], trans ? 0.004f : 0.5f);
                      }
                  if (b.tex != curTex)
                      {
                      curTex = b.tex;
                      if (b.tex > 0 && b.tex < KMaxTex && iTex[b.tex].iName)
                          {
                          glBindTexture(GL_TEXTURE_2D, iTex[b.tex].iName);
                          glUniform1f(iGeoU[3], 1.0f);
                          }
                      else
                          {
                          glUniform1f(iGeoU[3], 0.0f);
                          }
                      }
                  glDrawArrays(GL_TRIANGLES, b.first, b.count);
                  }
              glDepthMask(GL_TRUE);
              glDisable(GL_DEPTH_TEST);
              glDisable(GL_BLEND);
              }

          void CRe4Gl::DrawTexQuad(TUint aTex, TBool aBlend)
              {
              glUseProgram(iProg2d);
              glDisable(GL_DEPTH_TEST);
              if (aBlend)
                  {
                  glEnable(GL_BLEND);
                  glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
                  }
              else
                  {
                  glDisable(GL_BLEND);
                  }
              glActiveTexture(GL_TEXTURE0);
              glBindTexture(GL_TEXTURE_2D, aTex);
              glUniform1i(iFlatU[0], 0);
              glUniform1f(iFlatU[2], 1.0f);
              glEnableVertexAttribArray(0);
              glEnableVertexAttribArray(1);
              glDisableVertexAttribArray(2);
              glVertexAttribPointer(0, 2, GL_FLOAT, GL_FALSE, 0, KQuadPos);
              glVertexAttribPointer(1, 2, GL_FLOAT, GL_FALSE, 0, KQuadUv);
              glDrawArrays(GL_TRIANGLE_STRIP, 0, 4);
              glDisable(GL_BLEND);
              }

          void CRe4Gl::DrawSolid(TInt aLevel)
              {
              if (!aLevel)
                  {
                  return;
                  }
              const TBool white = aLevel > 0;
              const GLfloat a = (white ? aLevel : -aLevel) / 16.0f;
              glUseProgram(iProg2d);
              glDisable(GL_DEPTH_TEST);
              glEnable(GL_BLEND);
              glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
              glUniform1f(iFlatU[2], 0.0f);
              glUniform4f(iFlatU[1], white ? 1.0f : 0.0f, white ? 1.0f : 0.0f, white ? 1.0f : 0.0f, a);
              glEnableVertexAttribArray(0);
              glEnableVertexAttribArray(1);
              glDisableVertexAttribArray(2);
              glVertexAttribPointer(0, 2, GL_FLOAT, GL_FALSE, 0, KQuadPos);
              glVertexAttribPointer(1, 2, GL_FLOAT, GL_FALSE, 0, KQuadUv);
              glDrawArrays(GL_TRIANGLE_STRIP, 0, 4);
              glDisable(GL_BLEND);
              }

          void CRe4Gl::Render()
              {
              if (!iOk)
                  {
                  return;
                  }
              PumpTextures();
              const ShimGlGeo* g = shim_gl_acquire();
              ShimGlParams p;
              shim_gl_get_params(&p);
              UploadScreens();

              const TInt sw = iW / 2, sh = iH;
              const TInt mainX = p.swap ? sw : 0, subX = p.swap ? 0 : sw;

              glDisable(GL_SCISSOR_TEST);
              glViewport(0, 0, iW, iH);
              glDepthMask(GL_TRUE);
              glClearColor(0.f, 0.f, 0.f, 1.f);
              glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);
              glEnable(GL_SCISSOR_TEST);

              // main screen: 3D, fade of the 3D layer, sprites, screen fade
              glViewport(mainX, 0, sw, sh);
              glScissor(mainX, 0, sw, sh);
              if (g)
                  {
                  glClearColor(g->clr[0] / 31.0f, g->clr[1] / 31.0f, g->clr[2] / 31.0f, 1.0f);
                  glClearDepthf(g->clr_depth / 32767.0f);
                  glDepthMask(GL_TRUE);
                  glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);
                  DrawGeo(*g);
                  }
              if (p.dim3d > 0)
                  {
                  DrawSolid(-p.dim3d);
                  }
              DrawTexQuad(iTexOverlay, ETrue);
              DrawSolid(p.bright_main);

              // sub screen
              glViewport(subX, 0, sw, sh);
              glScissor(subX, 0, sw, sh);
              DrawTexQuad(iTexBot, EFalse);
              DrawSolid(p.bright_sub);

              if (!eglSwapBuffers((EGLDisplay)iDisplay, (EGLSurface)iSurface))
                  {
                  EGLint err = eglGetError();
                  Re4Log("gles: eglSwapBuffers failed %x", (unsigned)err);
                  if (err == EGL_CONTEXT_LOST)
                      {
                      Recover();
                      }
                  }
              }

          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_host.cpp <<'RE4_EOF'
          // Host services for the C side: memory, files (RFile), clock, lock, the game thread.
          #include <e32std.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>
          #include <e32debug.h>
          #include "re4ds.h"

          static RFastLock gLock;
          static TBool gLockMade;
          static RFs gFs;
          static RFile gFile[8];
          static TBool gUsed[8];
          static TFileName gRoot;

          extern "C" {

          void* host_alloc(size_t aSize)
              {
              void* p = User::Alloc((TInt)aSize);
              if (!p || aSize >= 262144)
                  {
                  Re4Log("alloc %d KB -> %s", (TInt)(aSize / 1024), p ? "ok" : "FAILED");
                  }
              return p;
              }
          void host_free(void* aPtr) { User::Free(aPtr); }
          void* host_realloc(void* aPtr, size_t aSize)
              {
              void* p = User::ReAlloc(aPtr, (TInt)aSize);
              if (!p)
                  {
                  Re4Log("realloc %d KB FAILED", (TInt)(aSize / 1024));
                  }
              return p;
              }

          unsigned host_ticks_ms(void)
              {
              TTime now;
              now.UniversalTime();
              return (unsigned)(now.Int64() / 1000);
              }

          void host_sleep_ms(unsigned aMs)
              {
              User::After(TTimeIntervalMicroSeconds32((TInt)aMs * 1000));
              }

          void host_lock(void) { if (gLockMade) gLock.Wait(); }
          void host_unlock(void) { if (gLockMade) gLock.Signal(); }

          // One line per call: open / append / close, so nothing is lost when the process dies.
          // Own file-server session per call, so it works from any thread and before the game thread exists.
          void host_log(const char* aMsg)
              {
              static TUint32 start = 0;
              TUint32 now = host_ticks_ms();
              if (!start)
                  {
                  start = now;
                  }
              TUint32 up = now - start;
              char stamped[280];
              snprintf(stamped, sizeof(stamped), "[%u.%03u] %s", (unsigned)(up / 1000), (unsigned)(up % 1000), aMsg);
              TPtrC8 m((const TUint8*)stamped);
              RDebug::RawPrint(m);
              RFs fs;
              if (fs.Connect() != KErrNone)
                  {
                  return;
                  }
              static const TText* const paths[] = { _S("E:\\RE4DS\\re4ds.log"), _S("C:\\Data\\re4ds.log") };
              for (TUint i = 0; i < sizeof(paths) / sizeof(paths[0]); ++i)
                  {
                  TFileName name(paths[i]);
                  fs.MkDirAll(name);
                  RFile f;
                  TInt err = f.Open(fs, name, EFileWrite | EFileShareAny);
                  if (err == KErrNotFound)
                      {
                      err = f.Create(fs, name, EFileWrite | EFileShareAny);
                      }
                  if (err == KErrNone)
                      {
                      TInt pos = 0;
                      f.Seek(ESeekEnd, pos);
                      TBuf8<256> line;
                      line.Append(m.Left(250));
                      line.Append(_L8("\r\n"));
                      f.Write(line);
                      f.Flush();
                      f.Close();
                      break;
                      }
                  }
              fs.Close();
              }

          void host_exit_thread(void)
              {
              User::Exit(0);
              }

          static void Resolve(const char* aPath, TFileName& aOut)
              {
              TPtrC8 src((const TUint8*)aPath);
              TInt skip = 0;
              aOut.Zero();
              if (src.Length() >= 7 && src.Left(7).Compare(_L8("nitro:/")) == 0)
                  {
                  aOut = gRoot;
                  aOut.Append(_L("nitrofs\\"));
                  skip = 7;
                  }
              else if (src.Length() >= 2 && src[1] == ':')
                  {
                  // already absolute
                  }
              else
                  {
                  aOut = gRoot;
                  }
              for (TInt i = skip; i < src.Length() && aOut.Length() < aOut.MaxLength(); ++i)
                  {
                  TUint c = src[i];
                  aOut.Append(TChar(c == '/' ? '\\' : c));
                  }
              }

          int host_fopen(const char* aPath, const char* aMode)
              {
              TInt h = -1;
              for (TInt i = 0; i < 8; ++i)
                  {
                  if (!gUsed[i]) { h = i; break; }
                  }
              if (h < 0) return -1;
              TFileName name;
              Resolve(aPath, name);
              TBool write = strchr(aMode, 'w') != NULL;
              TBool append = strchr(aMode, 'a') != NULL;
              TInt err;
              if (write)
                  {
                  err = gFile[h].Replace(gFs, name, EFileWrite | EFileShareAny);
                  }
              else if (append)
                  {
                  err = gFile[h].Open(gFs, name, EFileWrite | EFileShareAny);
                  if (err == KErrNotFound)
                      {
                      err = gFile[h].Create(gFs, name, EFileWrite | EFileShareAny);
                      }
                  if (err == KErrNone)
                      {
                      TInt pos = 0;
                      gFile[h].Seek(ESeekEnd, pos);
                      }
                  }
              else
                  {
                  err = gFile[h].Open(gFs, name, EFileRead | EFileShareAny);
                  }
              if (err != KErrNone)
                  {
                  Re4Log("fopen failed %d: %s", err, aPath);
                  return -1;
                  }
              gUsed[h] = ETrue;
              Re4Log("open %s", aPath);
              return h;
              }

          int host_fread(int aH, void* aBuf, int aN)
              {
              TPtr8 d((TUint8*)aBuf, 0, aN);
              TUint32 t0 = host_ticks_ms();
              TInt rerr = gFile[aH].Read(d, aN);
              if (aN >= 1048576)
                  {
                  Re4Log("read %d KB in %u ms (err %d)", aN / 1024, (unsigned)(host_ticks_ms() - t0), rerr);
                  }
              if (rerr != KErrNone)
                  {
                  Re4Log("read failed %d (%d bytes)", rerr, aN);
                  return -1;
                  }
              return d.Length();
              }

          int host_fwrite(int aH, const void* aBuf, int aN)
              {
              TPtrC8 d((const TUint8*)aBuf, aN);
              if (gFile[aH].Write(d) != KErrNone) return -1;
              return aN;
              }

          long host_fseek(int aH, long aOff, int aWhence)
              {
              TInt pos = (TInt)aOff;
              TSeek mode = aWhence == 0 ? ESeekStart : (aWhence == 1 ? ESeekCurrent : ESeekEnd);
              if (gFile[aH].Seek(mode, pos) != KErrNone) return -1;
              return pos;
              }

          void host_fclose(int aH)
              {
              gFile[aH].Close();
              gUsed[aH] = EFalse;
              }

          int host_remove(const char* aPath)
              {
              TFileName n;
              Resolve(aPath, n);
              return gFs.Delete(n) == KErrNone ? 0 : -1;
              }

          int host_rename(const char* aA, const char* aB)
              {
              TFileName a, b;
              Resolve(aA, a);
              Resolve(aB, b);
              gFs.Delete(b);
              return gFs.Rename(a, b) == KErrNone ? 0 : -1;
              }

          }  // extern "C"

          // Pick the first RE4DS folder that holds data\ (memory card first).
          static void PickRoot()
              {
              static const TText* const cand[] =
                  { _S("E:\\RE4DS\\"), _S("F:\\RE4DS\\"), _S("D:\\RE4DS\\"), _S("C:\\Data\\RE4DS\\"), _S("G:\\RE4DS\\") };
              gRoot.Copy(cand[0]);
              for (TUint i = 0; i < sizeof(cand) / sizeof(cand[0]); ++i)
                  {
                  TFileName probe(cand[i]);
                  probe.Append(_L("data"));
                  TEntry e;
                  if (gFs.Entry(probe, e) == KErrNone)
                      {
                      gRoot.Copy(cand[i]);
                      return;
                      }
                  }
              }

          void Re4Log(const char* aFmt, ...)
              {
              char buf[200];
              va_list ap;
              va_start(ap, aFmt);
              vsnprintf(buf, sizeof buf, aFmt, ap);
              va_end(ap);
              host_log(buf);
              }

          void Re4HostInitL()
              {
              if (!gLockMade)
                  {
                  User::LeaveIfError(gLock.CreateLocal());
                  gLockMade = ETrue;
                  }
              }

          void Re4HostShutdown()
              {
              }

          TInt Re4GameThread(TAny*)
              {
              CTrapCleanup* cleanup = CTrapCleanup::New();
              if (!cleanup)
                  {
                  return KErrNoMemory;
                  }
              Re4Log("game thread: started");
              Re4Log("addr re4_main=%08x swiWaitForVBlank=%08x Re4GameThread=%08x",
                     (unsigned)reinterpret_cast<TUint32>(&re4_main), (unsigned)reinterpret_cast<TUint32>(&swiWaitForVBlank),
                     (unsigned)reinterpret_cast<TUint32>(&Re4GameThread));
              if (gFs.Connect() == KErrNone)
                  {
                  PickRoot();
                  gFs.MkDirAll(gRoot);
                  TBuf8<128> r8;
                  r8.Copy(gRoot);
                  r8.ZeroTerminate();
                  Re4Log("game thread: data root %s", (const char*)r8.Ptr());
                  shim_load_databins();
                  Re4Log("game thread: calling re4_main");
                  re4_main();
                  Re4Log("game thread: re4_main returned");
                  gFs.Close();
                  }
              else
                  {
                  Re4Log("game thread: RFs connect failed");
                  }
              delete cleanup;
              return 0;
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_watch.cpp <<'RE4_EOF'
          // Independent watchdog thread: wakes once a second (higher priority than the UI and the game),
          // writes a status line and, when the game thread or the UI thread stops making progress, dumps
          // the shim's call trace and samples the stuck thread's program counter. Because it is its own
          // thread it still reports when the UI is frozen too.
          #include <e32base.h>
          #include <e32std.h>
          #include <hal.h>
          #include "re4ds.h"

          static volatile TBool gStop;
          static TThreadId gUiId;
          static TThreadId gGameId;
          static RThread gWatch;
          static TBool gWatchStarted;

          static void LogContext(const char* aWho, TThreadId aId)
              {
              RThread t;
              TInt err = t.Open(aId);
              if (err != KErrNone)
                  {
                  Re4Log("  %s: cannot open thread (%d)", aWho, err);
                  return;
                  }
              for (TInt i = 0; i < 3; ++i)
                  {
                  TUint32 regs[48];
                  Mem::FillZ(regs, sizeof(regs));
                  TPtr8 d((TUint8*)regs, 0, sizeof(regs));
                  t.Suspend();
                  t.Context(d);               // returns void on Symbian^3
                  err = KErrNone;
                  t.Resume();
                  Re4Log("  %s ctx%d err=%d pc=%08x lr=%08x sp=%08x", aWho, i, err, (unsigned)regs[15],
                         (unsigned)regs[14], (unsigned)regs[13]);
                  User::After(30000);
                  }
              t.Close();
              }

          static void LogTrace()
              {
              char buf[900];
              TInt n = shim_trace_dump(buf, sizeof(buf));
              Re4Log("  last API calls of the game (oldest first):");
              for (TInt off = 0; off < n; off += 170)
                  {
                  char part[176];
                  TInt len = n - off < 170 ? n - off : 170;
                  Mem::Copy(part, buf + off, len);
                  part[len] = 0;
                  Re4Log("    %s", part);
                  }
              }

          static TInt Re4WatchThread(TAny*)
              {
              CTrapCleanup* cleanup = CTrapCleanup::New();
              TUint lastFrame = shim_frame_no;
              TUint lastUi = shim_ui_ticks;
              TInt frameStall = 0, uiStall = 0;
              TBool deathLogged = EFalse;
              Re4Log("watchdog: running (1 line per second: frames/ui ticks gained, free RAM)");
              while (!gStop)
                  {
                  User::After(1000000);
                  if (gStop)
                      {
                      break;
                      }
                  TUint f = shim_frame_no;
                  TUint u = shim_ui_ticks;
                  TInt ramFree = 0;
                  HAL::Get(HALData::EMemoryRAMFree, ramFree);
                  RThread g;
                  TBool haveGame = g.Open(gGameId) == KErrNone;
                  char tail[120];
                  shim_trace_tail(tail, sizeof(tail), 5);
                  Re4Log("wd: frame +%u ui +%u | free RAM %d KB | in '%s' | %s", f - lastFrame,
                         u - lastUi, ramFree / 1024, shim_where ? shim_where : "?", tail);

                  if (haveGame && !deathLogged && g.ExitType() != EExitPending)
                      {
                      deathLogged = ETrue;
                      TExitCategoryName cat = g.ExitCategory();
                      TBuf8<KMaxExitCategoryName> cat8;
                      cat8.Copy(cat);
                      cat8.ZeroTerminate();
                      Re4Log("GAME THREAD DIED: type=%d reason=%d category=%s", (TInt)g.ExitType(), g.ExitReason(),
                             (const char*)cat8.Ptr());
                      LogTrace();
                      }
                  if (haveGame)
                      {
                      g.Close();
                      }

                  frameStall = (f == lastFrame && !shim_pause && !deathLogged) ? frameStall + 1 : 0;
                  uiStall = (u == lastUi) ? uiStall + 1 : 0;
                  lastFrame = f;
                  lastUi = u;

                  if (uiStall == 3 || (uiStall > 3 && uiStall % 10 == 0))
                      {
                      Re4Log("UI THREAD FROZEN for %d s (the window does not run its timer)", uiStall);
                      LogContext("UI", gUiId);
                      LogTrace();
                      }
                  if (frameStall == 3 || (frameStall > 3 && frameStall % 10 == 0))
                      {
                      Re4Log("GAME STALLED for %d s: no new frame, stuck in '%s'", frameStall, shim_where ? shim_where : "?");
                      LogContext("GAME", gGameId);
                      LogTrace();
                      }
                  }
              delete cleanup;
              return 0;
              }

          void Re4StartWatchdog(TThreadId aUi, TThreadId aGame)
              {
              gUiId = aUi;
              gGameId = aGame;
              gStop = EFalse;
              TInt err = gWatch.Create(_L("re4ds_wd"), Re4WatchThread, 0x8000, 0x10000, 0x100000, NULL, EOwnerProcess);
              Re4Log("watchdog thread create %d", err);
              if (err == KErrNone)
                  {
                  gWatch.SetPriority(EPriorityMore);
                  gWatch.Resume();
                  gWatchStarted = ETrue;
                  }
              }

          void Re4StopWatchdog()
              {
              gStop = ETrue;
              if (gWatchStarted)
                  {
                  for (TInt i = 0; i < 150 && gWatch.ExitType() == EExitPending; ++i)
                      {
                      User::After(10000);
                      }
                  if (gWatch.ExitType() == EExitPending)
                      {
                      gWatch.Kill(0);
                      }
                  gWatch.Close();
                  gWatchStarted = EFalse;
                  }
              }
