          /* ----------------------------------------------------------------- string */
          __attribute__((weak)) void *memcpy(void *d, const void *s, size_t n)
          {
              unsigned char *a = (unsigned char *)d; const unsigned char *b = (const unsigned char *)s;
              while (n--) *a++ = *b++;
              return d;
          }
          __attribute__((weak)) void *memmove(void *d, const void *s, size_t n)
          {
              unsigned char *a = (unsigned char *)d; const unsigned char *b = (const unsigned char *)s;
              if (a < b) while (n--) *a++ = *b++;
              else { a += n; b += n; while (n--) *--a = *--b; }
              return d;
          }
          __attribute__((weak)) void *memset(void *d, int c, size_t n)
          {
              unsigned char *a = (unsigned char *)d;
              while (n--) *a++ = (unsigned char)c;
              return d;
          }
          __attribute__((weak)) int memcmp(const void *x, const void *y, size_t n)
          {
              const unsigned char *a = (const unsigned char *)x, *b = (const unsigned char *)y;
              for (; n; n--, a++, b++) if (*a != *b) return *a - *b;
              return 0;
          }
          size_t strlen(const char *s) { size_t n = 0; while (s[n]) n++; return n; }
          char *strcpy(char *d, const char *s) { char *r = d; while ((*d++ = *s++)) {} return r; }
          char *strncpy(char *d, const char *s, size_t n)
          {
              size_t i = 0;
              for (; i < n && s[i]; i++) d[i] = s[i];
              for (; i < n; i++) d[i] = 0;
              return d;
          }
          int strcmp(const char *a, const char *b) { while (*a && *a == *b) { a++; b++; } return (unsigned char)*a - (unsigned char)*b; }
          int strncmp(const char *a, const char *b, size_t n)
          {
              for (; n; n--, a++, b++) { if (*a != *b) return (unsigned char)*a - (unsigned char)*b; if (!*a) break; }
              return 0;
          }
          char *strchr(const char *s, int c) { for (; *s; s++) if (*s == (char)c) return (char *)s; return c == 0 ? (char *)s : 0; }

          /* ----------------------------------------------------------------- stdlib */
          void *malloc(size_t n)
          {
              if (n >= 65536) shim_trace("malloc-big");
              return host_alloc(n ? n : 1);
          }
          void *calloc(size_t a, size_t b) { size_t n = a * b; void *p = host_alloc(n ? n : 1); if (p) memset(p, 0, n); return p; }
          void *realloc(void *p, size_t n) { return p ? host_realloc(p, n) : host_alloc(n ? n : 1); }
          void free(void *p) { if (p) host_free(p); }
          int abs(int x) { return x < 0 ? -x : x; }
          long labs(long x) { return x < 0 ? -x : x; }
          static unsigned rnd = 1;
          void srand(unsigned s) { rnd = s; }
          int rand(void) { rnd = rnd * 1103515245u + 12345u; return (int)((rnd >> 16) & 0x7FFF); }
          int atoi(const char *s)
          {
              int v = 0, neg = 0;
              while (*s == ' ') s++;
              if (*s == '-') { neg = 1; s++; }
              while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0');
              return neg ? -v : v;
          }
          void exit(int c) { (void)c; host_exit_thread(); for (;;) {} }
          time_t time(time_t *t) { time_t v = (time_t)(host_ticks_ms() / 1000); if (t) *t = v; return v; }

          /* ------------------------------------------------------------------ stdio */
          struct ShimFile { int h; };
          FILE *fopen(const char *path, const char *mode)
          {
              shim_trace("fopen");
              int h = host_fopen(path, mode);
              if (h < 0) return 0;
              FILE *f = (FILE *)malloc(sizeof(FILE));
              if (!f) { host_fclose(h); return 0; }
              f->h = h;
              return f;
          }
          int fclose(FILE *f) { shim_trace("fclose"); if (!f) return -1; host_fclose(f->h); free(f); return 0; }
          size_t fread(void *b, size_t s, size_t n, FILE *f)
          {
              shim_trace("fread");
              if (!f || !s || !n) return 0;
              int got = host_fread(f->h, b, (int)(s * n));
              return got <= 0 ? 0 : (size_t)got / s;
          }
          size_t fwrite(const void *b, size_t s, size_t n, FILE *f)
          {
              shim_trace("fwrite");
              if (!f || !s || !n) return 0;
              int put = host_fwrite(f->h, b, (int)(s * n));
              return put <= 0 ? 0 : (size_t)put / s;
          }
          int fseek(FILE *f, long off, int whence) { return host_fseek(f->h, off, whence) < 0 ? -1 : 0; }
          long ftell(FILE *f) { return host_fseek(f->h, 0, SEEK_CUR); }
          int remove(const char *p) { return host_remove(p); }
          int rename(const char *a, const char *b) { return host_rename(a, b); }

          typedef struct { char *p; size_t cap, n; } Out;
          static void put(Out *o, char c) { if (o->n + 1 < o->cap) o->p[o->n] = c; o->n++; }

          int vsnprintf(char *buf, size_t cap, const char *fmt, va_list ap)
          {
              Out o = { buf, cap, 0 };
              for (; *fmt; fmt++)
              {
                  if (*fmt != '%') { put(&o, *fmt); continue; }
                  fmt++;
                  int left = 0, zero = 0, width = 0, prec = -1;
                  for (;; fmt++)
                  {
                      if (*fmt == '-') left = 1;
                      else if (*fmt == '0') zero = 1;
                      else if (*fmt == '+' || *fmt == ' ' || *fmt == '#') {}
                      else break;
                  }
                  while (*fmt >= '0' && *fmt <= '9') width = width * 10 + (*fmt++ - '0');
                  if (*fmt == '.') { fmt++; prec = 0; while (*fmt >= '0' && *fmt <= '9') prec = prec * 10 + (*fmt++ - '0'); }
                  while (*fmt == 'l' || *fmt == 'h' || *fmt == 'z') fmt++;
                  char tmp[16];
                  const char *s = tmp;
                  int len = 0, neg = 0;
                  char c = *fmt;
                  if (c == '%') { put(&o, '%'); continue; }
                  if (c == 'c') { tmp[0] = (char)va_arg(ap, int); len = 1; }
                  else if (c == 's')
                  {
                      s = va_arg(ap, const char *);
                      if (!s) s = "(null)";
                      while (s[len] && (prec < 0 || len < prec)) len++;
                  }
                  else if (c == 'd' || c == 'i' || c == 'u' || c == 'x' || c == 'X')
                  {
                      unsigned v;
                      unsigned base = (c == 'x' || c == 'X') ? 16 : 10;
                      if (c == 'd' || c == 'i') { int sv = va_arg(ap, int); neg = sv < 0; v = neg ? 0u - (unsigned)sv : (unsigned)sv; }
                      else v = va_arg(ap, unsigned);
                      char rev[16]; int k = 0;
                      do { unsigned d = v % base; rev[k++] = (char)(d < 10 ? '0' + d : (c == 'X' ? 'A' : 'a') + d - 10); v /= base; } while (v);
                      if (neg) tmp[len++] = '-';
                      while (k) tmp[len++] = rev[--k];
                  }
                  else continue;
                  int pad = width > len ? width - len : 0;
                  if (!left && !zero) while (pad-- > 0) put(&o, ' ');
                  int i = 0;
                  if (neg && zero && !left) { put(&o, '-'); i = 1; while (pad-- > 0) put(&o, '0'); }
                  else if (zero && !left && c != 's' && c != 'c') while (pad-- > 0) put(&o, '0');
                  for (; i < len; i++) put(&o, s[i]);
                  if (left) while (pad-- > 0) put(&o, ' ');
              }
              if (cap) buf[o.n < cap ? o.n : cap - 1] = 0;
              return (int)o.n;
          }
          int snprintf(char *b, size_t n, const char *f, ...) { va_list ap; va_start(ap, f); int r = vsnprintf(b, n, f, ap); va_end(ap); return r; }
          int sprintf(char *b, const char *f, ...) { va_list ap; va_start(ap, f); int r = vsnprintf(b, 0x7FFFFFFF, f, ap); va_end(ap); return r; }
          int printf(const char *f, ...) { (void)f; return 0; }

          /* ------------------------------------------------------------------- math */
          static const double PI = 3.14159265358979323846;
          double fabs(double x) { return x < 0 ? -x : x; }
          float fabsf(float x) { return x < 0 ? -x : x; }
          double floor(double x)
          {
              if (x > 4e18 || x < -4e18) return x;
              long long i = (long long)x;
              return (double)(i > x ? i - 1 : i);
          }
          float floorf(float x) { return (float)floor(x); }
          double sqrt(double x)
          {
              if (x <= 0) return 0;
              union { double d; unsigned long long u; } v;
              v.d = x;
              v.u = 0x1FF7A3BEA91D9B1BULL + (v.u >> 1);
              double r = v.d;
              for (int i = 0; i < 5; i++) r = 0.5 * (r + x / r);
              return r;
          }
          float sqrtf(float x) { return (float)sqrt(x); }
          double sin(double x)
          {
              while (x > PI) x -= 2 * PI;
              while (x < -PI) x += 2 * PI;
              double x2 = x * x, t = x, s = x;
              for (int i = 1; i < 12; i++) { t *= -x2 / ((2 * i) * (2 * i + 1)); s += t; }
              return s;
          }
          double cos(double x) { return sin(x + PI / 2); }
          double tan(double x) { return sin(x) / cos(x); }
          float sinf(float x) { return (float)sin(x); }
          float cosf(float x) { return (float)cos(x); }
          float tanf(float x) { return (float)tan(x); }
          static double atan_unit(double x)       /* |x| <= 1 */
          {
              double x2 = x * x;
              return x * (0.9998660 + x2 * (-0.3302995 + x2 * (0.1801410 + x2 * (-0.0851330 + x2 * 0.0208351))));
          }
          double atan2(double y, double x)
          {
              if (x == 0 && y == 0) return 0;
              double ax = fabs(x), ay = fabs(y), a;
              if (ax >= ay) a = atan_unit(ay / ax); else a = PI / 2 - atan_unit(ax / ay);
              if (x < 0) a = PI - a;
              return y < 0 ? -a : a;
          }
          float atan2f(float y, float x) { return (float)atan2(y, x); }
          float asinf(float x)
          {
              if (x >= 1) return (float)(PI / 2);
              if (x <= -1) return (float)(-PI / 2);
              return (float)atan2(x, sqrt(1.0 - (double)x * x));
          }
          double exp(double x)
          {
              if (x > 80) x = 80;
              if (x < -80) return 0;
              const double ln2 = 0.69314718055994530942;
              int k = (int)floor(x / ln2 + 0.5);
              double r = x - k * ln2, t = 1, s = 1;
              for (int i = 1; i < 13; i++) { t *= r / i; s += t; }
              while (k > 0) { s *= 2; k--; }
              while (k < 0) { s *= 0.5; k++; }
              return s;
          }
          float expf(float x) { return (float)exp(x); }
