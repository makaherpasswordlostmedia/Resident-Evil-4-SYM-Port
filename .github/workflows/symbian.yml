          }

          static void advance(void)
          {
              while (pk_ncmds > 0)
              {
                  int c = pk_cmds & 255;
                  pk_cmds >>= 8;
                  pk_ncmds--;
                  if (!c) continue;
                  int n = nparams(c);
                  if (n == 0) exec(c, pk_param);
                  else { pk_cur = c; pk_need = n; pk_got = 0; return; }
              }
          }

          void shim_gx_push(u32 w)
          {
              if (pk_need)
              {
                  pk_param[pk_got++] = w;
                  if (pk_got >= pk_need) { int c = pk_cur; pk_need = 0; exec(c, pk_param); advance(); }
              }
              else { pk_cmds = w; pk_ncmds = 4; advance(); }
          }

          /* ------------------------------------------------------------------ DMA */
          void shim_dma_run(void)
          {
              for (int again = 1; again;)
              {
                  again = 0;
                  for (int ch = 0; ch < 4; ch++)
                  {
                      ShimDma *d = &shim_dma[ch];
                      if (!(d->cr & DMA_ENABLE)) continue;
                      u32 cr = d->cr, words = cr & 0x1FFFFF;
                      const u32 *src = (const u32 *)(uintptr_t)d->src;
                      d->cr = cr & ~DMA_ENABLE;
                      if (d->dest == (u32)(uintptr_t)&shim_gfx_fifo_reg)
                          for (u32 i = 0; i < words; i++) shim_gx_push(src[i]);
                      if (cr & DMA_IRQ_REQ)
                      {
                          IntFn f = shim_irq_handler(8 + ch);
                          if (f) { f(); again = 1; }
                      }
                  }
              }
          }

          int dmaBusy(int ch) { (void)ch; shim_dma_run(); return 0; }
