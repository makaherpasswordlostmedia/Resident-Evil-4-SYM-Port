              return put <= 0 ? 0 : (size_t)put / s;
          }
          int fseek(FILE *f, long off, int whence) { return host_fseek(f->h, off, whence) < 0 ? -1 : 0; }
          long ftell(FILE *f) { return host_fseek(f->h, 0, SEEK_CUR); }
