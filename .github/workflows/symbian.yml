              int distinct = 0;
              for (int x = 0; x < 256; x++) if (shim_top[170 * 256 + x] != shim_top[170 * 256 + (x ? x - 1 : 0)]) distinct++;
              CHECK(distinct >= 2, "checker pattern visible along a floor scanline");
              fprintf(stderr, fails ? "render test FAILED\n" : "render test OK\n");
