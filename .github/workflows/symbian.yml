          // dsshim.c - everything of libnds except the geometry engine (gx.c): maths, input, timing,
          // sprites, sub-screen bitmap, console, sound mixing.
          #include "nds.h"
          #include <stdarg.h>

          void host_exit_thread(void);
          void shim_dma_run(void);
          extern u32 shim_fb3d[256 * 192];

          /* ------------------------------------------------------------------ maths */
          static double my_sin(double x)
          {
              const double pi = 3.14159265358979323846;
              while (x > pi) x -= 2 * pi;
              while (x < -pi) x += 2 * pi;
              double x2 = x * x, t = x, s = x;
              for (int i = 1; i < 12; i++)
              {
                  t *= -x2 / ((2 * i) * (2 * i + 1));
                  s += t;
              }
              return s;
          }

          static s16 sin_tab[513];
          static int tab_ok;

          static void init_tab(void)
          {
              for (int i = 0; i <= 512; i++)
              {
                  double v = my_sin(6.28318530717958647692 * i / 512.0) * 4096.0;
                  sin_tab[i] = (s16)(v >= 0 ? v + 0.5 : v - 0.5);
              }
              tab_ok = 1;
          }

          int sinLerp(s16 a)
          {
              if (!tab_ok) init_tab();
              u32 ang = (u16)a & 0x7FFF;
              int i = ang >> 6, f = ang & 63;
              return sin_tab[i] + (((sin_tab[i + 1] - sin_tab[i]) * f) >> 6);
          }
          int cosLerp(s16 a) { return sinLerp((s16)(a + 8192)); }
          int tanLerp(s16 a)
          {
              double ang = 6.28318530717958647692 * ((u16)a & 0x7FFF) / 32768.0;
              double c = my_sin(ang + 1.57079632679489661923);
              if (c > -1e-6 && c < 1e-6) return 0x7FFFFFF;
              return (int)(my_sin(ang) / c * 4096.0);
          }

          u32 sqrt64(u64 a)
          {
              u64 r = 0, bit = (u64)1 << 62;
              while (bit > a) bit >>= 2;
              while (bit)
              {
                  if (a >= r + bit) { a -= r + bit; r = (r >> 1) + bit; }
                  else r >>= 1;
                  bit >>= 2;
              }
              return (u32)r;
          }
          u32 sqrt32(u32 a) { return sqrt64(a); }

          /* ------------------------------------------------------------------ input */
          static volatile u32 in_keys;
          static volatile int in_touch, in_tx, in_ty;
          static u32 k_held, k_down, k_up;
          volatile int shim_quit;
          volatile int shim_pause;

          void shim_set_input(u32 keys, int touch_down, int tx, int ty)
          {
              in_keys = keys; in_touch = touch_down; in_tx = tx; in_ty = ty;
          }
          void shim_request_quit(void) { shim_quit = 1; }

          void scanKeys(void)
          {
              u32 now = in_keys & 0xFFF;
              if (in_touch) now |= KEY_TOUCH;
              k_down = now & ~k_held;
              k_up = k_held & ~now;
              k_held = now;
          }
          u32 keysHeld(void) { return k_held; }
          u32 keysDown(void) { return k_down; }
          u32 keysUp(void) { return k_up; }
          void touchRead(touchPosition *t)
          {
              int x = in_tx, y = in_ty;
              if (x < 0) x = 0; if (x > 255) x = 255;
              if (y < 0) y = 0; if (y > 191) y = 191;
              t->px = (u16)x; t->py = (u16)y; t->rawx = (u16)(x << 4); t->rawy = (u16)(y << 4); t->z1 = 1; t->z2 = 0;
          }

          /* ------------------------------------------------------------ misc system */
          static IntFn irq_fn[32];
          void irqSet(u32 mask, IntFn fn)
          {
              for (int i = 0; i < 32; i++)
                  if (mask & (1u << i)) irq_fn[i] = fn;
          }
          void irqEnable(u32 mask) { (void)mask; }
          IntFn shim_irq_handler(int bit) { return irq_fn[bit & 31]; }
          int enterCriticalSection(void) { return 0; }
          void leaveCriticalSection(int old) { (void)old; }

          vu16 shim_bldcnt, shim_bldy;
          void videoSetMode(u32 m) { (void)m; }
          void videoSetModeSub(u32 m) { (void)m; }
          bool nitroFSInit(char **p) { (void)p; return true; }
          bool fatInitDefault(void) { return true; }
          const char *fatGetDefaultDrive(void) { return ""; }

          static u32 vb_next3;         /* next vblank time, in 1/3 ms */
          volatile u32 shim_frame_no;
          volatile u32 shim_present_count;     /* bumped by every shim_present: the front end redraws only on a change */
          volatile int shim_skip_render;       /* 1: the next 3D pass (glFlush) is skipped, the last picture stays */
          volatile int shim_frameskip_enable;  /* set by the Symbian front end only (the host test keeps every frame) */
          volatile u32 shim_last_render;       /* host_ticks_ms() when the last 3D pass finished */
          static int skip_run, skip_present;
          #define SHIM_MAX_SKIP 30
          #define SHIM_MAX_STALE_MS 90        /* the picture is never older than this (about 11 fps on screen at worst) */
          void shim_present(void);

          void swiWaitForVBlank(void)
          {
              shim_dma_run();
              /* a frame whose 3D pass was skipped shows nothing new: only now and then update sprites / sub screen */
              if (!shim_skip_render || ++skip_present >= 4)
              {
                  skip_present = 0;
                  shim_present();
              }
              if (shim_pause)
              {
                  while (shim_pause && !shim_quit) host_sleep_ms(40);
                  vb_next3 = 0;
              }
              u32 now = host_ticks_ms();
              if (!vb_next3) vb_next3 = now * 3;
              vb_next3 += 50;                         /* 16.67 ms */
              int late = (int)(now - vb_next3 / 3);   /* ms behind the 60 Hz schedule */
              if (late < 0)
              {
                  host_sleep_ms((unsigned)-late);
                  shim_skip_render = 0; skip_run = 0;
              }
              else if (shim_frameskip_enable && late > 4 && skip_run < SHIM_MAX_SKIP && (now - shim_last_render) < SHIM_MAX_STALE_MS)
              {
                  /* behind: drop the next frame's rasterising (the costly part), keep the game logic on time */
                  shim_skip_render = 1; skip_run++;
              }
              else
              {
                  shim_skip_render = 0; skip_run = 0;
              }
              if (late > (shim_frameskip_enable ? 1500 : 100)) vb_next3 = now * 3;   /* a long stall: do not chase it */
              IntFn f = irq_fn[0];
              if (f) f();
              shim_frame_no++;
              if (shim_frame_no == 1 || shim_frame_no == 2 || shim_frame_no == 60 || shim_frame_no == 600)
              {
                  char m[64];
                  snprintf(m, sizeof m, "vblank frame %u", (unsigned)shim_frame_no);
                  host_log(m);
              }
              if (shim_quit) host_exit_thread();
          }

