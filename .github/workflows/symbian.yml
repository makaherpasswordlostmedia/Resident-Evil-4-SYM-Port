          int shim_audio_mix(s16 *out, int frames)
          {
              host_lock();
              for (int f = 0; f < frames; f++)
              {
                  int l = 0, r = 0;
                  for (int i = 0; i < 16; i++)
                  {
                      Chan *c = &chan[i];
                      if (!c->active) continue;
                      c->acc += c->step;
                      while (c->acc >= 65536 && c->active) { c->acc -= 65536; chan_next(c); }
                      if (!c->active) continue;
                      int s = c->prev + (int)(((s64)(c->cur - c->prev) * (c->acc & 0xFFFF)) >> 16);
