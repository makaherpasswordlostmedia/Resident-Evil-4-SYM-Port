          void CRe4Container::SetForeground(TBool aForeground)
              {
              iBackground = !aForeground;
              iDirty = ETrue;
              shim_pause = aForeground ? 0 : 1;
              if (iAudio)
                  {
                  if (aForeground)
                      {
                      iAudio->Resume();
                      }
                  else
                      {
                      iAudio->Suspend();
                      }
                  }
              if (!aForeground)
                  {
                  iKeyBits = 0;
                  iPadBits = 0;
                  iTouch = EFalse;
