          /* glesr.c - OpenGL ES 2.0 back end for the software GX (gx.c collects and clips the DS polygons;
             this draws them on the GPU into a 256x192 pbuffer and reads the picture back into shim_fb3d).
             This file must not include nds.h: that header renames the shim's own gl* functions,
             whose names are the real GL ones used below. */
          #include <stdlib.h>
          #include <string.h>

          int glesr_init(void);
          void glesr_tex_upload(int id, int w, int h, const unsigned int *argb, int rep_s, int rep_t);
          void glesr_tex_free(int id);
          void glesr_fog(const unsigned char *lut, int r, int g, int b);
          void glesr_begin(int cr, int cg, int cb);
          void glesr_draw(const float *v, int nv, int tex, int blend, int depthwrite);
          void glesr_end(unsigned int *out);


          typedef unsigned int GLenum, GLuint, GLbitfield;
          typedef int GLint, GLsizei;
          typedef unsigned char GLboolean;
          typedef float GLfloat;
          typedef char GLchar;
          typedef void *EGLDisplay, *EGLConfig, *EGLSurface, *EGLContext;
          typedef int EGLint;
          typedef unsigned int EGLBoolean;

          EGLDisplay eglGetDisplay(void *id);
          EGLBoolean eglInitialize(EGLDisplay d, EGLint *major, EGLint *minor);
          EGLBoolean eglBindAPI(unsigned int api);
          EGLBoolean eglChooseConfig(EGLDisplay d, const EGLint *attr, EGLConfig *cfg, EGLint size, EGLint *num);
          EGLSurface eglCreatePbufferSurface(EGLDisplay d, EGLConfig cfg, const EGLint *attr);
          EGLContext eglCreateContext(EGLDisplay d, EGLConfig cfg, EGLContext share, const EGLint *attr);
          EGLBoolean eglMakeCurrent(EGLDisplay d, EGLSurface draw, EGLSurface read, EGLContext ctx);

          GLuint glCreateShader(GLenum type);
          void glShaderSource(GLuint s, GLsizei count, const GLchar *const *src, const GLint *len);
          void glCompileShader(GLuint s);
          void glGetShaderiv(GLuint s, GLenum pname, GLint *p);
          GLuint glCreateProgram(void);
          void glAttachShader(GLuint p, GLuint s);
          void glBindAttribLocation(GLuint p, GLuint i, const GLchar *name);
          void glLinkProgram(GLuint p);
          void glGetProgramiv(GLuint p, GLenum pname, GLint *v);
          void glUseProgram(GLuint p);
          GLint glGetUniformLocation(GLuint p, const GLchar *name);
          void glUniform1i(GLint loc, GLint v);
          void glUniform3f(GLint loc, GLfloat a, GLfloat b, GLfloat c);
          void glEnableVertexAttribArray(GLuint i);
          void glVertexAttribPointer(GLuint i, GLint size, GLenum type, GLboolean norm, GLsizei stride, const void *ptr);
          void glDrawArrays(GLenum mode, GLint first, GLsizei count);
          void glGenTextures(GLsizei n, GLuint *t);
          void glDeleteTextures(GLsizei n, const GLuint *t);
          void glBindTexture(GLenum target, GLuint t);
          void glActiveTexture(GLenum unit);
          void glTexParameteri(GLenum target, GLenum pname, GLint v);
          void glTexImage2D(GLenum target, GLint level, GLint ifmt, GLsizei w, GLsizei h, GLint border, GLenum fmt, GLenum type, const void *px);
          void glPixelStorei(GLenum pname, GLint v);
          void glViewport(GLint x, GLint y, GLsizei w, GLsizei h);
          void glClearColor(GLfloat r, GLfloat g, GLfloat b, GLfloat a);
          void glClearDepthf(GLfloat d);
          void glClear(GLbitfield m);
          void glEnable(GLenum cap);
          void glDisable(GLenum cap);
          void glDepthFunc(GLenum f);
          void glDepthMask(GLboolean m);
          void glBlendFunc(GLenum s, GLenum d);
          void glReadPixels(GLint x, GLint y, GLsizei w, GLsizei h, GLenum fmt, GLenum type, void *px);

          #define GLV 11                         /* floats per vertex: pos4 uv2 colour+alpha4 fog1 */
          #define MAXT 640

          static GLuint prog, white_tex, fog_tex, gl_tex[MAXT];
          static GLint loc_tex, loc_fog, loc_fogc;
          static float fog_c[3];
          static unsigned char *rb;

          static const char *vs_src =
              "attribute vec4 a_pos;\n"
              "attribute vec2 a_uv;\n"
              "attribute vec4 a_col;\n"
              "attribute float a_fog;\n"
              "varying vec2 v_uv;\n"
              "varying vec4 v_col;\n"
              "varying float v_fog;\n"
              "void main() { gl_Position = a_pos; v_uv = a_uv; v_col = a_col; v_fog = a_fog; }\n";

          static const char *fs_src =
              "#ifdef GL_FRAGMENT_PRECISION_HIGH\n"
              "precision highp float;\n"
              "#else\n"
              "precision mediump float;\n"
              "#endif\n"
              "uniform sampler2D u_tex;\n"
              "uniform sampler2D u_fogtab;\n"
              "uniform vec3 u_fogc;\n"
              "varying vec2 v_uv;\n"
              "varying vec4 v_col;\n"
              "varying float v_fog;\n"
              "void main() {\n"
              "  vec4 t = texture2D(u_tex, v_uv);\n"
              "  if (t.a < 0.01) discard;\n"
              "  vec3 c = t.rgb * v_col.rgb;\n"
              "  float a = v_col.a;\n"
              "  if (t.a < 0.97) a *= t.a;\n"
              "  if (v_fog > 0.5) {\n"
              "    float zi = floor(gl_FragCoord.z * 32767.0 + 0.5);\n"
              "    float row = floor(zi / 256.0);\n"
              "    float col = zi - row * 256.0;\n"
              "    float f = texture2D(u_fogtab, vec2((col + 0.5) / 256.0, (row + 0.5) / 128.0)).r * 0.9961;\n"
              "    c = mix(c, u_fogc, f);\n"
              "  }\n"
              "  gl_FragColor = vec4(c, a);\n"
              "}\n";

          static GLuint compile(GLenum type, const char *src)
          {
              GLuint s = glCreateShader(type);
              GLint ok = 0;
              if (!s) return 0;
              glShaderSource(s, 1, &src, 0);
              glCompileShader(s);
              glGetShaderiv(s, 0x8B81, &ok);            /* GL_COMPILE_STATUS */
              return ok ? s : 0;
          }

          static void new_tex(GLuint *t)
          {
              glGenTextures(1, t);
              glBindTexture(0x0DE1, *t);
              glTexParameteri(0x0DE1, 0x2800, 0x2600);  /* MAG, NEAREST */
              glTexParameteri(0x0DE1, 0x2801, 0x2600);  /* MIN, NEAREST */
              glTexParameteri(0x0DE1, 0x2802, 0x812F);  /* clamp to edge */
              glTexParameteri(0x0DE1, 0x2803, 0x812F);
          }

          int glesr_init(void)
          {
              EGLint maj, min, n = 0;
              EGLConfig cfg;
              EGLDisplay d = eglGetDisplay((void *)0);
              if (!d || !eglInitialize(d, &maj, &min)) return 0;
              if (!eglBindAPI(0x30A0)) return 0;                                   /* EGL_OPENGL_ES_API */
              {
                  const EGLint ca[] = { 0x3033, 1, 0x3040, 4, 0x3024, 8, 0x3023, 8, 0x3022, 8, 0x3025, 16, 0x3038 };
                  if (!eglChooseConfig(d, ca, &cfg, 1, &n) || n < 1) return 0;
              }
              {
                  const EGLint pa[] = { 0x3057, 256, 0x3056, 192, 0x3038 };
                  const EGLint xa[] = { 0x3098, 2, 0x3038 };
                  EGLSurface s = eglCreatePbufferSurface(d, cfg, pa);
                  EGLContext c;
                  if (!s) return 0;
                  c = eglCreateContext(d, cfg, (void *)0, xa);
                  if (!c || !eglMakeCurrent(d, s, s, c)) return 0;
              }
              {
                  GLuint vs = compile(0x8B31, vs_src), fs = compile(0x8B30, fs_src);
                  GLint ok = 0;
                  if (!vs || !fs) return 0;
                  prog = glCreateProgram();
                  glAttachShader(prog, vs);
                  glAttachShader(prog, fs);
                  glBindAttribLocation(prog, 0, "a_pos");
                  glBindAttribLocation(prog, 1, "a_uv");
                  glBindAttribLocation(prog, 2, "a_col");
                  glBindAttribLocation(prog, 3, "a_fog");
                  glLinkProgram(prog);
                  glGetProgramiv(prog, 0x8B82, &ok);                               /* GL_LINK_STATUS */
                  if (!ok) return 0;
              }
              glUseProgram(prog);
              loc_tex = glGetUniformLocation(prog, "u_tex");
              loc_fog = glGetUniformLocation(prog, "u_fogtab");
              loc_fogc = glGetUniformLocation(prog, "u_fogc");
              glPixelStorei(0x0CF5, 1);                                            /* unpack alignment */
              {
                  static const unsigned char white[4] = { 255, 255, 255, 255 };
                  new_tex(&white_tex);
                  glTexImage2D(0x0DE1, 0, 0x1908, 1, 1, 0, 0x1908, 0x1401, white);
                  new_tex(&fog_tex);
              }
              rb = (unsigned char *)malloc(256 * 192 * 4);
              return rb != 0;
          }

          void glesr_tex_upload(int id, int w, int h, const unsigned int *argb, int rep_s, int rep_t)
          {
              unsigned char *t;
              int n = w * h;
              if (id <= 0 || id >= MAXT || !argb) return;
              t = (unsigned char *)malloc((size_t)n * 4);
              if (!t) return;
              for (int i = 0; i < n; i++)
              {
                  unsigned int c = argb[i];
                  t[i * 4] = (unsigned char)(c >> 16);
                  t[i * 4 + 1] = (unsigned char)(c >> 8);
                  t[i * 4 + 2] = (unsigned char)c;
                  t[i * 4 + 3] = (unsigned char)(c >> 24);
              }
              if (!gl_tex[id]) new_tex(&gl_tex[id]);
              glBindTexture(0x0DE1, gl_tex[id]);
              glTexParameteri(0x0DE1, 0x2802, rep_s ? 0x2901 : 0x812F);
              glTexParameteri(0x0DE1, 0x2803, rep_t ? 0x2901 : 0x812F);
              glTexImage2D(0x0DE1, 0, 0x1908, w, h, 0, 0x1908, 0x1401, t);
              free(t);
          }

          void glesr_tex_free(int id)
          {
              if (id > 0 && id < MAXT && gl_tex[id])
              {
                  glDeleteTextures(1, &gl_tex[id]);
                  gl_tex[id] = 0;
              }
          }

          void glesr_fog(const unsigned char *lut, int r, int g, int b)
          {
              fog_c[0] = r / 255.0f; fog_c[1] = g / 255.0f; fog_c[2] = b / 255.0f;
              if (lut)
              {
                  unsigned char *t = (unsigned char *)malloc(0x8000);
                  if (!t) return;
                  for (int i = 0; i < 0x8000; i++) t[i] = (unsigned char)(lut[i] * 2);
                  glBindTexture(0x0DE1, fog_tex);
                  glTexImage2D(0x0DE1, 0, 0x1909, 256, 128, 0, 0x1909, 0x1401, t);   /* LUMINANCE */
                  free(t);
              }
          }

          void glesr_begin(int cr, int cg, int cb)
          {
              glUseProgram(prog);
              glViewport(0, 0, 256, 192);
              glEnable(0x0B71);                                                    /* depth test */
              glDepthFunc(0x0201);                                                 /* LESS */
              glDepthMask(1);
              glDisable(0x0BE2);                                                   /* blend */
              glDisable(0x0B44);                                                   /* cull face */
              glClearColor((cr << 3 | cr >> 2) / 255.0f, (cg << 3 | cg >> 2) / 255.0f, (cb << 3 | cb >> 2) / 255.0f, 1.0f);
              glClearDepthf(1.0f);
              glClear(0x4100);                                                     /* colour + depth */
              glUniform1i(loc_tex, 0);
              glUniform1i(loc_fog, 1);
              glUniform3f(loc_fogc, fog_c[0], fog_c[1], fog_c[2]);
              glActiveTexture(0x84C1);
              glBindTexture(0x0DE1, fog_tex);
              glActiveTexture(0x84C0);
              for (int i = 0; i < 4; i++) glEnableVertexAttribArray(i);
          }

          void glesr_draw(const float *v, int nv, int tex, int blend, int depthwrite)
          {
              const GLsizei stride = GLV * 4;
              glBindTexture(0x0DE1, (tex > 0 && tex < MAXT && gl_tex[tex]) ? gl_tex[tex] : white_tex);
              if (blend) { glEnable(0x0BE2); glBlendFunc(0x0302, 0x0303); } else glDisable(0x0BE2);
              glDepthMask(depthwrite ? 1 : 0);
              glVertexAttribPointer(0, 4, 0x1406, 0, stride, v);
              glVertexAttribPointer(1, 2, 0x1406, 0, stride, v + 4);
              glVertexAttribPointer(2, 4, 0x1406, 0, stride, v + 6);
              glVertexAttribPointer(3, 1, 0x1406, 0, stride, v + 10);
              glDrawArrays(4, 0, nv);                                              /* GL_TRIANGLES */
          }

          void glesr_end(unsigned int *out)
          {
              glDepthMask(1);
              glReadPixels(0, 0, 256, 192, 0x1908, 0x1401, rb);
              for (int i = 0; i < 256 * 192; i++)
                  out[i] = (unsigned int)rb[i * 4] << 16 | (unsigned int)rb[i * 4 + 1] << 8 | rb[i * 4 + 2];
          }
