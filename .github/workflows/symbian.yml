name: Build Symbian^3 SIS (RE4 DS)

# SELF-CONTAINED: this single file carries the whole Symbian layer (symbian/ tree) and writes it at
# build time on top of the original ds/source of this repository.
#
#   sources   - writes symbian/, patches + prepares the game sources (tools/prepare.sh)
#   host-test - PC checks: whole game compiles/links against the software DS layer, a freestanding
#               32-bit pass with only our own libc headers, a rasterizer smoke test
#   build-sis - Symbian^3 toolchain (fieldops-dev/symbian3-toolchain, macos-14 arm64 runner); the
#               first run builds GCC (about 1.5-2 h) and caches it, later runs take minutes
#
# ONE FILE FOR EVERYTHING. Push/PR/tag = build the .sisx. Run workflow with convert=true = convert the
# Zeebo zip into E:\RE4DS\data + nitrofs on a Windows runner (job convert-data), no PC needed.
#
# The .sisx contains only the program. Game data goes to E:\RE4DS\data and E:\RE4DS\nitrofs
# (see symbian/README.md).

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      convert:
        description: 'Run ONLY the game-data conversion (Windows) instead of the build'
        type: boolean
        default: false
      gdrive_id:
        description: '[convert] Google Drive file ID of the Zeebo zip (shared as Anyone with the link)'
        required: false
        default: ''
      zip_url:
        description: '[convert] direct download URL of the Zeebo zip (if no gdrive_id)'
        required: false
        default: ''
      release_tag:
        description: '[convert] release tag of this repo that holds the zip (if no gdrive_id / zip_url)'
        required: false
        default: 'zeebo'

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.convert) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate symbian/ tree
        run: |
          set -e
          mkdir -p symbian
          cat > symbian/README.md <<'RE4_EOF'
          # Resident Evil 4 DS port - Symbian^3 layer

          The game code in `ds/source` (C, libnds) is built **unmodified except for two small patches**
          (`tools/prepare.sh`) on top of a software implementation of the parts of the Nintendo DS the
          game uses. Nothing here is a rewrite of the game.

          ```
          shim/        the "DS": nds.h (libnds subset), gx.c (3D engine + rasterizer), dsshim.c (sprites,
                       sub screen, sound mixer, input, timing), rt.c (mini libc/libm, no Open C needed)
          app/         Symbian front end: Avkon app, game thread, both screens, touch pad, audio, files
          group/       bld.inf + re4ds.mmp.in (the .mmp is generated by tools/prepare.sh)
          tools/       prepare.sh (patches + data loader), host_check.sh (CI checks on the PC)
          ```

          ## What the shim emulates

          * **GX**: matrix stacks, projection / look-at, packed command lists + DMA to the FIFO (the models'
            display lists), triangles / quads / strips, near-plane clipping, culling, 2048 polygon /
            6144 vertex limits and the polygon-RAM counters the game's LOD logic reads. The clipped polygons
            go to the **GLES 2.0 renderer** (`app/src/re4ds_gl.cpp`, the only renderer - there is no software
            rasterizer): perspective-correct 256-colour and A5I3 textures, vertex colour, translucency (opaque
            pass first, then translucent), depth test, fog table, clear colour, all on the GPU.
          * **2D**: the 32x16 text sprites of `text.c` (incl. the 2x affine scale), the 256x256 sub-screen
            bitmap, console text, brightness fades, main/sub screen swap for cut-ins.
          * **Sound**: 8-bit and IMA-ADPCM channels (the game's SFX bank and looped music) mixed at 22.05 kHz stereo.
          * **System**: 60 Hz vblank pacing, keys + touch, `fopen("nitro:/...")`, save file.

          Not emulated (the game does not use them): lighting, toon shading, edge marking, texture matrix,
          compressed textures, box/pos/vec tests.

          ## Putting the game on the phone

          The `.sisx` only contains the program. The game data you build with `build.ps1` goes to the
          memory card (first of `E:\RE4DS\`, `F:\RE4DS\`, `D:\RE4DS\`, `C:\Data\RE4DS\` that has a `data` folder):

          ```
          E:\RE4DS\data\*.bin       <- ds/data/*.bin      (what the DS build embeds in the ROM)
          E:\RE4DS\nitrofs\*.bin    <- ds/nitrofs/*.bin   (what the DS build reads from NitroFS)
          E:\RE4DS\re4ds.sav        <- created by the game
          ```

          If a file is missing the bottom screen lists it.

          ## Controls

          On-screen pad (landscape): D-pad, A B X Y, L R, SEL, START. Touching the right-hand (bottom DS) screen
          is the DS touch screen. Keyboard phones: arrows, Enter/Z = A, Backspace/X = B, S = X, A = Y,
          Q = L, W = R, Space = Start, E = Select. QUIT: tap twice within 2 s. Single-touch phones cannot hold
          the pad and the touch screen at the same time.

          ## Status / known limits

          * GLES 2.0 is required. If the device cannot start EGL/GLES 2 the window says so (code + `re4ds.log`) and the game is not started. The build fails if the SDK has no EGL/GLES2.
          * Written without access to a Symbian build; the CI is the first real compile of `app/` and the
            Symbian-specific bits. What *is* verified on every run (job `host-test`): the whole game
            compiles and links against the shim, a freestanding 32-bit pass with only our own libc headers,
            and a smoke test of the GX front end / GLES hand-off (textures, batches, alpha, uv).
          * Speed is untested on hardware. The CPU only transforms/clips the polygons; the GPU draws them.
          * Memory: all `data/*.bin` are read into the game thread's heap (the UI heap is shared with the game, 96 MB max).
          RE4_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/re4ds.rss <<'RE4_EOF'
          NAME RE4D

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "RE4 DS";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "RE4 DS";
                  number_of_icons = 0;
                  };
              }
          RE4_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/re4ds_reg.rss <<'RE4_EOF'
          #include <appinfo.rh>
          #include <re4ds.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5B0CE

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "re4ds";
              localisable_resource_file = "\\resource\\apps\\re4ds";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          RE4_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/re4ds.h <<'RE4_EOF'
          // re4ds.h - Symbian^3 front end for the Resident Evil 4 DS port (software DS layer in shim/).
          #ifndef RE4DS_H
          #define RE4DS_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <mdaaudiooutputstream.h>

          #include "gl_iface.h"

          const TUid KUidRe4Ds = { (TInt32)0xE1A5B0CE };

          // ---- the C side (shim/) ----
          extern "C"
              {
              extern unsigned int shim_top[256 * 192];
              extern unsigned int shim_bot[256 * 192];
              extern char shim_console[2048];
              extern volatile int shim_console_on;
              extern volatile int shim_quit;
              extern volatile int shim_pause;
              extern volatile unsigned int shim_frame_no;
              extern const char* volatile shim_where;
              extern volatile unsigned int shim_ui_ticks;
              int shim_trace_dump(char* aBuf, int aCap);
              int shim_trace_tail(char* aBuf, int aCap, int aN);
              void swiWaitForVBlank(void);
              void shim_set_input(unsigned aKeys, int aTouchDown, int aX, int aY);
              int shim_audio_mix(short* aStereo, int aFrames);
              int shim_load_databins(void);
              int re4_main(void);
              void host_lock(void);
              void host_unlock(void);
              }

          // ---- host services (re4ds_host.cpp) ----
          void Re4Log(const char* aFmt, ...);   // appends a line to E:\\RE4DS\\re4ds.log (any thread)
          void Re4StartWatchdog(TThreadId aUi, TThreadId aGame);
          void Re4StopWatchdog();
          void Re4HostInitL();            // UI thread: lock + file root
          void Re4HostShutdown();
          TInt Re4GameThread(TAny*);      // the game's thread

          // DS key bits (same values as the shim's KEY_*)
          enum
              {
              KDsA = 1 << 0, KDsB = 1 << 1, KDsSelect = 1 << 2, KDsStart = 1 << 3,
              KDsRight = 1 << 4, KDsLeft = 1 << 5, KDsUp = 1 << 6, KDsDown = 1 << 7,
              KDsR = 1 << 8, KDsL = 1 << 9, KDsX = 1 << 10, KDsY = 1 << 11
              };

          // Audio: pulls 22.05 kHz stereo PCM16 from the shim mixer, buffer by buffer.
          class CRe4Audio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CRe4Audio* NewL();
              ~CRe4Audio();
              void Suspend();
              void Resume();

              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              void OpenStream();
              void Fill(TInt aSlot);

              enum { KSlots = 3, KFrames = 1024, KBytes = KFrames * 4 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iSuspended;
              TBuf8<KBytes> iSlot[KSlots];
              };

          // GLES 2.0 renderer (re4ds_gl.cpp). The only renderer: if the device cannot bring EGL/GLES 2.0 up,
          // the window says so and the game does not start.
          class CRe4Gl : public CBase
              {
          public:
              static CRe4Gl* NewL(RWindow& aWindow);     // leaves with KErrNotSupported when GLES 2 is not usable
              ~CRe4Gl();
              void Render();                             // one frame (UI thread only)

          private:
              void ConstructL(RWindow& aWindow);
              void InitEgl(RWindow& aWindow);
              void InitGl();
              void Teardown(TBool aKeepTextures);
              void Recover();
              void PumpTextures();
              void CreateGlTex(TInt aId);
              void FreeTex(TInt aId);
              void UploadScreens();
              void DrawGeo(const ShimGlGeo& aGeo);
              void DrawTexQuad(TUint aTex, TBool aBlend);
              void DrawSolid(TInt aLevel);               // black (<0 fade) / white (>0) overlay, |level| / 16

              enum { KMaxTex = 640 };
              struct TTex
                  {
                  TUint iName;
                  TUint32* iPx;
                  TInt iW, iH, iWrapS, iWrapT;
                  };
              RWindow* iWin;
              void* iDisplay;
              void* iSurface;
              void* iContext;
              void* iConfig;
              TBool iOk;
              TInt iW, iH;
              TUint iProgGeo, iProg2d, iTexOverlay, iTexBot, iTexFog;
              TInt iGeoU[6];
              TInt iFlatU[3];
              TUint32* iBuf;
              TUint32 iLastFogSeq;
              TTex iTex[KMaxTex];
              };

          // Child window the GLES surface is attached to (parent keeps the buttons); forwards touches.
          class CRe4Container;
          class CRe4GlWin : public CCoeControl
              {
          public:
              void ConstructL(CRe4Container& aParent);
              RWindow& Win() const { return Window(); }
              void Draw(const TRect&) const {}
              void HandlePointerEventL(const TPointerEvent& aEvent);
          private:
              CRe4Container* iParent;
              };

          // Main control: both DS screens, touch pad, buttons.
          class CRe4Container : public CCoeControl
              {
          public:
              static CRe4Container* NewL(const TRect& aRect);
              ~CRe4Container();
              void SetForeground(TBool aForeground);

              void Draw(const TRect& aRect) const;
              void SizeChanged();
              TInt CountComponentControls() const;
              CCoeControl* ComponentControl(TInt aIndex) const;
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

          private:
              enum { KButtons = 13 };
              CRe4Container();
              void ConstructL();
              static TInt TickCb(TAny* aPtr);
              void Tick();
              void ComputeLayout();
              void PushInput();
              void ApplyPoint(const TPoint& aPt);
              TUint ButtonsAt(const TPoint& aPt) const;
              void DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              void DrawConsole(CWindowGc& aGc) const;
              void DrawFailure(CWindowGc& aGc) const;

              CRe4GlWin* iGlWin;
              CRe4Gl* iGl;
              TBool iGlVisible;
              TBool iBackground;
              TBool iDirty;
              TRect iGlRect;
              TBool iGlFailed;        // GLES 2.0 could not start: the window shows why, the game is not started
              TInt iGlErr;
              CPeriodic* iTimer;
              CRe4Audio* iAudio;
              RThread iGame;
              TBool iGameStarted;

              TUint iKeyBits;       // hardware keys
              TUint iPadBits;       // on-screen buttons
              TBool iTouch;
              TInt iTouchX, iTouchY;
              TInt iQuitTick;

              TRect iTopRect, iBotRect;
              TPoint iDpadC;
              TInt iDpadR;
              TRect iBtn[KButtons];
              };

          class CRe4AppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CRe4AppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
          private:
              CRe4Container* iContainer;
              };

          class CRe4Document : public CAknDocument
              {
          public:
              CRe4Document(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CRe4Application : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          #endif
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_app.cpp <<'RE4_EOF'
          // Application / document / AppUi / entry point.
          #include <eikstart.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "re4ds.h"

          CApaDocument* CRe4Application::CreateDocumentL()
              {
              return new (ELeave) CRe4Document(*this);
              }

          TUid CRe4Application::AppDllUid() const
              {
              return KUidRe4Ds;
              }

          CEikAppUi* CRe4Document::CreateAppUiL()
              {
              return new (ELeave) CRe4AppUi;
              }

          void CRe4AppUi::ConstructL()
              {
              Re4Log("---- RE4 DS start ----");
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              Re4Log("appui: base constructed");
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);
              CEikStatusPane* sp = StatusPane();
              if (sp)
                  {
                  sp->MakeVisible(EFalse);
                  }
              CEikButtonGroupContainer* cba = Cba();
              if (cba)
                  {
                  cba->MakeVisible(EFalse);
                  }
              Re4Log("appui: creating container");
              TRAPD(err, iContainer = CRe4Container::NewL(ApplicationRect()));
              if (err != KErrNone)
                  {
                  Re4Log("appui: container NewL left with %d", err);
                  User::Leave(err);
                  }
              AddToStackL(iContainer);
              Re4Log("appui: ready");
              }

          CRe4AppUi::~CRe4AppUi()
              {
              if (iContainer)
                  {
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              }

          void CRe4AppUi::HandleCommandL(TInt aCommand)
              {
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      Exit();
                      break;
                  default:
                      break;
                  }
              }

          void CRe4AppUi::HandleForegroundEventL(TBool aForeground)
              {
              Re4Log("foreground event: %d", (TInt)aForeground);
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer)
                  {
                  iContainer->SetForeground(aForeground);
                  }
              }

          LOCAL_C CApaApplication* NewApplication()
              {
              return new CRe4Application;
              }

          GLDEF_C TInt E32Main()
              {
              Re4Log("E32Main entered");
              return EikStart::RunApplication(NewApplication);
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_audio.cpp <<'RE4_EOF'
          // Audio output through CMdaAudioOutputStream (22.05 kHz, stereo, PCM16), refilled from the
          // buffer-copied callback so it never blocks the UI thread.
          #include "re4ds.h"

          // TMdaAudioDataSettings::ESampleRate22050Hz / EChannelsStereo (the class is not visible here).
          static const TInt KSampleRate22050 = 0x00000008;
          static const TInt KChannelsStereo = 0x00000002;

          CRe4Audio* CRe4Audio::NewL()
              {
              CRe4Audio* self = new (ELeave) CRe4Audio;
              self->OpenStream();
              return self;
              }

          CRe4Audio::~CRe4Audio()
              {
              if (iStream)
                  {
                  iReady = EFalse;
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CRe4Audio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream)
                  {
                  iStream->Open(NULL);
                  }
              }

          void CRe4Audio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              TRAPD(err, iStream->SetAudioPropertiesL(KSampleRate22050, KChannelsStereo));
              if (err != KErrNone)
                  {
                  return;
                  }
              iStream->SetVolume(iStream->MaxVolume() * 3 / 4);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  Fill(i);
                  }
              }

          void CRe4Audio::Fill(TInt aSlot)
              {
              if (!iReady || iSuspended)
                  {
                  return;
                  }
              TUint8* p = (TUint8*)iSlot[aSlot].Ptr();
              shim_audio_mix((short*)p, KFrames);
              iSlot[aSlot].SetLength(KBytes);
              TRAPD(err, iStream->WriteL(iSlot[aSlot]));
              (void)err;
              }

          void CRe4Audio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iSlot[i].Ptr() == aBuffer.Ptr())
                      {
                      Fill(i);
                      }
                  }
              }

          void CRe4Audio::MaoscPlayComplete(TInt /*aError*/)
              {
              }

          void CRe4Audio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iReady = EFalse;
                  iStream->Stop();
                  }
              }

          void CRe4Audio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_container.cpp <<'RE4_EOF'
          // Main control: shows both DS screens (landscape: top left, bottom right), on-screen pad.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikappui.h>
          #include <w32std.h>
          #include <hal.h>
          #include "re4ds.h"

          static const TInt KFrameMicros = 16667;      // GL refresh (the game itself runs at 60 Hz)

          _LIT(KLblL, "L");
          _LIT(KLblR, "R");
          _LIT(KLblSel, "SEL");
          _LIT(KLblStart, "START");
          _LIT(KLblA, "A");
          _LIT(KLblB, "B");
          _LIT(KLblX, "X");
          _LIT(KLblY, "Y");
          _LIT(KLblQuit, "QUIT");
          _LIT(KLblUp, "UP");
          _LIT(KLblDown, "DN");
          _LIT(KLblLeft, "<");
          _LIT(KLblRight, ">");

          // button slots: 0 L, 1 R, 2 SELECT, 3 START, 4 A, 5 B, 6 X, 7 Y, 8 QUIT, 9 UP, 10 DOWN, 11 LEFT, 12 RIGHT
          static const TUint KBtnBits[13] = { KDsL, KDsR, KDsSelect, KDsStart, KDsA, KDsB, KDsX, KDsY, 0,
                                              KDsUp, KDsDown, KDsLeft, KDsRight };

          CRe4Container* CRe4Container::NewL(const TRect& /*aRect*/)
              {
              CRe4Container* self = new (ELeave) CRe4Container;
              CleanupStack::PushL(self);
              self->ConstructL();
              CleanupStack::Pop(self);
              return self;
              }

          CRe4Container::CRe4Container()
              {
              }

          CRe4Container::~CRe4Container()
              {
              if (iTimer)
                  {
                  iTimer->Cancel();
                  delete iTimer;
                  }
              // let the game save and leave cleanly
              Re4Log("container: shutting down");
              shim_quit = 1;
              shim_pause = 0;
              if (iGameStarted)
                  {
                  for (TInt i = 0; i < 300 && iGame.ExitType() == EExitPending; ++i)
                      {
                      User::After(10000);
                      }
                  if (iGame.ExitType() == EExitPending)
                      {
                      iGame.Kill(0);
                      }
                  iGame.Close();
                  }
              Re4StopWatchdog();
              delete iAudio;
              delete iGl;
              delete iGlWin;
              Re4HostShutdown();
              }

          void CRe4Container::ConstructL()
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              EnableDragEvents();
              SetFocusing(ETrue);

              Re4HostInitL();
              TRAPD(aerr, iAudio = CRe4Audio::NewL());
              if (aerr != KErrNone)
                  {
                  iAudio = NULL;
                  }
              Re4Log("container: audio %d", aerr);

              ComputeLayout();

              // GLES 2.0 is the only renderer: a child window carries the EGL surface
              TRAPD(cerr, iGlWin = new (ELeave) CRe4GlWin; iGlWin->ConstructL(*this); iGlWin->SetRect(iGlRect));
              iGlErr = cerr;
              if (cerr != KErrNone)
                  {
                  Re4Log("container: gl window %d", cerr);
                  delete iGlWin;
                  iGlWin = NULL;
                  }
              iGlVisible = ETrue;
              ActivateL();
              if (iGlWin)
                  {
                  TRAPD(gerr, iGl = CRe4Gl::NewL(iGlWin->Win()));
                  iGlErr = gerr;
                  if (gerr != KErrNone || !iGl || !shim_gl_enable())
                      {
                      if (gerr == KErrNone)
                          {
                          iGlErr = KErrNoMemory;
                          }
                      delete iGl;
                      iGl = NULL;
                      delete iGlWin;
                      iGlWin = NULL;
                      }
                  }
              if (!iGl)
                  {
                  iGlFailed = ETrue;
                  Re4Log("container: GLES 2.0 could not start (error %d) - the game is NOT started", iGlErr);
                  DrawNow();
                  return;
                  }
              Re4Log("container: renderer = GLES 2.0");

              // the game: own thread, 512 KB stack, sharing the UI heap (textures are handed to the GL side
              // and freed there; the heap max is EPOCHEAPSIZE in the .mmp)
              TInt err = iGame.Create(_L("re4ds_game"), Re4GameThread, 0x80000, (RAllocator*)NULL, (TAny*)NULL, EOwnerProcess);
              Re4Log("container: game thread create %d", err);
              User::LeaveIfError(err);
              iGame.SetPriority(EPriorityLess);      // the UI thread always wins
              iGame.Resume();
              iGameStarted = ETrue;
              Re4StartWatchdog(RThread().Id(), iGame.Id());

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              iTimer->Start(KFrameMicros, KFrameMicros, TCallBack(TickCb, this));
              }

