          }
          static void apply(const Mat *op)
          {
              if (mtx_mode == 0) mat_mul(&cur_proj, op, &cur_proj);
              else if (mtx_mode != 3) mat_mul(&cur_pos, op, &cur_pos);
              mvp_dirty = 1;
          }
          static void load(const Mat *m)
          {
              if (mtx_mode == 0) cur_proj = *m;
              else if (mtx_mode != 3) cur_pos = *m;
              mvp_dirty = 1;
          }

          void glMatrixMode(int mode) { mtx_mode = mode & 3; }
          void glLoadIdentity(void) { Mat m; mat_ident(&m); load(&m); }
          void glPushMatrix(void)
          {
