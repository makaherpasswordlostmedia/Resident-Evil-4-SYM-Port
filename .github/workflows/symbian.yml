          typedef struct { char *p; size_t cap, n; } Out;
          static void put(Out *o, char c) { if (o->n + 1 < o->cap) o->p[o->n] = c; o->n++; }

          int vsnprintf(char *buf, size_t cap, const char *fmt, va_list ap)
          {
              Out o = { buf, cap, 0 };
              for (; *fmt; fmt++)
              {
                  if (*fmt != '%') { put(&o, *fmt); continue; }
                  fmt++;
                  int left = 0, zero = 0, width = 0, prec = -1;
                  for (;; fmt++)
                  {
                      if (*fmt == '-') left = 1;
                      else if (*fmt == '0') zero = 1;
                      else if (*fmt == '+' || *fmt == ' ' || *fmt == '#') {}
                      else break;
                  }
                  while (*fmt >= '0' && *fmt <= '9') width = width * 10 + (*fmt++ - '0');
                  if (*fmt == '.') { fmt++; prec = 0; while (*fmt >= '0' && *fmt <= '9') prec = prec * 10 + (*fmt++ - '0'); }
                  while (*fmt == 'l' || *fmt == 'h' || *fmt == 'z') fmt++;
                  char tmp[16];
                  const char *s = tmp;
                  int len = 0, neg = 0;
                  char c = *fmt;
                  if (c == '%') { put(&o, '%'); continue; }
                  if (c == 'c') { tmp[0] = (char)va_arg(ap, int); len = 1; }
                  else if (c == 's')
                  {
                      s = va_arg(ap, const char *);
                      if (!s) s = "(null)";
                      while (s[len] && (prec < 0 || len < prec)) len++;
                  }
                  else if (c == 'd' || c == 'i' || c == 'u' || c == 'x' || c == 'X')
                  {
                      unsigned v;
                      unsigned base = (c == 'x' || c == 'X') ? 16 : 10;
                      if (c == 'd' || c == 'i') { int sv = va_arg(ap, int); neg = sv < 0; v = neg ? 0u - (unsigned)sv : (unsigned)sv; }
                      else v = va_arg(ap, unsigned);
                      char rev[16]; int k = 0;
                      do { unsigned d = v % base; rev[k++] = (char)(d < 10 ? '0' + d : (c == 'X' ? 'A' : 'a') + d - 10); v /= base; } while (v);
                      if (neg) tmp[len++] = '-';
                      while (k) tmp[len++] = rev[--k];
                  }
                  else continue;
                  int pad = width > len ? width - len : 0;
                  if (!left && !zero) while (pad-- > 0) put(&o, ' ');
                  int i = 0;
                  if (neg && zero && !left) { put(&o, '-'); i = 1; while (pad-- > 0) put(&o, '0'); }
                  else if (zero && !left && c != 's' && c != 'c') while (pad-- > 0) put(&o, '0');
                  for (; i < len; i++) put(&o, s[i]);
                  if (left) while (pad-- > 0) put(&o, ' ');
              }
              if (cap) buf[o.n < cap ? o.n : cap - 1] = 0;
              return (int)o.n;
          }
          int snprintf(char *b, size_t n, const char *f, ...) { va_list ap; va_start(ap, f); int r = vsnprintf(b, n, f, ap); va_end(ap); return r; }
          int sprintf(char *b, const char *f, ...) { va_list ap; va_start(ap, f); int r = vsnprintf(b, 0x7FFFFFFF, f, ap); va_end(ap); return r; }
          int printf(const char *f, ...) { (void)f; return 0; }

          /* ------------------------------------------------------------------- math */
          static const double PI = 3.14159265358979323846;
          double fabs(double x) { return x < 0 ? -x : x; }
          float fabsf(float x) { return x < 0 ? -x : x; }
          double floor(double x)
          {
              if (x > 4e18 || x < -4e18) return x;
              long long i = (long long)x;
              return (double)(i > x ? i - 1 : i);
          }
          float floorf(float x) { return (float)floor(x); }
          double sqrt(double x)
          {
              if (x <= 0) return 0;
              union { double d; unsigned long long u; } v;
              v.d = x;
              v.u = 0x1FF7A3BEA91D9B1BULL + (v.u >> 1);
              double r = v.d;
              for (int i = 0; i < 5; i++) r = 0.5 * (r + x / r);
              return r;
          }
          float sqrtf(float x) { return (float)sqrt(x); }
          double sin(double x)
          {
              while (x > PI) x -= 2 * PI;
              while (x < -PI) x += 2 * PI;
              double x2 = x * x, t = x, s = x;
              for (int i = 1; i < 12; i++) { t *= -x2 / ((2 * i) * (2 * i + 1)); s += t; }
              return s;
          }
          double cos(double x) { return sin(x + PI / 2); }
          double tan(double x) { return sin(x) / cos(x); }
          float sinf(float x) { return (float)sin(x); }
          float cosf(float x) { return (float)cos(x); }
          float tanf(float x) { return (float)tan(x); }
          static double atan_unit(double x)       /* |x| <= 1 */
          {
              double x2 = x * x;
              return x * (0.9998660 + x2 * (-0.3302995 + x2 * (0.1801410 + x2 * (-0.0851330 + x2 * 0.0208351))));
          }
          double atan2(double y, double x)
          {
              if (x == 0 && y == 0) return 0;
              double ax = fabs(x), ay = fabs(y), a;
              if (ax >= ay) a = atan_unit(ay / ax); else a = PI / 2 - atan_unit(ax / ay);
              if (x < 0) a = PI - a;
              return y < 0 ? -a : a;
          }
          float atan2f(float y, float x) { return (float)atan2(y, x); }
          float asinf(float x)
          {
              if (x >= 1) return (float)(PI / 2);
              if (x <= -1) return (float)(-PI / 2);
              return (float)atan2(x, sqrt(1.0 - (double)x * x));
          }
          double exp(double x)
          {
              if (x > 80) x = 80;
              if (x < -80) return 0;
              const double ln2 = 0.69314718055994530942;
              int k = (int)floor(x / ln2 + 0.5);
              double r = x - k * ln2, t = 1, s = 1;
              for (int i = 1; i < 13; i++) { t *= r / i; s += t; }
              while (k > 0) { s *= 2; k--; }
              while (k < 0) { s *= 0.5; k++; }
              return s;
          }
          float expf(float x) { return (float)exp(x); }
