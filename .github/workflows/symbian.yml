name: Build Symbian^3 SIS (RE4 DS)

# SELF-CONTAINED: this single file carries the whole Symbian layer (symbian/ tree) and writes it at
# build time on top of the original ds/source of this repository.
#
#   sources   - writes symbian/, patches + prepares the game sources (tools/prepare.sh)
#   host-test - PC checks: whole game compiles/links against the software DS layer, a freestanding
#               32-bit pass with only our own libc headers, a rasterizer smoke test
#   build-sis - Symbian^3 toolchain (fieldops-dev/symbian3-toolchain, macos-14 arm64 runner); the
#               first run builds GCC (about 1.5-2 h) and caches it, later runs take minutes
#
# 3D: OpenGL ES 2.0 only (EGL pbuffer, shim/glesr.c; links libEGL/libGLESv2 from the SDK). There is no software
# rasteriser in the build. The floor fix (tools/fix_floor.py) is part of this file too.
#
# The .sisx contains only the program. Game data goes to E:\RE4DS\data and E:\RE4DS\nitrofs
# (see symbian/README.md).

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate symbian/ tree
        run: |
          set -e
          mkdir -p symbian
          cat > symbian/README.md <<'RE4_EOF'
          # Resident Evil 4 DS port - Symbian^3 layer

          The game code in `ds/source` (C, libnds) is built **unmodified except for three small patches**
          (`tools/prepare.sh`) on top of a software implementation of the parts of the Nintendo DS the
          game uses. Nothing here is a rewrite of the game.

          ```
          shim/        the "DS": nds.h (libnds subset), gx.c (3D engine + rasterizer), dsshim.c (sprites,
                       sub screen, sound mixer, input, timing), rt.c (mini libc/libm, no Open C needed)
          app/         Symbian front end: Avkon app, game thread, both screens, touch pad, audio, files
          group/       bld.inf + re4ds.mmp.in (the .mmp is generated by tools/prepare.sh)
          tools/       prepare.sh (patches + data loader), host_check.sh (CI checks on the PC)
          ```

          ## What the shim emulates

          * **GX**: matrix stacks, projection / look-at, packed command lists + DMA to the FIFO (the models'
            display lists), triangles / quads / strips, near-plane clipping, culling, 2048 polygon /
            6144 vertex limits and the polygon-RAM counters the game's LOD logic reads, perspective-correct
            256-colour and A5I3 textures, vertex colour, translucency (opaque pass first, then translucent),
            depth test, fog table, clear colour. Integer maths only; the 3D buffer is 256x192.
          * **2D**: the 32x16 text sprites of `text.c` (incl. the 2x affine scale), the 256x256 sub-screen
            bitmap, console text, brightness fades, main/sub screen swap for cut-ins.
          * **Sound**: 8-bit and IMA-ADPCM channels (the game's SFX bank and looped music) mixed at 22.05 kHz stereo.
          * **System**: 60 Hz vblank pacing, keys + touch, `fopen("nitro:/...")`, save file.

          Not emulated (the game does not use them): lighting, toon shading, edge marking, texture matrix,
          compressed textures, box/pos/vec tests.

          ## Putting the game on the phone

          The `.sisx` only contains the program. The game data you build with `build.ps1` goes to the
          memory card (first of `E:\RE4DS\`, `F:\RE4DS\`, `D:\RE4DS\`, `C:\Data\RE4DS\` that has a `data` folder):

          ```
          E:\RE4DS\data\*.bin       <- ds/data/*.bin      (what the DS build embeds in the ROM)
          E:\RE4DS\nitrofs\*.bin    <- ds/nitrofs/*.bin   (what the DS build reads from NitroFS)
          E:\RE4DS\re4ds.sav        <- created by the game
          ```

          If a file is missing the bottom screen lists it.

          ## Controls

          On-screen pad (landscape): D-pad, A B X Y, L R, SEL, START. Touching the right-hand (bottom DS) screen
          is the DS touch screen. Keyboard phones: arrows, Enter/Z = A, Backspace/X = B, S = X, A = Y,
          Q = L, W = R, Space = Start, E = Select. QUIT: tap twice within 2 s. Single-touch phones cannot hold
          the pad and the touch screen at the same time.

          ## Status / known limits

          * Written without access to a Symbian build; the CI is the first real compile of `app/` and the
            Symbian-specific bits. What *is* verified on every run (job `host-test`): the whole game
            compiles and links against the shim, a freestanding 32-bit pass with only our own libc headers,
            and a rasterizer smoke test (perspective texture, translucency, depth).
          * Speed is untested on hardware: the 680 MHz ARM11 renders ~2000 polygons in software. If it is too
            slow, lower `POLY_HIGH` / `POLY_LOW` in `ds/source/main.c` (the game already adapts to them).
          * Memory: all `data/*.bin` are read into the game thread's heap (96 MB max).
          RE4_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/re4ds.rss <<'RE4_EOF'
          NAME RE4D

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "RE4 DS";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "RE4 DS";
                  number_of_icons = 0;
                  };
              }
          RE4_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/re4ds_reg.rss <<'RE4_EOF'
          #include <appinfo.rh>
          #include <re4ds.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5B0CE

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "re4ds";
              localisable_resource_file = "\\resource\\apps\\re4ds";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          RE4_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/re4ds.h <<'RE4_EOF'
          // re4ds.h - Symbian^3 front end for the Resident Evil 4 DS port (software DS layer in shim/).
          #ifndef RE4DS_H
          #define RE4DS_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <mdaaudiooutputstream.h>

          const TUid KUidRe4Ds = { (TInt32)0xE1A5B0CE };

          // ---- the C side (shim/) ----
          extern "C"
              {
              extern unsigned int shim_top[256 * 192];
              extern unsigned int shim_bot[256 * 192];
              extern char shim_console[2048];
              extern volatile int shim_console_on;
              extern volatile int shim_quit;
              extern volatile int shim_pause;
              extern volatile unsigned int shim_present_count;
              extern volatile int shim_frameskip_enable;
              void shim_set_input(unsigned aKeys, int aTouchDown, int aX, int aY);
              int shim_audio_mix(short* aStereo, int aFrames);
              int shim_load_databins(void);
              int re4_main(void);
              void host_lock(void);
              void host_unlock(void);
              }

          // ---- host services (re4ds_host.cpp) ----
          void Re4Log(const char* aFmt, ...);   // appends a line to E:\\RE4DS\\re4ds.log (any thread)
          void Re4HostInitL();            // UI thread: lock + file root
          void Re4HostShutdown();
          TInt Re4GameThread(TAny*);      // the game's thread

          // DS key bits (same values as the shim's KEY_*)
          enum
              {
              KDsA = 1 << 0, KDsB = 1 << 1, KDsSelect = 1 << 2, KDsStart = 1 << 3,
              KDsRight = 1 << 4, KDsLeft = 1 << 5, KDsUp = 1 << 6, KDsDown = 1 << 7,
              KDsR = 1 << 8, KDsL = 1 << 9, KDsX = 1 << 10, KDsY = 1 << 11
              };

          // Audio: pulls 22.05 kHz stereo PCM16 from the shim mixer, buffer by buffer.
          class CRe4Audio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CRe4Audio* NewL();
              ~CRe4Audio();
              void Suspend();
              void Resume();

              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              void OpenStream();
              void Fill(TInt aSlot);

              enum { KSlots = 3, KFrames = 1024, KBytes = KFrames * 4 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iSuspended;
              TBuf8<KBytes> iSlot[KSlots];
              };

          // Main control: both DS screens, touch pad, buttons.
          class CRe4Container : public CCoeControl
              {
          public:
              static CRe4Container* NewL(const TRect& aRect);
              ~CRe4Container();
              void SetForeground(TBool aForeground);

              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

          private:
              enum { KButtons = 9 };
              CRe4Container();
              void ConstructL();
              static TInt TickCb(TAny* aPtr);
              void Tick();
              void ComputeLayout();
              void PushInput();
              void Recompute();
              TUint ButtonsAt(const TPoint& aPt) const;
              void DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              void DrawConsole(CWindowGc& aGc) const;

              CFbsBitmap* iTop;
              CFbsBitmap* iBot;
              CPeriodic* iTimer;
              CRe4Audio* iAudio;
              RThread iGame;
              TBool iGameStarted;
              TBool iDeathLogged;

              TUint iKeyBits;       // hardware keys
              TUint iPadBits;       // on-screen buttons
              TBool iTouch;
              TInt iTouchX, iTouchY;
              TInt iQuitTick;
              enum { KMaxPtr = 5 };
              TBool iPtrDown[KMaxPtr];        // multi-touch: one slot per finger
              TPoint iPtrPos[KMaxPtr];

              TRect iTopRect, iBotRect;
              TPoint iDpadC;
              TInt iDpadR;
              TRect iBtn[KButtons];
              };

          class CRe4AppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CRe4AppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
          private:
              CRe4Container* iContainer;
              };

          class CRe4Document : public CAknDocument
              {
          public:
              CRe4Document(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CRe4Application : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          #endif
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_app.cpp <<'RE4_EOF'
          // Application / document / AppUi / entry point.
          #include <eikstart.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "re4ds.h"

          CApaDocument* CRe4Application::CreateDocumentL()
              {
              return new (ELeave) CRe4Document(*this);
              }

          TUid CRe4Application::AppDllUid() const
              {
              return KUidRe4Ds;
              }

          CEikAppUi* CRe4Document::CreateAppUiL()
              {
              return new (ELeave) CRe4AppUi;
              }

          void CRe4AppUi::ConstructL()
              {
              Re4Log("---- RE4 DS start ----");
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              Re4Log("appui: base constructed");
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);
              CEikStatusPane* sp = StatusPane();
              if (sp)
                  {
                  sp->MakeVisible(EFalse);
                  }
              CEikButtonGroupContainer* cba = Cba();
              if (cba)
                  {
                  cba->MakeVisible(EFalse);
                  }
              Re4Log("appui: creating container");
              TRAPD(err, iContainer = CRe4Container::NewL(ApplicationRect()));
              if (err != KErrNone)
                  {
                  Re4Log("appui: container NewL left with %d", err);
                  User::Leave(err);
                  }
              AddToStackL(iContainer);
              Re4Log("appui: ready");
              }

          CRe4AppUi::~CRe4AppUi()
              {
              if (iContainer)
                  {
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              }

          void CRe4AppUi::HandleCommandL(TInt aCommand)
              {
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      Exit();
                      break;
                  default:
                      break;
                  }
              }

          void CRe4AppUi::HandleForegroundEventL(TBool aForeground)
              {
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer)
                  {
                  iContainer->SetForeground(aForeground);
                  }
              }

          LOCAL_C CApaApplication* NewApplication()
              {
              return new CRe4Application;
              }

          GLDEF_C TInt E32Main()
              {
              Re4Log("E32Main entered");
              return EikStart::RunApplication(NewApplication);
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_audio.cpp <<'RE4_EOF'
          // Audio output through CMdaAudioOutputStream (22.05 kHz, stereo, PCM16), refilled from the
          // buffer-copied callback so it never blocks the UI thread.
          #include "re4ds.h"

          // TMdaAudioDataSettings::ESampleRate22050Hz / EChannelsStereo (the class is not visible here).
          static const TInt KSampleRate22050 = 0x00000008;
          static const TInt KChannelsStereo = 0x00000002;

          CRe4Audio* CRe4Audio::NewL()
              {
              CRe4Audio* self = new (ELeave) CRe4Audio;
              self->OpenStream();
              return self;
              }

          CRe4Audio::~CRe4Audio()
              {
              if (iStream)
                  {
                  iReady = EFalse;
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CRe4Audio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream)
                  {
                  iStream->Open(NULL);
                  }
              }

          void CRe4Audio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              TRAPD(err, iStream->SetAudioPropertiesL(KSampleRate22050, KChannelsStereo));
              if (err != KErrNone)
                  {
                  return;
                  }
              iStream->SetVolume(iStream->MaxVolume() * 3 / 4);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  Fill(i);
                  }
              }

          void CRe4Audio::Fill(TInt aSlot)
              {
              if (!iReady || iSuspended)
                  {
                  return;
                  }
              TUint8* p = (TUint8*)iSlot[aSlot].Ptr();
              shim_audio_mix((short*)p, KFrames);
              iSlot[aSlot].SetLength(KBytes);
              TRAPD(err, iStream->WriteL(iSlot[aSlot]));
              (void)err;
              }

          void CRe4Audio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iSlot[i].Ptr() == aBuffer.Ptr())
                      {
                      Fill(i);
                      }
                  }
              }

          void CRe4Audio::MaoscPlayComplete(TInt /*aError*/)
              {
              }

          void CRe4Audio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iReady = EFalse;
                  iStream->Stop();
                  }
              }

          void CRe4Audio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          RE4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/re4ds_container.cpp <<'RE4_EOF'
          // Main control: shows both DS screens (landscape: top left, bottom right), on-screen pad.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikappui.h>
          #include <w32std.h>
          #include "re4ds.h"

          static const TInt KFrameMicros = 33333;      // UI refresh (the game itself runs at 60 Hz)

          _LIT(KLblL, "L");
          _LIT(KLblR, "R");
          _LIT(KLblSel, "SEL");
          _LIT(KLblStart, "START");
          _LIT(KLblA, "A");
          _LIT(KLblB, "B");
          _LIT(KLblX, "X");
          _LIT(KLblY, "Y");
          _LIT(KLblQuit, "QUIT");

          // button slots: 0 L, 1 R, 2 SELECT, 3 START, 4 A, 5 B, 6 X, 7 Y, 8 QUIT
          static const TUint KBtnBits[9] = { KDsL, KDsR, KDsSelect, KDsStart, KDsA, KDsB, KDsX, KDsY, 0 };

          CRe4Container* CRe4Container::NewL(const TRect& /*aRect*/)
              {
              CRe4Container* self = new (ELeave) CRe4Container;
              CleanupStack::PushL(self);
              self->ConstructL();
              CleanupStack::Pop(self);
              return self;
              }

          CRe4Container::CRe4Container()
              {
              }

          CRe4Container::~CRe4Container()
              {
              if (iTimer)
                  {
                  iTimer->Cancel();
                  delete iTimer;
                  }
              // let the game save and leave cleanly
              shim_quit = 1;
              shim_pause = 0;
              if (iGameStarted)
                  {
                  for (TInt i = 0; i < 300 && iGame.ExitType() == EExitPending; ++i)
                      {
                      User::After(10000);
                      }
                  if (iGame.ExitType() == EExitPending)
                      {
                      iGame.Kill(0);
                      }
                  iGame.Close();
                  }
              delete iAudio;
              delete iTop;
              delete iBot;
              Re4HostShutdown();
              }

          void CRe4Container::ConstructL()
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              Window().EnableAdvancedPointers();      // several fingers at once (pointer numbers on the events)
              EnableDragEvents();
              SetFocusing(ETrue);

              iTop = new (ELeave) CFbsBitmap;
              TInt berr = iTop->Create(TSize(256, 192), EColor16MU);
              Re4Log("container: top bitmap %d", berr);
              User::LeaveIfError(berr);
              iBot = new (ELeave) CFbsBitmap;
              berr = iBot->Create(TSize(256, 192), EColor16MU);
              Re4Log("container: bottom bitmap %d", berr);
              User::LeaveIfError(berr);

              Re4HostInitL();
              TRAPD(aerr, iAudio = CRe4Audio::NewL());
              if (aerr != KErrNone)
                  {
                  iAudio = NULL;
                  }
              Re4Log("container: audio %d", aerr);

              // the game: own thread, own heap (96 MB max), 512 KB stack
              TInt err = iGame.Create(_L("re4ds_game"), Re4GameThread, 0x80000, 0x200000, 0x6000000,
                                      NULL, EOwnerProcess);
              Re4Log("container: game thread create %d", err);
              User::LeaveIfError(err);
              iGame.SetPriority(EPriorityNormal);
              iGame.Resume();
              iGameStarted = ETrue;

              ComputeLayout();
              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              iTimer->Start(KFrameMicros, KFrameMicros, TCallBack(TickCb, this));
              ActivateL();
              }

          void CRe4Container::SetForeground(TBool aForeground)
              {
              shim_pause = aForeground ? 0 : 1;
              if (iAudio)
                  {
                  if (aForeground)
                      {
                      iAudio->Resume();
                      }
                  else
                      {
                      iAudio->Suspend();
                      }
                  }
              if (!aForeground)
                  {
                  iKeyBits = 0;
                  iPadBits = 0;
                  iTouch = EFalse;
                  for (TInt i = 0; i < KMaxPtr; ++i)
                      {
                      iPtrDown[i] = EFalse;
                      }
                  PushInput();
                  }
              }

          TInt CRe4Container::TickCb(TAny* aPtr)
              {
              ((CRe4Container*)aPtr)->Tick();
              return 0;
              }

          void CRe4Container::Tick()
              {
              if (iGameStarted && !iDeathLogged && iGame.ExitType() != EExitPending)
                  {
                  iDeathLogged = ETrue;
                  TExitCategoryName cat = iGame.ExitCategory();
                  TBuf8<KMaxExitCategoryName> cat8;
                  cat8.Copy(cat);
                  cat8.ZeroTerminate();
                  Re4Log("GAME THREAD DIED: type=%d reason=%d category=%s", (TInt)iGame.ExitType(),
                         iGame.ExitReason(), (const char*)cat8.Ptr());
                  }
              // redraw only when the game presented a new picture or the pad changed (the window server is the slow part)
              static unsigned lastPresent = 0xFFFFFFFFu;
              static TUint lastHeld = 0xFFFFFFFFu;
              TUint heldNow = iKeyBits | iPadBits;
              if (lastPresent == shim_present_count && lastHeld == heldNow)
                  {
                  return;
                  }
              lastPresent = shim_present_count;
              lastHeld = heldNow;
              host_lock();
              iTop->LockHeap();
              Mem::Copy(iTop->DataAddress(), shim_top, 256 * 192 * 4);
              iTop->UnlockHeap();
              iBot->LockHeap();
              Mem::Copy(iBot->DataAddress(), shim_bot, 256 * 192 * 4);
              iBot->UnlockHeap();
              host_unlock();
              DrawNow();
              }

          void CRe4Container::SizeChanged()
              {
              ComputeLayout();
              }

          void CRe4Container::ComputeLayout()
              {
              TSize s = Size();
              TInt w = s.iWidth, h = s.iHeight;
              if (w < h)
                  {
                  TInt t = w; w = h; h = t;
                  }
              TInt sw = w / 2;
              TInt sh = sw * 3 / 4;
              TInt minStrip = 96;
              if (h - sh < minStrip)
                  {
                  sh = h - minStrip;
                  sw = sh * 4 / 3;
                  }
              TInt x0 = (w - 2 * sw) / 2;
              iTopRect = TRect(x0, 0, x0 + sw, sh);
              iBotRect = TRect(x0 + sw, 0, x0 + 2 * sw, sh);

              TInt hs = h - sh;
              TInt cy = sh + hs / 2;
              iDpadR = hs / 2 - 2;
              iDpadC = TPoint(iDpadR + 8, cy);
              TInt bs = hs / 3;                       // face button size
              TInt fx = w - iDpadR - 8;
              iBtn[4] = TRect(fx + bs / 2, cy - bs / 2, fx + bs / 2 + bs, cy + bs / 2);               // A right
              iBtn[5] = TRect(fx - bs / 2, cy + bs / 2 - 4, fx + bs / 2, cy + bs / 2 - 4 + bs);       // B bottom
              iBtn[6] = TRect(fx - bs / 2, cy - bs / 2 - bs + 4, fx + bs / 2, cy - bs / 2 + 4);       // X top
              iBtn[7] = TRect(fx - bs / 2 - bs, cy - bs / 2, fx - bs / 2, cy + bs / 2);                // Y left
              TInt mx = w / 2;
              TInt cw = w / 9, ch = h / 8;                                                            // shoulder buttons: top corners
              iBtn[0] = TRect(0, 0, cw, ch);                                                           // L
              iBtn[1] = TRect(w - cw, 0, w, ch);                                                       // R
              iBtn[2] = TRect(mx - 70, cy - hs / 6, mx - 5, cy + hs / 6);                              // SELECT
              iBtn[3] = TRect(mx + 5, cy - hs / 6, mx + 70, cy + hs / 6);                              // START
              iBtn[8] = TRect(mx - 40, h - hs / 3 - 2, mx + 40, h - 2);                                // QUIT
              }

          void CRe4Container::PushInput()
              {
              shim_set_input(iKeyBits | iPadBits, iTouch, iTouchX, iTouchY);
              }

          TUint CRe4Container::ButtonsAt(const TPoint& aPt) const
              {
              TUint bits = 0;
              TInt dx = aPt.iX - iDpadC.iX, dy = aPt.iY - iDpadC.iY;
              TInt lim = iDpadR + iDpadR / 3;
              if (dx * dx + dy * dy <= lim * lim && dx * dx + dy * dy >= (iDpadR / 5) * (iDpadR / 5))
                  {
                  TInt t = iDpadR / 3;
                  if (dx < -t) bits |= KDsLeft;
                  if (dx > t) bits |= KDsRight;
                  if (dy < -t) bits |= KDsUp;
                  if (dy > t) bits |= KDsDown;
                  }
              for (TInt i = 0; i < 8; ++i)
                  {
                  if (iBtn[i].Contains(aPt))
                      {
                      bits |= KBtnBits[i];
                      }
                  }
              return bits;
              }

          void CRe4Container::Recompute()
              {
              // every finger that is down counts: the buttons / pad under any of them are held (so Y + a pad
              // direction + the bottom screen work together); the first finger on the bottom screen is the stylus.
              TUint pad = 0;
              TBool touch = EFalse;
              for (TInt i = 0; i < KMaxPtr; ++i)
                  {
                  if (!iPtrDown[i])
                      {
                      continue;
                      }
                  const TPoint& pt = iPtrPos[i];
                  if (iBotRect.Contains(pt) && !iBtn[0].Contains(pt) && !iBtn[1].Contains(pt))
                      {
                      if (!touch)
                          {
                          touch = ETrue;
                          iTouchX = (pt.iX - iBotRect.iTl.iX) * 256 / iBotRect.Width();
                          iTouchY = (pt.iY - iBotRect.iTl.iY) * 192 / iBotRect.Height();
                          }
                      }
                  else
                      {
                      pad |= ButtonsAt(pt);
                      }
                  }
              iTouch = touch;
              iPadBits = pad;
              }

          void CRe4Container::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              TInt n = 0;
              if (aEvent.IsAdvancedPointerEvent())
                  {
                  n = aEvent.AdvancedPointerEvent()->PointerNumber();
                  }
              if (n < 0 || n >= KMaxPtr)
                  {
                  return;
                  }
              switch (aEvent.iType)
                  {
                  case TPointerEvent::EButton1Down:
                      if (iBtn[8].Contains(aEvent.iPosition))
                          {
                          TInt now = (TInt)User::NTickCount();
                          if (iQuitTick && now - iQuitTick < 2000)
                              {
                              static_cast<CAknAppUi*>(iEikonEnv->EikAppUi())->HandleCommandL(EEikCmdExit);
                              return;
                              }
                          iQuitTick = now ? now : 1;
                          }
                      iPtrDown[n] = ETrue;
                      iPtrPos[n] = aEvent.iPosition;
                      break;
                  case TPointerEvent::EDrag:
                      if (iPtrDown[n])
                          {
                          iPtrPos[n] = aEvent.iPosition;
                          }
                      break;
                  case TPointerEvent::EButton1Up:
                      iPtrDown[n] = EFalse;
                      break;
                  default:
                      break;
                  }
              Recompute();
              PushInput();
              }

          TKeyResponse CRe4Container::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              TUint bit = 0;
              switch (aKey.iScanCode)
                  {
                  case EStdKeyUpArrow:    bit = KDsUp; break;
                  case EStdKeyDownArrow:  bit = KDsDown; break;
                  case EStdKeyLeftArrow:  bit = KDsLeft; break;
                  case EStdKeyRightArrow: bit = KDsRight; break;
                  case EStdKeyEnter:
                  case EStdKeyDevice3:
                  case 'Z':               bit = KDsA; break;
                  case EStdKeyBackspace:
                  case 'X':               bit = KDsB; break;
                  case 'S':               bit = KDsX; break;
                  case 'A':               bit = KDsY; break;
                  case 'Q':               bit = KDsL; break;
                  case 'W':               bit = KDsR; break;
                  case EStdKeySpace:      bit = KDsStart; break;
                  case 'E':               bit = KDsSelect; break;
                  default:                break;
                  }
              if (!bit)
                  {
                  return EKeyWasNotConsumed;
                  }
              if (aType == EEventKeyDown)
                  {
                  iKeyBits |= bit;
                  }
              else if (aType == EEventKeyUp)
                  {
                  iKeyBits &= ~bit;
                  }
              PushInput();
              return EKeyWasConsumed;
              }

          void CRe4Container::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(TRgb(200, 200, 200));
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(aDown ? TRgb(120, 120, 140) : TRgb(40, 40, 48));
              aGc.DrawRect(aRect);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TInt base = aRect.Height() / 2 + font->AscentInPixels() / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter);
              aGc.DiscardFont();
              }

          void CRe4Container::DrawConsole(CWindowGc& aGc) const
              {
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(KRgbBlack);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbWhite);
              aGc.DrawRect(iBotRect);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TInt lineH = font->HeightInPixels() + 2;
              TInt y = iBotRect.iTl.iY + font->AscentInPixels() + 2;
              TInt cols = iBotRect.Width() / 8;
              if (cols > 60) cols = 60;
              TBuf<64> line;
              const char* p = shim_console;
              while (*p && y < iBotRect.iBr.iY)
                  {
                  line.Zero();
                  while (*p && *p != '\n' && line.Length() < cols)
                      {
                      line.Append(TChar((TUint8)*p));
                      ++p;
                      }
                  if (*p == '\n')
                      {
                      ++p;
                      }
                  aGc.DrawText(line, TPoint(iBotRect.iTl.iX + 4, y));
                  y += lineH;
                  }
              aGc.DiscardFont();
              }

          void CRe4Container::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.Clear();
              gc.DrawBitmap(iTopRect, iTop);
              if (shim_console_on)
                  {
                  DrawConsole(gc);
                  }
              else
                  {
                  gc.DrawBitmap(iBotRect, iBot);
                  }

              // D-pad
              TUint held = iKeyBits | iPadBits;
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetPenColor(TRgb(200, 200, 200));
              gc.SetBrushColor(TRgb(30, 30, 36));
              gc.DrawEllipse(TRect(iDpadC.iX - iDpadR, iDpadC.iY - iDpadR, iDpadC.iX + iDpadR, iDpadC.iY + iDpadR));
              TInt t = iDpadR / 3;
              gc.SetBrushColor(TRgb(120, 120, 140));
              if (held & KDsUp)    gc.DrawRect(TRect(iDpadC.iX - t, iDpadC.iY - iDpadR, iDpadC.iX + t, iDpadC.iY - t));
              if (held & KDsDown)  gc.DrawRect(TRect(iDpadC.iX - t, iDpadC.iY + t, iDpadC.iX + t, iDpadC.iY + iDpadR));
              if (held & KDsLeft)  gc.DrawRect(TRect(iDpadC.iX - iDpadR, iDpadC.iY - t, iDpadC.iX - t, iDpadC.iY + t));
              if (held & KDsRight) gc.DrawRect(TRect(iDpadC.iX + t, iDpadC.iY - t, iDpadC.iX + iDpadR, iDpadC.iY + t));

              DrawButton(gc, iBtn[0], KLblL, held & KDsL);
              DrawButton(gc, iBtn[1], KLblR, held & KDsR);
              DrawButton(gc, iBtn[2], KLblSel, held & KDsSelect);
              DrawButton(gc, iBtn[3], KLblStart, held & KDsStart);
              DrawButton(gc, iBtn[4], KLblA, held & KDsA);
              DrawButton(gc, iBtn[5], KLblB, held & KDsB);
              DrawButton(gc, iBtn[6], KLblX, held & KDsX);
              DrawButton(gc, iBtn[7], KLblY, held & KDsY);
              DrawButton(gc, iBtn[8], KLblQuit, EFalse);
              }
