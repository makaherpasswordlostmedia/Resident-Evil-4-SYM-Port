          int glColorTableNtr(int count, const u16 *pal)
          {
              shim_trace("glColorTable");
              Tex *t = &tex[bound_tex];
              if (!bound_tex || !t->idx) return 0;
              u32 n = (u32)t->w * t->h;
              u32 lut[256];
              for (int i = 0; i < 256; i++) lut[i] = i < count ? argb555(pal[i], 255) : 0;
              if (t->color0 && count > 0) lut[0] &= 0x00FFFFFF;
              t->px = (u32 *)malloc(n * 4);
              if (!t->px) return 0;
              for (u32 i = 0; i < n; i++)
              {
