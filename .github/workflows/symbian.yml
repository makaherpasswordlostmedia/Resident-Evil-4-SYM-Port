          }
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/fix_floor.py <<'RE4_EOF'
          #!/usr/bin/env python3
          # fix_floor.py <build_src>: the floor under Leon is never what the stage's triangle budget drops
          # (model_draw_near sends the chunk Leon stands on first, outside the budget).
          import sys
          d = sys.argv[1]
          def rd(n): return open(d + '/' + n).read()
          def wr(n, s): open(d + '/' + n, 'w').write(s)
          def rep(t, old, new):
              assert t.count(old) == 1, old
              return t.replace(old, new)

          h = rd('model.h')
          h = rep(h, "// Waits until a model_draw_async() transfer has finished.", """// The floor under the player: model_draw_near() always sends the chunk(s) holding this point
          // (f32 x, y = feet, z) first and outside the triangle budget (up to a cap). NULL: none.
          void model_set_anchor(const int p[3]);

          // Waits until a model_draw_async() transfer has finished.""")
          wr('model.h', h)

          c = rd('model.c')
          a = c.index("void model_draw_near(Model *m")
          b = c.index("void model_sync(void)")
          NEW = r"""static int anchor_on, anchor_pos[3];
          #define ANCHOR_TRI_MAX 900            // the floor's own share, outside the budget
          #define ANCHOR_FIRST_MAX 1500         // (the first one is taken whatever the cap)
          #define ANCHOR_Y_MARGIN inttof32(8)

          void model_set_anchor(const int p[3])
          {
              anchor_on = p != NULL;
              if (p)
                  memcpy(anchor_pos, p, sizeof(anchor_pos));
          }

          static void chain_add(const Model *m, int i, int *n)
          {
              u32 from = i ? m->draws[i - 1].list_at : 0;
              chain[*n].src = m->async_list + from;
              chain[(*n)++].words = m->draws[i].list_at - from;
          }

          void model_draw_near(Model *m, const int eye[3], const int at[3], int budget, u32 poly_fmt)
          {
              static int irq_set;
              static s16 head[NEAR_BUCKETS], next[MODEL_MAX_DRAWS];
              static u8 anchor_of[MODEL_MAX_DRAWS], taken[MODEL_MAX_DRAWS];
              model_sync();
              if (!irq_set)
              {
                  irqSet(IRQ_DMA2, chain_next);
                  irqEnable(IRQ_DMA2);
                  irq_set = 1;
              }
              if (!m->async_list || m->async_fmt != poly_fmt)
                  model_build_async(m, poly_fmt);
              glPushMatrix();
              glTranslatef32(m->center[0], m->center[1], m->center[2]);
              int s = inttof32(1 << m->shift);
              glScalef32(s, s, s);
              memset(anchor_of, 0, m->draw_count);
              memset(taken, 0, m->draw_count);
              // Forward on the ground, as a unit vector.
              int fx = at[0] - eye[0], fz = at[2] - eye[2];
              int len = (int)sqrt64((u64)((s64)fx * fx + (s64)fz * fz));
              if (len == 0)
                  len = 1;
              fx = divf32(fx, len);
              fz = divf32(fz, len);
              // Sorted by distance, roughly: those that don't fit the budget are the farthest, in the haze.
              for (int i = 0; i < NEAR_BUCKETS; i++)
                  head[i] = -1;
              for (int i = m->draw_count - 1; i >= 0; i--)
              {
                  const ModelDraw *d = &m->draws[i];
                  int dx = d->chunk[0] - eye[0], dz = d->chunk[2] - eye[2];
                  // (The chunk the player stands on: its floor under his feet. Never culled by the view.)
                  int is_anchor = 0;
                  if (anchor_on)
                  {
                      int ax_ = d->chunk[0] - anchor_pos[0], az_ = d->chunk[2] - anchor_pos[2], r_ = d->chunk[3];
                      ax_ = ax_ < 0 ? -ax_ : ax_;
                      az_ = az_ < 0 ? -az_ : az_;
                      is_anchor = ax_ <= r_ && az_ <= r_ && anchor_pos[1] >= d->chunk[1] - r_ - ANCHOR_Y_MARGIN
                                  && anchor_pos[1] <= d->chunk[1] + r_ + ANCHOR_Y_MARGIN;
                  }
                  // (Wholly behind the camera, with room to spare.)
                  int fwd = ((s64)dx * fx + (s64)dz * fz) >> 12;
                  if (!is_anchor && fwd < -(d->chunk[3] + BEHIND_MARGIN))
                      continue;
                  // (Wholly off to a side.)
                  int lat = ((s64)dz * fx - (s64)dx * fz) >> 12;
                  if (lat < 0)
                      lat = -lat;
                  if (!is_anchor && lat > mulf32(fwd > 0 ? fwd : 0, SIDE_TAN) + d->chunk[3] + SIDE_MARGIN)
                      continue;
                  // (The floor below, from a gallery above it.)
                  if (cull_below && d->chunk[1] + d->chunk[3] < cull_below)
                      continue;
                  // (A room's inside from out of it, or the world outside from in it.)
                  if (cull_mode)
                  {
                      int r = d->chunk[3];
                      int in = d->chunk[0] - r > cull_box[0] && d->chunk[0] + r < cull_box[2] && d->chunk[2] - r > cull_box[1] && d->chunk[2] + r < cull_box[3];
                      int out = d->chunk[0] + r < cull_box[0] || d->chunk[0] - r > cull_box[2] || d->chunk[2] + r < cull_box[1] || d->chunk[2] - r > cull_box[3];
                      if ((cull_mode == CULL_INSIDE && in) || (cull_mode == CULL_OUTSIDE && out))
                          continue;
                  }
                  anchor_of[i] = is_anchor;
                  int ax = dx < 0 ? -dx : dx, az = dz < 0 ? -dz : dz;
                  int b = (ax > az ? ax + az / 2 : az + ax / 2) - d->chunk[3];
                  b = b < 0 ? 0 : b >> BUCKET_SHIFT;
                  if (b >= NEAR_BUCKETS)
                      b = NEAR_BUCKETS - 1;
                  next[i] = head[b];
                  head[b] = i;
              }
              int n = 0, left = budget, full = 0, anchors = 0, anchor_tris = 0;
              // First the floor under the player, outside the budget (up to the cap).
              for (int i = 0; i < m->draw_count; i++)
              {
                  if (!anchor_of[i])
                      continue;
                  int t = (int)m->draws[i].triangles;
                  if (anchor_tris + t > ANCHOR_TRI_MAX && !(anchors == 0 && t <= ANCHOR_FIRST_MAX))
                      continue;
                  taken[i] = 1;
                  anchors++;
                  anchor_tris += t;
                  left = left > t ? left - t : 0;
                  chain_add(m, i, &n);
              }
              // Nearest first; once one doesn't fit, nothing farther is drawn (its own distance band is
              // finished). Skipping just that one let smaller chunks behind it in: a big wall near the
              // camera vanished, and the distance showed through it.
              for (int b = 0; b < NEAR_BUCKETS && !full; b++)
                  for (int i = head[b]; i >= 0; i = next[i])
                  {
                      const ModelDraw *d = &m->draws[i];
                      if (taken[i])
                          continue;
                      if ((int)d->triangles > left)
                      {
                          full = 1;
                          continue;
                      }
                      left -= d->triangles;
                      chain_add(m, i, &n);
                  }
              // Last, the list's closing MTX_POP.
              chain[n].src = m->async_list + m->async_words - 2;
              chain[n++].words = 2;
              chain_at = 0;
              chain_n = n;
              int irq = enterCriticalSection();
              chain_next();
              leaveCriticalSection(irq);
          }

          """
          c = c[:a] + NEW + c[b:]
          wr('model.c', c)

          m = rd('main.c')
          m = rep(m, "            model_draw_near(&stage, look_eye, look_at, stage_budget,", """            {
                          int anchor[3] = { leon_pos[0], leon_feet, leon_pos[2] };
                          model_set_anchor(anchor);   // the floor under Leon is never what the budget drops
                      }
                      model_draw_near(&stage, look_eye, look_at, stage_budget,""")
          wr('main.c', m)
          print("floor fix applied")
          RE4_EOF
          chmod +x symbian/tools/*.sh
          bash symbian/tools/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          path: symbian
          include-hidden-files: true

  host-test:
    name: Game + DS layer (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian
      - name: Compile, link and smoke-test against the software DS layer
        run: |
          chmod +x symbian/tools/*.sh
          bash symbian/tools/host_check.sh

  build-sis:
    name: Build re4ds.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          # install-sdk.sh requires perl to resolve to /opt/homebrew/opt/perl/bin/perl, not the linked
          # /opt/homebrew/bin/perl symlink, so keep the keg unlinked (as on a stock Mac).
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build RE4 DS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          cd symbian/group
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || true
          echo "=========== compile errors ==========="
          grep -E "error:|fatal error|undefined reference|\*\*\* \[|cannot find" "$GITHUB_WORKSPACE/build.log" \
            | sed 's|/Users/runner/work/[^/]*/[^/]*/||g' | sort -u | head -80 || true
          test -f "${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}epoc32/release/gcce/urel/re4ds.exe" || { echo "re4ds.exe was not built"; exit 1; }

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/sis/re4ds.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: re4ds-symbian3
          path: dist/re4ds.sisx

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/re4ds.sisx
