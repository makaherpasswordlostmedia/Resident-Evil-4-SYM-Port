          /* ----------------------------------------------------------------- string */
          __attribute__((weak)) void *memcpy(void *d, const void *s, size_t n)
          {
              unsigned char *a = (unsigned char *)d; const unsigned char *b = (const unsigned char *)s;
              if ((((unsigned long)a | (unsigned long)b) & 3) == 0)
              {
                  unsigned *wa = (unsigned *)a; const unsigned *wb = (const unsigned *)b;
                  for (; n >= 16; n -= 16) { wa[0] = wb[0]; wa[1] = wb[1]; wa[2] = wb[2]; wa[3] = wb[3]; wa += 4; wb += 4; }
                  for (; n >= 4; n -= 4) *wa++ = *wb++;
                  a = (unsigned char *)wa; b = (const unsigned char *)wb;
              }
              while (n--) *a++ = *b++;
              return d;
          }
          __attribute__((weak)) void *memmove(void *d, const void *s, size_t n)
          {
              unsigned char *a = (unsigned char *)d; const unsigned char *b = (const unsigned char *)s;
              if (a < b) while (n--) *a++ = *b++;
              else { a += n; b += n; while (n--) *--a = *--b; }
              return d;
          }
          __attribute__((weak)) void *memset(void *d, int c, size_t n)
          {
              unsigned char *a = (unsigned char *)d;
              unsigned char v = (unsigned char)c;
              if ((((unsigned long)a) & 3) == 0)
              {
                  unsigned w = v * 0x01010101u, *wa = (unsigned *)a;
                  for (; n >= 16; n -= 16) { wa[0] = w; wa[1] = w; wa[2] = w; wa[3] = w; wa += 4; }
                  for (; n >= 4; n -= 4) *wa++ = w;
                  a = (unsigned char *)wa;
              }
              while (n--) *a++ = v;
              return d;
          }
          __attribute__((weak)) int memcmp(const void *x, const void *y, size_t n)
          {
              const unsigned char *a = (const unsigned char *)x, *b = (const unsigned char *)y;
              for (; n; n--, a++, b++) if (*a != *b) return *a - *b;
              return 0;
          }
          size_t strlen(const char *s) { size_t n = 0; while (s[n]) n++; return n; }
          char *strcpy(char *d, const char *s) { char *r = d; while ((*d++ = *s++)) {} return r; }
          char *strncpy(char *d, const char *s, size_t n)
          {
              size_t i = 0;
              for (; i < n && s[i]; i++) d[i] = s[i];
              for (; i < n; i++) d[i] = 0;
              return d;
          }
          int strcmp(const char *a, const char *b) { while (*a && *a == *b) { a++; b++; } return (unsigned char)*a - (unsigned char)*b; }
          int strncmp(const char *a, const char *b, size_t n)
          {
              for (; n; n--, a++, b++) { if (*a != *b) return (unsigned char)*a - (unsigned char)*b; if (!*a) break; }
              return 0;
          }
          char *strchr(const char *s, int c) { for (; *s; s++) if (*s == (char)c) return (char *)s; return c == 0 ? (char *)s : 0; }

