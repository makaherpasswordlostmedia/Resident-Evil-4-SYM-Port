          static void update_mvp(void)
          {
              mat_mul(&mvp, &cur_pos, &cur_proj);
              mvp_dirty = 0;
          }

          /* ------------------------------------------------------ polygon buffer */
          typedef struct { int sx, sy, z, iw, u, v; u8 r, g, b, pad; } SV;
          typedef struct { u32 attr; int tex; u8 n, trans, line, pad; SV v[6]; } Poly;
          #define MAX_POLY 2048
          #define MAX_VERT 6144
          static Poly polys[MAX_POLY];
          static int npoly, nvert;

          typedef struct { int x, y, z, w, u, v; u8 r, g, b; } CV;
          static void gl_store(int idx, const CV *a, int m, const Poly *p);
          static void gl_snapshot(void);

          static u32 poly_attr = 0x1F0000 | POLY_CULL_NONE, cur_attr;
          static u8 cr = 31, cg = 31, cb = 31;
          static int cu, cv, vtx_type = -1, vq_n, strip_k;
          static int lx, ly, lz;
          static CV vq[4];

          static void lerp_cv(CV *o, const CV *a, const CV *b, s64 t16)
          {
          #define L(f) o->f = a->f + (int)(((s64)(b->f - a->f) * t16) >> 16)
              L(x); L(y); L(z); L(w); L(u); L(v);
              o->r = (u8)(a->r + (((int)b->r - a->r) * t16 >> 16));
              o->g = (u8)(a->g + (((int)b->g - a->g) * t16 >> 16));
              o->b = (u8)(a->b + (((int)b->b - a->b) * t16 >> 16));
          #undef L
          }

          static void to_screen(SV *o, const CV *c)
          {
              s64 w = c->w > 0 ? c->w : 1;
              s64 rw = ((s64)1 << 44) / w;
              s64 nx = ((s64)c->x * rw) >> 32, ny = ((s64)c->y * rw) >> 32, nz = ((s64)c->z * rw) >> 32;
              s64 sx = (nx + 4096) >> 1, sy = ((4096 - ny) * 3) >> 3;
              if (sx < -(1 << 18)) sx = -(1 << 18); if (sx > (1 << 18)) sx = 1 << 18;
              if (sy < -(1 << 18)) sy = -(1 << 18); if (sy > (1 << 18)) sy = 1 << 18;
              s64 d = ((nz + 4096) * 0x7FFF) >> 13;
              if (d < 0) d = 0; if (d > 0x7FFF) d = 0x7FFF;
              o->sx = (int)sx; o->sy = (int)sy; o->z = (int)d;
              o->iw = (int)(((s64)1 << 34) / w);
              o->u = c->u; o->v = c->v; o->r = c->r; o->g = c->g; o->b = c->b;
          }

          static void emit(const CV *in, int n)
          {
              CV a[8], b[8];
              int m = 0;
              for (int i = 0; i < n; i++)
              {
                  const CV *p = &in[i], *q = &in[(i + 1) % n];
                  s64 dp = (s64)p->z + p->w, dq = (s64)q->z + q->w;
                  if (dp >= 0) a[m++] = *p;
                  if ((dp >= 0) != (dq >= 0))
                      lerp_cv(&a[m++], p, q, (dp << 16) / (dp - dq));
              }
              if (m < 3) return;
              int out_far = 0;
              for (int i = 0; i < m; i++) if (a[i].z > a[i].w) out_far++;
              if (out_far == m) return;
              (void)b;
              if (npoly >= MAX_POLY || nvert + m > MAX_VERT) { shim_gfx_control |= 1 << 13; return; }

              Poly *p = &polys[npoly];
              for (int i = 0; i < m; i++) to_screen(&p->v[i], &a[i]);
              p->n = (u8)m;
              s64 area = 0;
              for (int i = 0; i < m; i++)
              {
                  const SV *s = &p->v[i], *t = &p->v[(i + 1) % m];
                  area += (s64)s->sx * t->sy - (s64)t->sx * s->sy;
              }
              int cull = (cur_attr >> 6) & 3;
              p->line = 0;
              if (area == 0) p->line = 1;
              else
              {
                  int front = area > 0;
                  if (cull == 0 || (cull == 1 && front) || (cull == 2 && !front)) return;
              }
              p->attr = cur_attr;
              p->tex = tex[bound_tex].used && tex[bound_tex].ready ? bound_tex : 0;
              int alpha = (cur_attr >> 16) & 31;
              p->trans = (alpha < 31 || (p->tex && tex[p->tex].has_alpha)) ? 1 : 0;
              if (shim_gl_mode) gl_store(npoly, a, m, p);
              npoly++;
              nvert += m;
          }

          static void vertex(int x, int y, int z)
          {
              if (mvp_dirty) update_mvp();
              CV v;
              const int *M = mvp.m;
              v.x = (int)((((s64)x * M[0] + (s64)y * M[4] + (s64)z * M[8]) >> 12) + M[12]);
              v.y = (int)((((s64)x * M[1] + (s64)y * M[5] + (s64)z * M[9]) >> 12) + M[13]);
              v.z = (int)((((s64)x * M[2] + (s64)y * M[6] + (s64)z * M[10]) >> 12) + M[14]);
              v.w = (int)((((s64)x * M[3] + (s64)y * M[7] + (s64)z * M[11]) >> 12) + M[15]);
              v.u = cu; v.v = cv; v.r = cr; v.g = cg; v.b = cb;
              lx = x; ly = y; lz = z;
              if (vtx_type < 0) return;
              switch (vtx_type)
              {
              case 0:
                  vq[vq_n++] = v;
                  if (vq_n == 3) { emit(vq, 3); vq_n = 0; }
                  break;
              case 1:
                  vq[vq_n++] = v;
                  if (vq_n == 4) { emit(vq, 4); vq_n = 0; }
                  break;
              case 2:
                  if (vq_n < 2) { vq[vq_n++] = v; strip_k = 0; break; }
                  {
                      CV t[3];
                      if (strip_k & 1) { t[0] = vq[1]; t[1] = vq[0]; } else { t[0] = vq[0]; t[1] = vq[1]; }
                      t[2] = v;
                      emit(t, 3);
                      vq[0] = vq[1]; vq[1] = v; strip_k++;
                  }
                  break;
              default:
                  vq[vq_n++] = v;
                  if (vq_n == 4)
                  {
                      CV t[4] = { vq[0], vq[1], vq[3], vq[2] };
                      emit(t, 4);
                      vq[0] = vq[2]; vq[1] = vq[3]; vq_n = 2;
                  }
                  break;
              }
          }

          void glBegin(int type) { vtx_type = type & 3; vq_n = 0; strip_k = 0; cur_attr = poly_attr; }
          void glEnd(void) { vtx_type = -1; }
          void glColor(rgb c) { cr = c & 31; cg = (c >> 5) & 31; cb = (c >> 10) & 31; }
          void glVertex3v16(v16 x, v16 y, v16 z) { vertex(x, y, z); }
          void glTexCoord2t16(t16 u, t16 v) { cu = u; cv = v; }
          void glPolyFmt(u32 f) { poly_attr = f; }

          /* ------------------------------------------------------------ rendering */
          static void rebuild_fog(void)
          {
              int step = 0x400 >> fog_shift;
              if (step < 1) step = 1;
              for (int z = 0; z < 0x8000; z++)
              {
                  int rel = z - fog_off, d;
                  if (rel < step) d = fog_tab[0];
                  else
                  {
                      int n = rel / step - 1;
                      if (n >= 31) d = fog_tab[31];
                      else d = fog_tab[n] + (fog_tab[n + 1] - fog_tab[n]) * (rel % step) / step;
                  }
                  fog_lut[z] = (u8)d;
              }
              fog_dirty = 0;
          }

          void glFlush(u32 flags)
          {
              (void)flags;
              shim_trace("glFlush");
              shim_where = "flush";
              shim_dma_run();
              static int first = 1;
              if (first)
              {
                  char m[64];
                  snprintf(m, sizeof m, "first glFlush: %d polys", npoly);
                  host_log(m);
                  first = 0;
              }
              shim_polys_last = (u32)npoly;
              u32 t0 = host_ticks_ms();
              shim_where = "snapshot";
              gl_snapshot();
              shim_ms_flush = host_ticks_ms() - t0;
              npoly = nvert = 0;
          }

          /* ---------------------------------------------------- misc gl* and status */
          void glInit(void)
          {
              shim_trace("glInit");
              mat_ident(&cur_pos); mat_ident(&cur_proj); mat_ident(&mvp);
              sp = 0; mvp_dirty = 1; npoly = nvert = 0;
              memset(tex, 0, sizeof tex);
          }
          void glEnable(int bits) { if (bits & GL_FOG) fog_on = 1; }
          void glDisable(int bits) { if (bits & GL_FOG) fog_on = 0; }
          void glViewport(u8 x1, u8 y1, u8 x2, u8 y2) { (void)x1; (void)y1; (void)x2; (void)y2; }
          void glClearColor(u8 r, u8 g, u8 b, u8 a) { (void)a; clr_r = r & 31; clr_g = g & 31; clr_b = b & 31; }
          void glClearPolyID(u8 id) { (void)id; }
          void glClearDepth(int d) { clr_depth = d & 0x7FFF; }
          void glFogColor(u8 r, u8 g, u8 b, u8 a) { (void)a; fog_r = r & 31; fog_g = g & 31; fog_b = b & 31; }
          void glFogShift(int s) { fog_shift = s & 15; fog_dirty = 1; }
          void glFogOffset(int o) { fog_off = o; fog_dirty = 1; }
          void glFogDensity(int i, int d) { if (i >= 0 && i < 32) { fog_tab[i] = (u8)(d > 127 ? 127 : d); fog_dirty = 1; } }

          u32 shim_gfx_status(void) { shim_dma_run(); return 0; }
          u32 shim_poly_ram(void) { shim_dma_run(); return (u32)npoly; }
          u32 shim_vert_ram(void) { shim_dma_run(); return (u32)nvert; }

          /* --------------------------------------------------- packed GX commands */
          static int nparams(int c)
          {
              switch (c)
              {
              case 0x10: case 0x12: case 0x13: case 0x14: return 1;
              case 0x16: case 0x18: return 16;
              case 0x17: case 0x19: return 12;
              case 0x1A: return 9;
              case 0x1B: case 0x1C: return 3;
              case 0x20: case 0x21: case 0x22: return 1;
              case 0x23: return 2;
              case 0x24: case 0x25: case 0x26: case 0x27: case 0x28: return 1;
              case 0x29: case 0x2A: case 0x2B: return 1;
              case 0x30: case 0x31: case 0x32: case 0x33: return 1;
              case 0x34: return 32;
              case 0x40: case 0x50: case 0x60: return 1;
              case 0x70: return 3;
              case 0x71: return 2;
              case 0x72: return 1;
              default: return 0;
              }
          }

          static u32 pk_cmds, pk_param[32];
          static int pk_ncmds, pk_need, pk_got, pk_cur;

          static void exec(int c, const u32 *p)
          {
              Mat m;
              switch (c)
              {
              case 0x10: glMatrixMode((int)p[0]); break;
              case 0x11: glPushMatrix(); break;
              case 0x12: glPopMatrix(((int)(p[0] << 26)) >> 26); break;
              case 0x13: glStoreMatrix((int)p[0]); break;
              case 0x14: glRestoreMatrix((int)p[0]); break;
              case 0x15: glLoadIdentity(); break;
              case 0x16: memcpy(m.m, p, 64); load(&m); break;
              case 0x17: op43(&m, (const int *)p); load(&m); break;
              case 0x18: memcpy(m.m, p, 64); apply(&m); break;
              case 0x19: op43(&m, (const int *)p); apply(&m); break;
              case 0x1A: mat_ident(&m); for (int r = 0; r < 3; r++) for (int k = 0; k < 3; k++) m.m[r * 4 + k] = (int)p[r * 3 + k]; apply(&m); break;
              case 0x1B: glScalef32((int)p[0], (int)p[1], (int)p[2]); break;
              case 0x1C: glTranslatef32((int)p[0], (int)p[1], (int)p[2]); break;
              case 0x20: glColor((rgb)p[0]); break;
              case 0x22: cu = (s16)p[0]; cv = (s16)(p[0] >> 16); break;
              case 0x23: vertex((s16)p[0], (s16)(p[0] >> 16), (s16)p[1]); break;
              case 0x24: vertex(((int)(p[0] << 22) >> 22) << 6, ((int)(p[0] << 12) >> 22) << 6, ((int)(p[0] << 2) >> 22) << 6); break;
              case 0x25: vertex((s16)p[0], (s16)(p[0] >> 16), lz); break;
              case 0x26: vertex((s16)p[0], ly, (s16)(p[0] >> 16)); break;
              case 0x27: vertex(lx, (s16)p[0], (s16)(p[0] >> 16)); break;
              case 0x29: glPolyFmt(p[0]); break;
              case 0x2A: glBindTexture(0, (int)(p[0] & 0xFFFF)); break;
              case 0x40: glBegin((int)(p[0] & 3)); break;
              case 0x41: glEnd(); break;
              default: break;
              }
          }

          static void advance(void)
          {
              while (pk_ncmds > 0)
              {
                  int c = pk_cmds & 255;
                  pk_cmds >>= 8;
                  pk_ncmds--;
                  if (!c) continue;
                  int n = nparams(c);
                  if (n == 0) exec(c, pk_param);
                  else { pk_cur = c; pk_need = n; pk_got = 0; return; }
              }
          }

          void shim_gx_push(u32 w)
          {
              if (pk_need)
              {
                  pk_param[pk_got++] = w;
                  if (pk_got >= pk_need) { int c = pk_cur; pk_need = 0; exec(c, pk_param); advance(); }
              }
              else { pk_cmds = w; pk_ncmds = 4; advance(); }
          }

          /* ------------------------------------------------------------------ DMA */
          void shim_dma_run(void)
          {
              shim_trace("dma");
              for (int again = 1; again;)
              {
                  again = 0;
                  for (int ch = 0; ch < 4; ch++)
                  {
                      ShimDma *d = &shim_dma[ch];
                      if (!(d->cr & DMA_ENABLE)) continue;
                      u32 cr = d->cr, words = cr & 0x1FFFFF;
                      const u32 *src = (const u32 *)(uintptr_t)d->src;
                      d->cr = cr & ~DMA_ENABLE;
                      if (d->dest == (u32)(uintptr_t)&shim_gfx_fifo_reg)
                          for (u32 i = 0; i < words; i++) shim_gx_push(src[i]);
                      if (cr & DMA_IRQ_REQ)
                      {
                          shim_trace("dma-irq");
                          IntFn f = shim_irq_handler(8 + ch);
                          if (f) { f(); again = 1; }
                      }
                  }
              }
          }

          int dmaBusy(int ch) { (void)ch; shim_dma_run(); return 0; }

          /* ====================================================================== GLES 2.0 hand-off
           * In GL mode the polygons are not rasterised here: the clipped polygons are packed into a
           * triangle list (+ batches of equal state) for the UI thread's GLES 2.0 renderer, and textures
           * are handed over as ARGB pixel blocks. Everything is integer maths. */
          #define GL_MAX_VERT (MAX_POLY * 12)
          static ShimGlVert *glc;                       /* clipped polygon vertices, MAX_POLY * 6 */
          static ShimGlGeo geo[3];
          static int geo_ready = -1, geo_reading = -1;
          static unsigned geo_seq;

          typedef struct TexNode { ShimGlTexEv ev; struct TexNode *next; } TexNode;
          static TexNode *tex_head, *tex_tail;

          int shim_gl_enable(void)
          {
              if (shim_gl_mode) return 1;
              glc = (ShimGlVert *)malloc(sizeof(ShimGlVert) * MAX_POLY * 6);
              int ok = glc != 0;
              for (int k = 0; k < 3 && ok; k++)
              {
                  geo[k].v = (ShimGlVert *)malloc(sizeof(ShimGlVert) * GL_MAX_VERT);
                  geo[k].b = (ShimGlBatch *)malloc(sizeof(ShimGlBatch) * MAX_POLY);
                  ok = geo[k].v && geo[k].b;
              }
              if (!ok) return 0;
              shim_gl_mode = 1;
              return 1;
          }

          static void tex_push(int kind, int id, int w, int h, int ws, int wt, u32 *px)
          {
              TexNode *n = (TexNode *)malloc(sizeof(TexNode));
              if (!n) { if (px) free(px); return; }
              n->ev.kind = kind; n->ev.id = id; n->ev.w = w; n->ev.h = h; n->ev.wrap_s = ws; n->ev.wrap_t = wt; n->ev.px = (unsigned int *)px;
              n->next = 0;
              host_lock();
              if (tex_tail) tex_tail->next = n; else tex_head = n;
              tex_tail = n;
              host_unlock();
          }

          static void tex_ready(int id)
          {
              Tex *t = &tex[id];
              t->ready = 1;
              if (shim_gl_mode)
              {
                  tex_push(1, id, t->w, t->h, t->wrap_s, t->wrap_t, t->px);
                  t->px = 0;                  /* ownership moved to the GL thread */
              }
          }

          int shim_gl_next_tex(ShimGlTexEv *ev)
          {
              host_lock();
              TexNode *n = tex_head;
              if (n) { tex_head = n->next; if (!tex_head) tex_tail = 0; }
              host_unlock();
              if (!n) return 0;
              *ev = n->ev;
              free(n);
              return 1;
          }

          /* float bits of  v / 2^shift  without any floating point */
          static unsigned i2f(int v, int shift)
          {
              if (!v) return 0;
              unsigned sign = 0, a = (unsigned)v;
              if (v < 0) { sign = 0x80000000u; a = 0u - (unsigned)v; }
              int n = 31 - __builtin_clz(a);
              unsigned m = n <= 23 ? (a << (23 - n)) : (a >> (n - 23));
              return sign | ((unsigned)(n - shift + 127) << 23) | (m & 0x7FFFFF);
          }

          static void gl_store(int idx, const CV *a, int m, const Poly *p)
          {
              if (!glc) return;
              int alpha = (p->attr >> 16) & 31;
              unsigned char a8 = (unsigned char)(alpha * 255 / 31);
              int lw = 0, lh = 0;
              if (p->tex) { lw = tex[p->tex].lw; lh = tex[p->tex].lh; }
              for (int i = 0; i < m && i < 6; i++)
              {
                  ShimGlVert *o = &glc[idx * 6 + i];
                  o->x = i2f(a[i].x, 12); o->y = i2f(a[i].y, 12); o->z = i2f(a[i].z, 12); o->w = i2f(a[i].w, 12);
                  o->u = i2f(a[i].u, 4 + lw); o->v = i2f(a[i].v, 4 + lh);
                  o->r = (unsigned char)(a[i].r << 3 | a[i].r >> 2);
                  o->g = (unsigned char)(a[i].g << 3 | a[i].g >> 2);
                  o->b = (unsigned char)(a[i].b << 3 | a[i].b >> 2);
                  o->a = a8;
              }
          }

          static void gl_snapshot(void)
          {
              if (!glc) return;
              if (fog_dirty) rebuild_fog();
              host_lock();
              int w = 0;
              while (w == geo_ready || w == geo_reading) w++;      /* three buffers: always one is free */
              host_unlock();
              ShimGlGeo *g = &geo[w];
              int nv = 0, nb = 0;
              for (int pass = 0; pass < 2; pass++)
                  for (int i = 0; i < npoly; i++)
                  {
                      const Poly *p = &polys[i];
                      if (p->trans != pass || p->line) continue;
                      unsigned flags = (p->trans ? SHIM_GLB_TRANS : 0) | ((fog_on && (p->attr & POLY_FOG)) ? SHIM_GLB_FOG : 0) |
                                       ((!p->trans || (p->attr & POLY_NEW_DEPTH)) ? SHIM_GLB_DEPTHW : 0) |
                                       ((p->attr & POLY_DEPTHTEST_EQUAL) ? SHIM_GLB_DEQ : 0);
                      int tris = p->n - 2;
                      if (tris < 1 || nv + tris * 3 > GL_MAX_VERT) continue;
                      if (nb > 0 && g->b[nb - 1].tex == p->tex && g->b[nb - 1].flags == flags)
                          g->b[nb - 1].count += tris * 3;
                      else
                      {
                          g->b[nb].first = nv; g->b[nb].count = tris * 3; g->b[nb].tex = p->tex; g->b[nb].flags = flags;
                          nb++;
                      }
                      const ShimGlVert *c = &glc[i * 6];
                      for (int k = 1; k <= tris; k++)
                      {
                          g->v[nv++] = c[0]; g->v[nv++] = c[k]; g->v[nv++] = c[k + 1];
                      }
                  }
              g->nv = nv; g->nb = nb;
              g->clr[0] = clr_r; g->clr[1] = clr_g; g->clr[2] = clr_b;
              g->clr_depth = (unsigned short)clr_depth;
              g->fog_on = (unsigned char)fog_on;
              g->fog_col[0] = fog_r; g->fog_col[1] = fog_g; g->fog_col[2] = fog_b;
              for (int i = 0; i < 512; i++) g->fog_lut[i] = (unsigned char)(fog_lut[i * 64] * 2);
              g->seq = ++geo_seq;
              host_lock();
              geo_ready = w;
              host_unlock();
          }

          const ShimGlGeo *shim_gl_acquire(void)
          {
              host_lock();
              geo_reading = geo_ready;
              int r = geo_ready;
              host_unlock();
              return r < 0 ? 0 : &geo[r];
          }
