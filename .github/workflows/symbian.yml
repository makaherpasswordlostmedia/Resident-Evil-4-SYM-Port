          static int aff_pa = 256, aff_pd = 256;

          void oamInit(OamState *o, SpriteMapping m, bool ext)
          {
              (void)o; (void)m; (void)ext;
              for (int i = 0; i < 128; i++) spr[i].hide = 1;
          }
          void oamSet(OamState *o, int id, int x, int y, int prio, int pal, SpriteSize sz, SpriteColorFormat fmt,
                      const void *gfx, int affine, bool dbl, bool hide, bool hflip, bool vflip, bool mosaic)
          {
              (void)o; (void)prio; (void)sz; (void)fmt; (void)mosaic;
              if (id < 0 || id >= 128) return;
              Spr *s = &spr[id];
              s->x = x; s->y = y; s->pal = pal & 15;
              s->off = (int)((const u8 *)gfx - shim_spr_gfx);
              s->aff = affine; s->dbl = dbl; s->hide = hide; s->hflip = hflip; s->vflip = vflip;
          }
          void oamRotateScale(OamState *o, int id, int angle, int sx, int sy)
          {
              (void)o; (void)id; (void)angle;
