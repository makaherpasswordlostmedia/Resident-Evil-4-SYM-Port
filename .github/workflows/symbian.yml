              for (int r = 0; r < 3; r++) { p[r * 3] = (int)(s[r] * 4096); p[r * 3 + 1] = (int)(uu[r] * 4096); p[r * 3 + 2] = (int)(-f[r] * 4096); }
              p[9] = p[10] = p[11] = 0;
