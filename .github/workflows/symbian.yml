          mkdir -p symbian/shim
          cat > symbian/shim/gx.c <<'RE4_EOF'
          // gx.c - emulation of the DS 3D engine: matrix stacks, packed GX commands, clipping and a polygon
          // buffer (2048 polygons / 6144 vertices like the hardware). The polygons are drawn by OpenGL ES 2.0
          // (glesr.c); there is no software rasteriser.
          #include "nds.h"

          IntFn shim_irq_handler(int bit);
          extern volatile int shim_skip_render;
          extern volatile u32 shim_last_render;

          u32 shim_fb3d[256 * 192];

          /* ----------------------------------------------------------------- state */
          typedef struct { int m[16]; } Mat;            /* row vectors: v' = v * M, f32 entries */
          static Mat cur_pos, cur_proj, pos_stack[32], proj_saved, mvp;
          static int sp, mtx_mode, mvp_dirty = 1;

          static u8 clr_r, clr_g, clr_b;
          static int clr_depth = 0x7FFF;
          static int fog_on, fog_shift, fog_off;
          static u8 fog_r, fog_g, fog_b, fog_tab[32];
          static u8 fog_lut[0x8000];
          static int fog_dirty = 1;

          volatile u32 shim_gfx_fifo_reg;
          u32 shim_gfx_control;
          ShimDma shim_dma[4];

          /* ------------------------------------------------------------- textures */
          typedef struct {
              u32 *px;            /* ARGB, a = 0..255 */
              u8 *idx;            /* raw texels until the palette arrives */
              u16 w, h;
              u8 used, type, has_alpha, wrap_s, wrap_t, color0;
          } Tex;
          #define MAX_TEX 640
          static Tex tex[MAX_TEX];
          static int bound_tex;
          static u8 gl_up[MAX_TEX];            /* texture i is uploaded to the GPU */
          void glesr_tex_free(int id);

          void glGenTextures(int n, int *names)
          {
              for (int k = 0; k < n; k++)
              {
                  names[k] = 0;
                  for (int i = 1; i < MAX_TEX; i++)
                      if (!tex[i].used) { memset(&tex[i], 0, sizeof(Tex)); tex[i].used = 1; names[k] = i; break; }
              }
          }
          void glDeleteTextures(int n, int *names)
          {
              for (int k = 0; k < n; k++)
              {
                  int i = names[k];
                  if (i <= 0 || i >= MAX_TEX) continue;
                  free(tex[i].px); free(tex[i].idx);
                  if (gl_up[i]) { glesr_tex_free(i); gl_up[i] = 0; }
                  memset(&tex[i], 0, sizeof(Tex));
                  if (bound_tex == i) bound_tex = 0;
                  names[k] = 0;
              }
          }
          int glBindTexture(int target, int name)
          {
              (void)target;
              bound_tex = (name > 0 && name < MAX_TEX && tex[name].used) ? name : 0;
              return 1;
          }
          u32 glGetTexParameter(void) { return bound_tex; }
          int glGetColorTableParameterEXT(int target, int pname, int *params)
          {
              (void)target; (void)pname;
              *params = bound_tex;
              return 1;
          }

          static u32 argb555(u16 c, u32 a)
          {
              u32 r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
              return (a << 24) | ((r << 3 | r >> 2) << 16) | ((g << 3 | g >> 2) << 8) | (b << 3 | b >> 2);
          }

          int glTexImageNtr2D(GL_TEXTURE_TYPE_ENUM type, int w, int h, int param, const void *texels, const void *unused)
          {
              (void)unused;
              Tex *t = &tex[bound_tex];
              if (!bound_tex || w <= 0 || h <= 0 || w > 1024 || h > 1024) return 0;
              u32 n = (u32)w * h, bytes;
              switch (type)
              {
              case GL_RGB256: case GL_RGB8_A5: case GL_RGB32_A3: bytes = n; break;
              case GL_RGB16: bytes = n / 2; break;
              case GL_RGB4: bytes = n / 4; break;
              case GL_RGB: bytes = n * 2; break;
              default: return 0;
              }
              free(t->px); free(t->idx);
              t->px = 0; t->idx = 0;
              if (gl_up[bound_tex]) { glesr_tex_free(bound_tex); gl_up[bound_tex] = 0; }
              t->w = (u16)w; t->h = (u16)h; t->type = (u8)type;
              t->has_alpha = type == GL_RGB8_A5 || type == GL_RGB32_A3;
              t->wrap_s = (param & GL_TEXTURE_WRAP_S) != 0;
              t->wrap_t = (param & GL_TEXTURE_WRAP_T) != 0;
              t->color0 = (param & GL_TEXTURE_COLOR0_TRANSPARENT) != 0;
              if (type == GL_RGB)
              {
                  const u16 *s = (const u16 *)texels;
                  t->px = (u32 *)malloc(n * 4);
                  if (!t->px) return 0;
                  for (u32 i = 0; i < n; i++) t->px[i] = argb555(s[i], (s[i] & 0x8000) ? 255 : 0);
                  return 1;
              }
              t->idx = (u8 *)malloc(n);
              if (!t->idx) return 0;
              const u8 *s = (const u8 *)texels;
              if (type == GL_RGB16) for (u32 i = 0; i < n; i++) t->idx[i] = (s[i >> 1] >> ((i & 1) * 4)) & 15;
              else if (type == GL_RGB4) for (u32 i = 0; i < n; i++) t->idx[i] = (s[i >> 2] >> ((i & 3) * 2)) & 3;
              else memcpy(t->idx, s, n);
              (void)bytes;
              return 1;
          }

          int glColorTableNtr(int count, const u16 *pal)
          {
              Tex *t = &tex[bound_tex];
              if (!bound_tex || !t->idx) return 0;
              u32 n = (u32)t->w * t->h;
              u32 lut[256];
              for (int i = 0; i < 256; i++) lut[i] = i < count ? argb555(pal[i], 255) : (count > 0 ? argb555(pal[count - 1], 255) : 0);
              if (t->color0 && count > 0 && !t->has_alpha) lut[0] &= 0x00FFFFFF;
              if (gl_up[bound_tex]) { glesr_tex_free(bound_tex); gl_up[bound_tex] = 0; }
              t->px = (u32 *)malloc(n * 4);
              if (!t->px) return 0;
              for (u32 i = 0; i < n; i++)
              {
                  u32 b = t->idx[i];
                  if (t->type == GL_RGB8_A5)
                  {
                      u32 a = b >> 3;
                      t->px[i] = (lut[b & 7] & 0x00FFFFFF) | ((a << 3 | a >> 2) << 24);
                  }
                  else if (t->type == GL_RGB32_A3)
                  {
                      u32 a = b >> 5;
                      t->px[i] = (lut[b & 31] & 0x00FFFFFF) | ((a << 5 | a << 2 | a >> 1) << 24);
                  }
                  else t->px[i] = lut[b];
              }
              free(t->idx);
              t->idx = 0;
              return 1;
          }

          /* -------------------------------------------------------------- matrices */
          static void mat_ident(Mat *m) { memset(m, 0, sizeof *m); m->m[0] = m->m[5] = m->m[10] = m->m[15] = 4096; }
          static void mat_mul(Mat *out, const Mat *a, const Mat *b)      /* out = a, then b */
          {
              Mat r;
              for (int i = 0; i < 4; i++)
                  for (int j = 0; j < 4; j++)
                  {
                      s64 s = 0;
                      for (int k = 0; k < 4; k++) s += (s64)a->m[i * 4 + k] * b->m[k * 4 + j];
                      r.m[i * 4 + j] = (int)(s >> 12);
                  }
              *out = r;
          }
          static void apply(const Mat *op)
          {
              if (mtx_mode == 0) mat_mul(&cur_proj, op, &cur_proj);
              else if (mtx_mode != 3) mat_mul(&cur_pos, op, &cur_pos);
              mvp_dirty = 1;
          }
          static void load(const Mat *m)
          {
              if (mtx_mode == 0) cur_proj = *m;
              else if (mtx_mode != 3) cur_pos = *m;
              mvp_dirty = 1;
          }

          void glMatrixMode(int mode) { mtx_mode = mode & 3; }
          void glLoadIdentity(void) { Mat m; mat_ident(&m); load(&m); }
          void glPushMatrix(void)
          {
              if (mtx_mode == 0) proj_saved = cur_proj;
              else if (mtx_mode != 3) { pos_stack[sp & 31] = cur_pos; sp++; }
          }
          void glPopMatrix(int n)
          {
              if (mtx_mode == 0) { cur_proj = proj_saved; }
              else if (mtx_mode != 3) { sp -= n; cur_pos = pos_stack[sp & 31]; }
              mvp_dirty = 1;
          }
          void glStoreMatrix(int pos) { pos_stack[pos & 31] = cur_pos; }
          void glRestoreMatrix(int pos) { cur_pos = pos_stack[pos & 31]; mvp_dirty = 1; }
          void glTranslatef32(int x, int y, int z) { Mat m; mat_ident(&m); m.m[12] = x; m.m[13] = y; m.m[14] = z; apply(&m); }
          void glScalef32(int x, int y, int z) { Mat m; mat_ident(&m); m.m[0] = x; m.m[5] = y; m.m[10] = z; apply(&m); }
          void glRotateYi(int a)
          {
              Mat m; mat_ident(&m);
              int s = sinLerp((s16)a), c = cosLerp((s16)a);
              m.m[0] = c; m.m[2] = -s; m.m[8] = s; m.m[10] = c;
              apply(&m);
          }
          void glRotateZi(int a)
          {
              Mat m; mat_ident(&m);
              int s = sinLerp((s16)a), c = cosLerp((s16)a);
              m.m[0] = c; m.m[1] = s; m.m[4] = -s; m.m[5] = c;
              apply(&m);
          }
          static void op43(Mat *m, const int *p)
          {
              mat_ident(m);
              for (int r = 0; r < 4; r++)
                  for (int c = 0; c < 3; c++) m->m[r * 4 + c] = p[r * 3 + c];
          }
          void glMultMatrix4x3(const m4x3 *a) { Mat m; op43(&m, a->m); apply(&m); }

          void glOrthof32(int l, int r, int b, int t, int n, int f)
          {
              Mat m; mat_ident(&m);
              m.m[0] = divf32(inttof32(2), r - l);
              m.m[5] = divf32(inttof32(2), t - b);
              m.m[10] = -divf32(inttof32(2), f - n);
              m.m[12] = -divf32(r + l, r - l);
              m.m[13] = -divf32(t + b, t - b);
              m.m[14] = -divf32(f + n, f - n);
              apply(&m);
          }

          static void frustum(int l, int r, int b, int t, int n, int f)
          {
              Mat m; memset(&m, 0, sizeof m);
              double dl = l / 4096.0, dr = r / 4096.0, db = b / 4096.0, dt = t / 4096.0, dn = n / 4096.0, df = f / 4096.0;
              m.m[0] = (int)(2 * dn / (dr - dl) * 4096);
              m.m[5] = (int)(2 * dn / (dt - db) * 4096);
              m.m[8] = (int)((dr + dl) / (dr - dl) * 4096);
              m.m[9] = (int)((dt + db) / (dt - db) * 4096);
              m.m[10] = (int)(-(df + dn) / (df - dn) * 4096);
              m.m[11] = -4096;
              m.m[14] = (int)(-2 * df * dn / (df - dn) * 4096);
              apply(&m);
          }

          void gluPerspectivef32(int fovy, int aspect, int zNear, int zFar)
          {
              int ymax = mulf32(zNear, tanLerp((s16)(fovy >> 1)));
              int xmax = mulf32(ymax, aspect);
              frustum(-xmax, xmax, -ymax, ymax, zNear, zFar);
          }

          static void vnorm(double *v)
          {
              double l2 = v[0] * v[0] + v[1] * v[1] + v[2] * v[2];
              double l = sqrt64((u64)(l2 * 1e6)) / 1000.0;
              if (l < 1e-9) return;
              v[0] /= l; v[1] /= l; v[2] /= l;
          }
          void gluLookAtf32(int ex, int ey, int ez, int lx, int ly, int lz, int ux, int uy, int uz)
          {
              double f[3] = { (lx - ex) / 4096.0, (ly - ey) / 4096.0, (lz - ez) / 4096.0 };
              double u[3] = { ux / 4096.0, uy / 4096.0, uz / 4096.0 };
              vnorm(f);
              double s[3] = { f[1] * u[2] - f[2] * u[1], f[2] * u[0] - f[0] * u[2], f[0] * u[1] - f[1] * u[0] };
              vnorm(s);
              double uu[3] = { s[1] * f[2] - s[2] * f[1], s[2] * f[0] - s[0] * f[2], s[0] * f[1] - s[1] * f[0] };
              int p[12];
              for (int r = 0; r < 3; r++) { p[r * 3] = (int)(s[r] * 4096); p[r * 3 + 1] = (int)(uu[r] * 4096); p[r * 3 + 2] = (int)(-f[r] * 4096); }
              p[9] = p[10] = p[11] = 0;
              Mat m; op43(&m, p);
              apply(&m);
              glTranslatef32(-ex, -ey, -ez);
          }

          static void update_mvp(void)
          {
              mat_mul(&mvp, &cur_pos, &cur_proj);
              mvp_dirty = 0;
          }

          /* ------------------------------------------------------ polygon buffer */
          typedef struct { int sx, sy, z, iw, u, v; u8 r, g, b, pad; } SV;
          typedef struct { u32 attr; int tex; u8 n, trans, line, pad; SV v[10]; } Poly;
          #define MAX_POLY 2048
          #define MAX_VERT 6144
          static Poly polys[MAX_POLY];
          static int npoly, nvert;

          typedef struct { int x, y, z, w, u, v; u8 r, g, b; } CV;

          static u32 poly_attr = 0x1F0000 | POLY_CULL_NONE, cur_attr;
          static u8 cr = 31, cg = 31, cb = 31;
          static int cu, cv, vtx_type = -1, vq_n, strip_k;
          static int lx, ly, lz;
          static CV vq[4];

          static void lerp_cv(CV *o, const CV *a, const CV *b, s64 t16)
          {
          #define L(f) o->f = a->f + (int)(((s64)(b->f - a->f) * t16) >> 16)
              L(x); L(y); L(z); L(w); L(u); L(v);
              o->r = (u8)(a->r + (((int)b->r - a->r) * t16 >> 16));
              o->g = (u8)(a->g + (((int)b->g - a->g) * t16 >> 16));
              o->b = (u8)(a->b + (((int)b->b - a->b) * t16 >> 16));
          #undef L
          }

          static void to_screen(SV *o, const CV *c)
          {
              s64 w = c->w > 0 ? c->w : 1;
              s64 rw = ((s64)1 << 44) / w;
              s64 nx = ((s64)c->x * rw) >> 32, ny = ((s64)c->y * rw) >> 32, nz = ((s64)c->z * rw) >> 32;
              s64 sx = (nx + 4096) >> 1, sy = ((4096 - ny) * 3) >> 3;
              if (sx < -(1 << 18)) sx = -(1 << 18); if (sx > (1 << 18)) sx = 1 << 18;
              if (sy < -(1 << 18)) sy = -(1 << 18); if (sy > (1 << 18)) sy = 1 << 18;
              s64 d = ((nz + 4096) * 0x7FFF) >> 13;
              if (d < 0) d = 0; if (d > 0x7FFF) d = 0x7FFF;
              o->sx = (int)sx; o->sy = (int)sy; o->z = (int)d;
              o->iw = (int)(rw >> 10);            /* 2^34 / w, from the reciprocal already made */
              o->u = c->u; o->v = c->v; o->r = c->r; o->g = c->g; o->b = c->b;
          }

          static s64 plane_d(const CV *v, int pl)      /* >= 0: inside the left / right / bottom / top side */
          {
              switch (pl)
              {
              case 0: return (s64)v->x + v->w;
              case 1: return (s64)v->w - v->x;
              case 2: return (s64)v->y + v->w;
              default: return (s64)v->w - v->y;
              }
          }

          static void emit(const CV *in, int n)
          {
              CV a[12], b[12];
              int m = 0;
              for (int i = 0; i < n; i++)
                  for (int j = i + 1; j < n; j++)
                      if (in[i].x == in[j].x && in[i].y == in[j].y && in[i].z == in[j].z && in[i].w == in[j].w)
                          return;   /* (a repeated vertex: the empty triangle joining strip runs, no polygon) */
              for (int i = 0; i < n; i++)
              {
                  const CV *p = &in[i], *q = &in[(i + 1) % n];
                  s64 dp = (s64)p->z + p->w, dq = (s64)q->z + q->w;
                  if (dp >= 0) a[m++] = *p;
                  if ((dp >= 0) != (dq >= 0))
                      lerp_cv(&a[m++], p, q, (dp << 16) / (dp - dq));
              }
              if (m < 3) return;
              /* the four sides of the view too, as the hardware does: a big floor / wall polygon would otherwise get
                 screen coordinates far outside the viewport, be clamped and its texture smear into streaks */
              for (int pl = 0; pl < 4; pl++)
              {
                  int neg = 0;
                  for (int i = 0; i < m; i++) if (plane_d(&a[i], pl) < 0) neg++;
                  if (neg == 0) continue;
                  if (neg == m) return;                      /* wholly outside this side: nothing to draw */
                  int k = 0;
                  for (int i = 0; i < m; i++)
                  {
                      const CV *p = &a[i], *q = &a[(i + 1) % m];
                      s64 dp = plane_d(p, pl), dq = plane_d(q, pl);
                      if (dp >= 0) b[k++] = *p;
                      if ((dp >= 0) != (dq >= 0)) lerp_cv(&b[k++], p, q, (dp << 16) / (dp - dq));
                  }
                  for (int i = 0; i < k; i++) a[i] = b[i];
                  m = k;
                  if (m < 3) return;
              }
              int out_far = 0;
              for (int i = 0; i < m; i++) if (a[i].z > a[i].w) out_far++;
              if (out_far == m) return;
              if (npoly >= MAX_POLY || nvert + m > MAX_VERT) { shim_gfx_control |= 1 << 13; return; }

              Poly *p = &polys[npoly];
              for (int i = 0; i < m; i++) to_screen(&p->v[i], &a[i]);
              p->n = (u8)m;
              s64 area = 0;
              for (int i = 0; i < m; i++)
              {
                  const SV *s = &p->v[i], *t = &p->v[(i + 1) % m];
                  area += (s64)s->sx * t->sy - (s64)t->sx * s->sy;
              }
              int cull = (cur_attr >> 6) & 3;
              p->line = 0;
              if (area == 0) p->line = 1;
              else
              {
                  int front = area > 0;
                  if (cull == 0 || (cull == 1 && front) || (cull == 2 && !front)) return;
              }
              p->attr = cur_attr;
              p->tex = tex[bound_tex].used && tex[bound_tex].px ? bound_tex : 0;
              int alpha = (cur_attr >> 16) & 31;
              p->trans = (alpha < 31 || (p->tex && tex[p->tex].has_alpha)) ? 1 : 0;
              npoly++;
              nvert += m;
          }

          static void vertex(int x, int y, int z)
          {
              if (mvp_dirty) update_mvp();
              CV v;
              const int *M = mvp.m;
              v.x = (int)((((s64)x * M[0] + (s64)y * M[4] + (s64)z * M[8]) >> 12) + M[12]);
              v.y = (int)((((s64)x * M[1] + (s64)y * M[5] + (s64)z * M[9]) >> 12) + M[13]);
              v.z = (int)((((s64)x * M[2] + (s64)y * M[6] + (s64)z * M[10]) >> 12) + M[14]);
              v.w = (int)((((s64)x * M[3] + (s64)y * M[7] + (s64)z * M[11]) >> 12) + M[15]);
              v.u = cu; v.v = cv; v.r = cr; v.g = cg; v.b = cb;
              lx = x; ly = y; lz = z;
              if (vtx_type < 0) return;
              switch (vtx_type)
              {
              case 0:
                  vq[vq_n++] = v;
                  if (vq_n == 3) { emit(vq, 3); vq_n = 0; }
                  break;
              case 1:
                  vq[vq_n++] = v;
                  if (vq_n == 4) { emit(vq, 4); vq_n = 0; }
                  break;
              case 2:
                  if (vq_n < 2) { vq[vq_n++] = v; strip_k = 0; break; }
                  {
                      CV t[3];
                      if (strip_k & 1) { t[0] = vq[1]; t[1] = vq[0]; } else { t[0] = vq[0]; t[1] = vq[1]; }
                      t[2] = v;
                      emit(t, 3);
                      vq[0] = vq[1]; vq[1] = v; strip_k++;
                  }
                  break;
              default:
                  vq[vq_n++] = v;
                  if (vq_n == 4)
                  {
                      CV t[4] = { vq[0], vq[1], vq[3], vq[2] };
                      emit(t, 4);
                      vq[0] = vq[2]; vq[1] = vq[3]; vq_n = 2;
                  }
                  break;
              }
          }

          void glBegin(int type) { vtx_type = type & 3; vq_n = 0; strip_k = 0; cur_attr = poly_attr; }
          void glEnd(void) { vtx_type = -1; }
          void glColor(rgb c) { cr = c & 31; cg = (c >> 5) & 31; cb = (c >> 10) & 31; }
          void glVertex3v16(v16 x, v16 y, v16 z) { vertex(x, y, z); }
          void glTexCoord2t16(t16 u, t16 v) { cu = u; cv = v; }
          void glPolyFmt(u32 f) { poly_attr = f; }

          /* ------------------------------------------------------------ rendering */
          static void rebuild_fog(void)
          {
              int step = 0x400 >> fog_shift;
              if (step < 1) step = 1;
              for (int z = 0; z < 0x8000; z++)
              {
                  int rel = z - fog_off, d;
                  if (rel < step) d = fog_tab[0];
                  else
                  {
                      int n = rel / step - 1;
                      if (n >= 31) d = fog_tab[31];
                      else d = fog_tab[n] + (fog_tab[n + 1] - fog_tab[n]) * (rel % step) / step;
                  }
                  fog_lut[z] = (u8)d;
              }
              fog_dirty = 0;
          }

          /* ------------------------------------------------- OpenGL ES 2.0 back end (glesr.c) */
          int glesr_init(void);
          void glesr_tex_upload(int id, int w, int h, const unsigned int *argb, int rep_s, int rep_t);
          void glesr_fog(const unsigned char *lut, int r, int g, int b);
          void glesr_begin(int cr, int cg, int cb);
          void glesr_draw(const float *v, int nv, int tex, int blend, int depthwrite);
          void glesr_end(unsigned int *out);

          static int gl_state;                  /* 0: not tried, 1: OpenGL ES 2.0 draws the 3D screen, -1: it could not start (no 3D) */
          static int gl_fog_sent;
          static float *gl_vb;
          #define GLV 11
          #define GL_VB_VERTS 16384

          static void gles_probe(void)
          {
              gl_state = glesr_init() ? 1 : -1;
              host_log(gl_state > 0 ? "renderer: OpenGL ES 2.0" : "renderer: OpenGL ES 2.0 FAILED to start (no 3D picture)");
          }

          /* One polygon as triangles: clip-space positions rebuilt from the screen coordinates and 1/w, so the
             GPU interpolates texture, colour and fog perspective-correct, as the software path does. */
          static int gles_build_poly(const Poly *p, float *o)
          {
              const Tex *tx = p->tex ? &tex[p->tex] : 0;
              const float fu = tx ? 1.0f / (16.0f * tx->w) : 0.0f, fv = tx ? 1.0f / (16.0f * tx->h) : 0.0f;
              const u32 attr = p->attr;
              const float alpha = ((attr >> 16) & 31) * (1.0f / 31.0f);
              const float fogf = (fog_on && (attr & POLY_FOG)) ? 1.0f : 0.0f;
              const float zoff = (attr & POLY_DEPTHTEST_EQUAL) ? -0.04f : 0.0f;   /* "equal" decals: a little nearer */
              const float cs = tx ? 1.0f / 32.0f : 1.0f / 31.0f, cb = tx ? 1.0f / 32.0f : 0.0f;
              int n = 0;
              for (int k = 1; k + 1 < p->n; k++)
              {
                  const SV *vs[3] = { &p->v[0], &p->v[k], &p->v[k + 1] };
                  for (int j = 0; j < 3; j++)
                  {
                      const SV *s = vs[j];
                      float w = s->iw > 0 ? 4194304.0f / (float)s->iw : 1.0f;   /* 2^34 / iw = w, in 1/4096 units */
                      float x = s->sx * (1.0f / 2048.0f) - 1.0f;
                      float y = s->sy * (1.0f / 1536.0f) - 1.0f;                 /* (row 0 = top of the picture) */
                      float z = s->z * (1.0f / 16383.5f) - 1.0f + zoff;
                      o[0] = x * w; o[1] = y * w; o[2] = z * w; o[3] = w;
                      o[4] = s->u * fu; o[5] = s->v * fv;
                      o[6] = (s->r + cb) * cs; o[7] = (s->g + cb) * cs; o[8] = (s->b + cb) * cs;
                      o[9] = alpha; o[10] = fogf;
                      o += GLV;
                      n++;
                  }
              }
              return n;
          }

          static void gles_flush(int tex, int blend, int dw, int *nv)
          {
              if (*nv)
                  glesr_draw(gl_vb, *nv, tex, blend, dw);
              *nv = 0;
          }

          static int render_gles(void)
          {
              static int cnt[MAX_TEX + 2];
              static u16 order[MAX_POLY];
              if (!gl_vb)
              {
                  gl_vb = (float *)malloc((size_t)GL_VB_VERTS * GLV * sizeof(float));
                  if (!gl_vb) return 0;
              }
              if (fog_dirty) { rebuild_fog(); gl_fog_sent = 0; }
              glesr_fog(gl_fog_sent ? 0 : fog_lut, fog_r << 3 | fog_r >> 2, fog_g << 3 | fog_g >> 2, fog_b << 3 | fog_b >> 2);
              gl_fog_sent = 1;
              for (int i = 0; i < npoly; i++)       /* textures not on the GPU yet */
              {
                  int ti = polys[i].tex;
                  if (ti && !gl_up[ti])
                  {
                      const Tex *tx = &tex[ti];
                      int p2w = !(tx->w & (tx->w - 1)), p2h = !(tx->h & (tx->h - 1));
                      glesr_tex_upload(ti, tx->w, tx->h, tx->px, tx->wrap_s && p2w, tx->wrap_t && p2h);
                      gl_up[ti] = 1;
                  }
              }
              glesr_begin(clr_r, clr_g, clr_b);

              /* opaque: by texture (they write depth, so the order does not matter) */
              memset(cnt, 0, sizeof cnt);
              for (int i = 0; i < npoly; i++)
                  if (!polys[i].trans && !polys[i].line) cnt[polys[i].tex + 1]++;
              for (int t = 0; t < MAX_TEX; t++) cnt[t + 1] += cnt[t];
              int no = 0;
              for (int i = 0; i < npoly; i++)
                  if (!polys[i].trans && !polys[i].line) { order[cnt[polys[i].tex]++] = (u16)i; no++; }
              int nv = 0, cur = -1;
              for (int k = 0; k < no; k++)
              {
                  const Poly *p = &polys[order[k]];
                  if (p->tex != cur || nv + 24 > GL_VB_VERTS) { gles_flush(cur, 0, 1, &nv); cur = p->tex; }
                  nv += gles_build_poly(p, gl_vb + nv * GLV);
              }
              gles_flush(cur, 0, 1, &nv);

              /* translucent: in the order sent */
              int ct = -1, cd = -1;
              for (int i = 0; i < npoly; i++)
              {
                  const Poly *p = &polys[i];
                  if (!p->trans || p->line) continue;
                  int dw = (p->attr & POLY_NEW_DEPTH) != 0;
                  if (p->tex != ct || dw != cd || nv + 24 > GL_VB_VERTS) { gles_flush(ct, 1, cd, &nv); ct = p->tex; cd = dw; }
                  nv += gles_build_poly(p, gl_vb + nv * GLV);
              }
              gles_flush(ct, 1, cd, &nv);
              glesr_end(shim_fb3d);
              return 1;
          }

          void glFlush(u32 flags)
          {
              (void)flags;
              shim_dma_run();
              static int first = 1;
              if (first)
              {
                  char m[64];
                  snprintf(m, sizeof m, "first glFlush: %d polys", npoly);
                  host_log(m);
                  first = 0;
              }
              if (!shim_skip_render)
              {
                  if (gl_state == 0) gles_probe();
                  if (gl_state > 0)
                      render_gles();
                  shim_last_render = host_ticks_ms();
              }
              npoly = nvert = 0;
          }

          /* ---------------------------------------------------- misc gl* and status */
          void glInit(void)
          {
              mat_ident(&cur_pos); mat_ident(&cur_proj); mat_ident(&mvp);
              sp = 0; mvp_dirty = 1; npoly = nvert = 0;
              memset(tex, 0, sizeof tex);
          }
          void glEnable(int bits) { if (bits & GL_FOG) fog_on = 1; }
          void glDisable(int bits) { if (bits & GL_FOG) fog_on = 0; }
          void glViewport(u8 x1, u8 y1, u8 x2, u8 y2) { (void)x1; (void)y1; (void)x2; (void)y2; }
          void glClearColor(u8 r, u8 g, u8 b, u8 a) { (void)a; clr_r = r & 31; clr_g = g & 31; clr_b = b & 31; }
          void glClearPolyID(u8 id) { (void)id; }
          void glClearDepth(int d) { clr_depth = d & 0x7FFF; }
          void glFogColor(u8 r, u8 g, u8 b, u8 a) { (void)a; fog_r = r & 31; fog_g = g & 31; fog_b = b & 31; }
          void glFogShift(int s) { s &= 15; if (s != fog_shift) { fog_shift = s; fog_dirty = 1; } }
          void glFogOffset(int o) { if (o != fog_off) { fog_off = o; fog_dirty = 1; } }
          void glFogDensity(int i, int d)
          {
              if (i >= 0 && i < 32)
              {
                  u8 v = (u8)(d > 127 ? 127 : d);
                  if (fog_tab[i] != v) { fog_tab[i] = v; fog_dirty = 1; }
              }
          }

          u32 shim_gfx_status(void) { shim_dma_run(); return 0; }
          u32 shim_poly_ram(void) { shim_dma_run(); return (u32)npoly; }
          u32 shim_vert_ram(void) { shim_dma_run(); return (u32)nvert; }

          /* --------------------------------------------------- packed GX commands */
          static int nparams(int c)
          {
              switch (c)
              {
              case 0x10: case 0x12: case 0x13: case 0x14: return 1;
              case 0x16: case 0x18: return 16;
              case 0x17: case 0x19: return 12;
              case 0x1A: return 9;
              case 0x1B: case 0x1C: return 3;
              case 0x20: case 0x21: case 0x22: return 1;
              case 0x23: return 2;
              case 0x24: case 0x25: case 0x26: case 0x27: case 0x28: return 1;
              case 0x29: case 0x2A: case 0x2B: return 1;
              case 0x30: case 0x31: case 0x32: case 0x33: return 1;
              case 0x34: return 32;
              case 0x40: case 0x50: case 0x60: return 1;
              case 0x70: return 3;
              case 0x71: return 2;
              case 0x72: return 1;
              default: return 0;
              }
          }

          static u32 pk_cmds, pk_param[32];
          static int pk_ncmds, pk_need, pk_got, pk_cur;

          static void exec(int c, const u32 *p)
          {
              Mat m;
              switch (c)
              {
              case 0x10: glMatrixMode((int)p[0]); break;
              case 0x11: glPushMatrix(); break;
              case 0x12: glPopMatrix(((int)(p[0] << 26)) >> 26); break;
              case 0x13: glStoreMatrix((int)p[0]); break;
              case 0x14: glRestoreMatrix((int)p[0]); break;
              case 0x15: glLoadIdentity(); break;
              case 0x16: memcpy(m.m, p, 64); load(&m); break;
              case 0x17: op43(&m, (const int *)p); load(&m); break;
              case 0x18: memcpy(m.m, p, 64); apply(&m); break;
              case 0x19: op43(&m, (const int *)p); apply(&m); break;
              case 0x1A: mat_ident(&m); for (int r = 0; r < 3; r++) for (int k = 0; k < 3; k++) m.m[r * 4 + k] = (int)p[r * 3 + k]; apply(&m); break;
              case 0x1B: glScalef32((int)p[0], (int)p[1], (int)p[2]); break;
              case 0x1C: glTranslatef32((int)p[0], (int)p[1], (int)p[2]); break;
              case 0x20: glColor((rgb)p[0]); break;
              case 0x22: cu = (s16)p[0]; cv = (s16)(p[0] >> 16); break;
              case 0x23: vertex((s16)p[0], (s16)(p[0] >> 16), (s16)p[1]); break;
              case 0x24: vertex(((int)(p[0] << 22) >> 22) << 6, ((int)(p[0] << 12) >> 22) << 6, ((int)(p[0] << 2) >> 22) << 6); break;
              case 0x28: vertex(lx + (((int)(p[0] << 22)) >> 22), ly + (((int)(p[0] << 12)) >> 22), lz + (((int)(p[0] << 2)) >> 22)); break;
              case 0x25: vertex((s16)p[0], (s16)(p[0] >> 16), lz); break;
              case 0x26: vertex((s16)p[0], ly, (s16)(p[0] >> 16)); break;
              case 0x27: vertex(lx, (s16)p[0], (s16)(p[0] >> 16)); break;
              case 0x29: glPolyFmt(p[0]); break;
              case 0x2A: glBindTexture(0, (int)(p[0] & 0xFFFF)); break;
              case 0x40: glBegin((int)(p[0] & 3)); break;
              case 0x41: glEnd(); break;
