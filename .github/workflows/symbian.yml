          static u8 clr_r, clr_g, clr_b;
          static int clr_depth = 0x7FFF;
          static int fog_on, fog_shift, fog_off;
          static u8 fog_r, fog_g, fog_b, fog_tab[32];
          static u8 fog_lut[0x8000];
          static int fog_dirty = 1;

