          static u32 rgb555(u16 c)
          {
              u32 r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
              return ((r << 3 | r >> 2) << 16) | ((g << 3 | g >> 2) << 8) | (b << 3 | b >> 2);
          }

          static int spr_pixel(const Spr *s, int px, int py)    /* palette index at a 32x16 source pixel */
          {
              if (s->hflip) px = 31 - px;
              if (s->vflip) py = 15 - py;
              int tile = (py >> 3) * 4 + (px >> 3);
              int off = s->off + tile * 32 + (py & 7) * 4 + ((px & 7) >> 1);
              if (off < 0 || off >= (int)sizeof(shim_spr_gfx)) return 0;
              u8 b = shim_spr_gfx[off];
              return (px & 1) ? b >> 4 : b & 15;
          }

          static void draw_sprites(u32 *dst)
          {
              for (int id = 127; id >= 0; id--)
              {
                  const Spr *s = &spr[id];
                  if (s->hide) continue;
                  int w = s->dbl ? 64 : 32, h = s->dbl ? 32 : 16;
                  for (int dy = 0; dy < h; dy++)
                  {
                      int y = s->y + dy;
                      if (y < 0 || y >= 192) continue;
                      for (int dx = 0; dx < w; dx++)
                      {
                          int x = s->x + dx;
                          if (x < 0 || x >= 256) continue;
                          int sx = dx, sy = dy;
                          if (s->aff >= 0)
                          {
                              sx = (((dx - w / 2) * aff_pa) >> 8) + 16;
                              sy = (((dy - h / 2) * aff_pd) >> 8) + 8;
                              if (sx < 0 || sx >= 32 || sy < 0 || sy >= 16) continue;
                          }
                          int c = spr_pixel(s, sx, sy);
                          if (c) dst[y * 256 + x] = 0xFF000000u | rgb555(shim_spr_pal[s->pal * 16 + c]);
                      }
                  }
              }
          }

          u32 shim_top[256 * 192];
          u32 shim_bot[256 * 192];

          static int bright[2], lcd_swap;
          static ShimGlParams gl_params;
          void shim_gl_get_params(ShimGlParams *p)
          {
              host_lock();
              *p = gl_params;
              host_unlock();
          }
          void setBrightness(int screen, int level)
          {
              if (level > 16) level = 16;
              if (level < -16) level = -16;
              if (screen & 1) bright[0] = level;
              if (screen & 2) bright[1] = level;
          }
          void lcdMainOnTop(void) { lcd_swap = 0; }
          void lcdMainOnBottom(void) { lcd_swap = 1; }

          void shim_present(void)
          {
              int lvl = 0;
              if ((shim_bldcnt & BLEND_SRC_BG0) && (shim_bldcnt & (3 << 6)) == BLEND_FADE_BLACK)
                  lvl = shim_bldy & 31;
              if (lvl > 16) lvl = 16;
              static u32 top[256 * 192], bot[256 * 192];
              /* the GLES renderer gets the sprite layer (with alpha) and the sub screen, and does the rest */
              memset(top, 0, sizeof top);
              draw_sprites(top);
              for (int i = 0; i < 256 * 192; i++)
              {
                  u16 c = sub_vram[i];
                  bot[i] = 0xFF000000u | ((!shim_console_on && (c & 0x8000)) ? rgb555(c) : 0);
              }
              host_lock();
              memcpy(shim_top, top, sizeof top);
              memcpy(shim_bot, bot, sizeof bot);
              gl_params.dim3d = lvl; gl_params.bright_main = bright[0]; gl_params.bright_sub = bright[1];
              gl_params.swap = lcd_swap; gl_params.console = shim_console_on; gl_params.seq++;
              host_unlock();
          }

          /* ------------------------------------------------------------------ sound */
          static const s16 step_tab[89] = {
              7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88, 97,
              107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796,
              876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428,
              4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818, 18500, 20350,
              22385, 24623, 27086, 29794, 32767 };
          static const s8 idx_tab[8] = { -1, -1, -1, -1, 2, 4, 6, 8 };

          typedef struct {
              const u8 *data;
              u32 bytes, rate, step, acc, pos, loopb;
              u8 fmt, vol, pan, loop, active, snap;
              int cur, prev, pred, idx, lpred, lidx;
          } Chan;
          static Chan chan[16];

          void soundEnable(void) {}

          static void chan_next(Chan *c)
          {
              c->prev = c->cur;
              if (c->fmt == SoundFormat_ADPCM)
              {
                  if (!c->snap && c->pos == c->loopb * 2) { c->lpred = c->pred; c->lidx = c->idx; c->snap = 1; }
                  if (c->pos >= c->bytes * 2)
                  {
                      if (!c->loop) { c->active = 0; return; }
                      c->pos = c->loopb * 2; c->pred = c->lpred; c->idx = c->lidx;
                  }
                  u32 n = c->pos++;
                  int nib = (c->data[4 + (n >> 1)] >> ((n & 1) * 4)) & 15;
                  int st = step_tab[c->idx], d = st >> 3;
                  if (nib & 1) d += st >> 2;
                  if (nib & 2) d += st >> 1;
                  if (nib & 4) d += st;
                  c->pred += (nib & 8) ? -d : d;
                  if (c->pred > 32767) c->pred = 32767;
                  if (c->pred < -32768) c->pred = -32768;
                  c->idx += idx_tab[nib & 7];
                  if (c->idx < 0) c->idx = 0;
                  if (c->idx > 88) c->idx = 88;
                  c->cur = c->pred;
              }
              else
              {
                  if (c->pos >= c->bytes)
                  {
                      if (!c->loop) { c->active = 0; return; }
                      c->pos = c->loopb;
                  }
                  if (c->fmt == SoundFormat_16Bit) { c->cur = ((const s16 *)c->data)[c->pos]; c->pos += 2; }
                  else c->cur = ((const s8 *)c->data)[c->pos++] << 8;
              }
          }

          int soundPlaySample(const void *data, SoundFormat fmt, u32 size, u16 freq, u8 vol, u8 pan, bool loop, u16 lp)
          {
              shim_trace("soundPlay");
              host_lock();
              int id = -1;
              for (int i = 0; i < 16; i++)
                  if (!chan[i].active) { id = i; break; }
              if (id >= 0)
              {
                  Chan *c = &chan[id];
                  memset(c, 0, sizeof *c);
                  c->data = (const u8 *)data; c->fmt = (u8)fmt; c->bytes = size; c->rate = freq ? freq : 11025;
                  c->step = (u32)(((u64)c->rate << 16) / SHIM_AUDIO_RATE);
                  c->vol = vol; c->pan = pan; c->loop = loop;
                  c->acc = 65536;                       /* fetch the first sample at once */
                  if (fmt == SoundFormat_ADPCM)
                  {
                      c->pred = (s16)(c->data[0] | c->data[1] << 8);
                      c->idx = c->data[2] > 88 ? 88 : c->data[2];
