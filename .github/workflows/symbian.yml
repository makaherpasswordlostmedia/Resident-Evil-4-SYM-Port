          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}

          "$(epocroot)epoc32/release/$(platform)/$(target)/re4ds.exe"-"!:\sys\bin\re4ds.exe"
          "$(epocroot)epoc32/data/z/resource/apps/re4ds.rsc"-"!:\resource\apps\re4ds.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/re4ds_reg.rsc"-"!:\private\10003a3f\import\apps\re4ds_reg.rsc"
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/game_main.c <<'RE4_EOF'
          // only used to prove that the whole game links against the shim
          #include <nds.h>
          #undef main
          int re4_main(void);
          int main(void) { return re4_main(); }
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/host_check.sh <<'RE4_EOF'
          #!/bin/bash
          # Host build of the whole game against the shim + a rasterizer smoke test. Run from the repo root
          # after tools/prepare.sh.
          set -euo pipefail
          S=symbian/shim
          mkdir -p /tmp/hc && rm -f /tmp/hc/*.o
          CF="-std=gnu11 -O1 -Wall -Wno-unused -Wno-pointer-to-int-cast -fno-strict-aliasing -I$S -Isymbian/gen -Isymbian/build_src"
          for f in symbian/build_src/*.c $S/dsshim.c $S/gx.c symbian/gen/databins.c symbian/tools/host_stubs.c symbian/tools/game_main.c; do
            gcc $CF -c "$f" -o "/tmp/hc/$(basename "$f").o"
          done
          # 32-bit, freestanding (-nostdinc + our own libc headers): what the Symbian compiler will see
          for f in symbian/build_src/*.c $S/dsshim.c $S/gx.c $S/rt.c symbian/gen/databins.c; do
            gcc -m32 -std=gnu11 -O2 -fsyntax-only -Wno-unused -Wno-misleading-indentation -fno-strict-aliasing \
                -nostdinc -isystem $S/libc -I$S -Isymbian/gen -Isymbian/build_src "$f"
          done
          echo "32-bit freestanding syntax check OK"
          # whole game links against the shim (main is provided by the stub file)
          gcc -o /tmp/hc/game /tmp/hc/*.o -lm
          echo "game + shim link OK"
          gcc $CF -c symbian/tools/render_test.c -o /tmp/hc/render_test.o
          gcc -o /tmp/hc/render_test /tmp/hc/render_test.o /tmp/hc/dsshim.c.o /tmp/hc/gx.c.o /tmp/hc/host_stubs.c.o -lm
          /tmp/hc/render_test
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/host_stubs.c <<'RE4_EOF'
          // host_stubs.c - host-side stand-ins for the Symbian services, for CI checks only.
          #include <nds.h>
          void host_exit_thread(void) { exit(0); }
          u32 host_ticks_ms(void) { static u32 t; return t += 17; }
          void host_sleep_ms(u32 ms) { (void)ms; }
          void host_lock(void) {}
          void host_unlock(void) {}
          void host_log(const char *m) { (void)m; }
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/prepare.sh <<'RE4_EOF'
          #!/bin/bash
          # Prepares the game sources for the Symbian build: copies ds/source to symbian/build_src, applies
          # the (few) source patches, generates the *_bin.h headers and the runtime data loader.
          # Run from the repository root.
          set -euo pipefail
          SRC=ds/source
          OUT=symbian/build_src
          GEN=symbian/gen
          rm -rf "$OUT" "$GEN"
          mkdir -p "$OUT" "$GEN"
          cp "$SRC"/*.c "$SRC"/*.h "$OUT"/
          sed -i 's/\r$//' "$OUT"/*.c "$OUT"/*.h

          # 1. the display-list DMA writes GFX_FIFO directly: route it into the GX emulator
          grep -q 'GFX_FIFO = \*list++;' "$OUT/model.c" || { echo "patch 1 target missing"; exit 1; }
          sed -i 's/GFX_FIFO = \*list++;/shim_gx_push(*list++);/' "$OUT/model.c"

          # 2. the picture table uses the *_bin symbols in a static initialiser; they are loaded at run
          #    time here, so the table must be built at run time too
          grep -q 'static const void \*const data\[\] = { title_bin' "$OUT/main.c" || { echo "patch 2 target missing"; exit 1; }
          sed -i 's/static const void \*const data\[\] = { title_bin/const void *data[] = { title_bin/; s/static const size_t size\[\] = { title_bin_size/const size_t size[] = { title_bin_size/' "$OUT/main.c"

          # 3. data blobs: every  #include "NAME_bin.h"  becomes a pointer + size loaded from data/NAME.bin
          names=$(grep -h '#include "[A-Za-z0-9_]*_bin.h"' "$OUT"/*.c | sed 's/.*"\(.*\)_bin\.h".*/\1/' | sort -u)
          [ -n "$names" ] || { echo "no data headers found"; exit 1; }
          for n in $names; do
            printf '#include <nds.h>\nextern const u8 *%s_bin;\nextern u32 %s_bin_size;\n' "$n" "$n" > "$GEN/${n}_bin.h"
          done
          {
            echo '// generated by tools/prepare.sh'
            echo '#include <nds.h>'
            for n in $names; do echo "const u8 *${n}_bin; u32 ${n}_bin_size;"; done
            cat <<'CEOF'
          static int load_one(const char *name, const u8 **p, u32 *sz)
          {
              char path[64];
              snprintf(path, sizeof path, "data/%s.bin", name);
              *p = 0; *sz = 0;
              FILE *f = fopen(path, "rb");
              if (f)
              {
                  fseek(f, 0, SEEK_END);
                  long n = ftell(f);
                  fseek(f, 0, SEEK_SET);
                  u8 *b = (u8 *)malloc(n > 0 ? (size_t)n : 1);
                  if (b && fread(b, 1, (size_t)n, f) == (size_t)n) { *p = b; *sz = (u32)n; fclose(f); return 0; }
                  free(b);
                  fclose(f);
              }
              if (!shim_console_on) consoleDemoInit();
              printf("missing: %s\n", path);
              { char m[96]; snprintf(m, sizeof m, "missing: %s", path); host_log(m); }
              return 1;
          }
          int shim_load_databins(void)
          {
              int miss = 0;
              host_log("loading data blobs");
          CEOF
            for n in $names; do echo "    miss += load_one(\"$n\", &${n}_bin, &${n}_bin_size);"; done
            cat <<'CEOF'
              { char m[64]; snprintf(m, sizeof m, "data blobs done, %d missing", miss); host_log(m); }
              return miss;
          }
          CEOF
          } > "$GEN/databins.c"
          # 4. the .mmp: the game's C files are listed from what is actually in ds/source
          srcs=$(cd "$OUT" && ls *.c | sed 's/^/SOURCE          /')
          awk -v list="$srcs" '{ if ($0 == "@GAME_SOURCES@") print list; else print }' symbian/group/re4ds.mmp.in > symbian/group/re4ds.mmp
          grep -q 'SOURCE          main.c' symbian/group/re4ds.mmp || { echo "mmp generation failed"; exit 1; }
          echo "prepared: $(echo $names | wc -w) data blobs"
          RE4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/render_test.c <<'RE4_EOF'
          // render_test.c - smoke test of the GX front end + GLES hand-off: matrices, clipping, polygon
          // buffer, texture hand-over, batching, alpha, uv, depth/fog flags.
          #include <nds.h>
          #undef main
          #include <stdio.h>
          #include <string.h>
          #include "gl_iface.h"

          static int fails;
          #define CHECK(c, msg) do { if (!(c)) { fprintf(stderr, "FAIL: %s\n", msg); fails++; } } while (0)

          int main(void)
          {
              CHECK(shim_gl_enable() == 1, "gl mode enabled");
              glInit();
              glClearColor(8, 12, 20, 31);
              glClearDepth(0x7FFF);
              int n;
              glGenTextures(1, &n);
              glBindTexture(0, n);
              static u8 tx[64 * 64];
              for (int y = 0; y < 64; y++) for (int x = 0; x < 64; x++) tx[y * 64 + x] = ((x / 8 + y / 8) & 1) ? 1 : 2;
              static u16 pal[256] = { 0, RGB15(31, 31, 0), RGB15(0, 10, 31) };
              glTexImageNtr2D(GL_RGB256, 64, 64, GL_TEXTURE_WRAP_S | GL_TEXTURE_WRAP_T | TEXGEN_TEXCOORD, tx, 0);
              glColorTableNtr(3, pal);
              ShimGlTexEv ev;
              CHECK(shim_gl_next_tex(&ev) == 1 && ev.kind == 1 && ev.id == n && ev.w == 64 && ev.h == 64 && ev.px != 0, "texture upload event");
              CHECK(ev.px && (ev.px[0] >> 24) == 255, "texel alpha 255");
              CHECK(ev.px && (ev.px[1] & 0xFFFFFF) == 0x0052FF && (ev.px[8] & 0xFFFFFF) == 0xFFFF00, "palette colours decoded");
              CHECK(shim_gl_next_tex(&ev) == 0, "no more events");

              glMatrixMode(GL_PROJECTION); glLoadIdentity();
              gluPerspectivef32(degreesToAngle(70), floattof32(256.0 / 192), floattof32(1), floattof32(700));
              glMatrixMode(GL_MODELVIEW); glLoadIdentity();
              gluLookAtf32(0, inttof32(3), inttof32(8), 0, 0, 0, 0, inttof32(1), 0);
              glPolyFmt(POLY_ALPHA(31) | POLY_CULL_NONE);
              glBegin(GL_QUADS); glColor(0x7FFF);
              glTexCoord2t16(0, 0);                         glVertex3v16(-inttov16(7), 0, -inttov16(7));
              glTexCoord2t16(inttot16(64), 0);              glVertex3v16(inttov16(7), 0, -inttov16(7));
              glTexCoord2t16(inttot16(64), inttot16(64));   glVertex3v16(inttov16(7), 0, inttov16(7));
              glTexCoord2t16(0, inttot16(64));              glVertex3v16(-inttov16(7), 0, inttov16(7));
              glEnd();
              glBindTexture(0, 0);
              glPolyFmt(POLY_ALPHA(16) | POLY_CULL_NONE | POLY_FOG);
              glBegin(GL_TRIANGLES); glColor(RGB15(31, 0, 0));
              glVertex3v16(-inttov16(2), inttov16(3), 0); glVertex3v16(inttov16(2), inttov16(3), 0); glVertex3v16(0, 0, inttov16(1));
              glEnd();
              CHECK(GFX_POLYGON_RAM_USAGE == 2, "two polygons counted");
              glFlush(0);
              const ShimGlGeo *g = shim_gl_acquire();
              CHECK(g != 0, "geometry frame available");
              if (g)
              {
                  CHECK(g->nv == 9, "9 vertices (quad = 2 triangles + 1 triangle)");
                  CHECK(g->nb == 2, "2 batches");
                  if (g->nb == 2)
                  {
                      CHECK(g->b[0].tex == n && g->b[0].flags == SHIM_GLB_DEPTHW && g->b[0].count == 6, "opaque textured batch");
                      CHECK(g->b[1].tex == 0 && (g->b[1].flags & SHIM_GLB_TRANS) && !(g->b[1].flags & SHIM_GLB_DEPTHW) && g->b[1].count == 3, "translucent batch, no depth write");
                  }
                  float u1, w0;
                  memcpy(&u1, &g->v[1].u, 4);          /* second vertex of the quad = (64,0) texels -> u = 1.0 */
                  memcpy(&w0, &g->v[0].w, 4);
                  CHECK(u1 > 0.999f && u1 < 1.001f, "u of the 2nd corner is 1.0");
                  CHECK(w0 > 1.0f && w0 < 20.0f, "clip w is a sensible distance");
                  CHECK(g->v[0].a == 255 && g->v[6].a < 140 && g->v[6].a > 120, "alpha 31 -> 255, 16 -> ~132");
                  CHECK(g->clr[0] == 8 && g->clr[1] == 12 && g->clr[2] == 20 && g->clr_depth == 0x7FFF, "clear colour / depth passed on");
              }
              /* the next frame starts empty */
              glFlush(0);
              g = shim_gl_acquire();
              CHECK(g && g->nv == 0 && g->nb == 0, "second frame is empty");
              fprintf(stderr, fails ? "render test FAILED\n" : "render test OK\n");
              return fails ? 1 : 0;
          }
          RE4_EOF
          chmod +x symbian/tools/*.sh
          bash symbian/tools/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          path: symbian
          include-hidden-files: true

  host-test:
    name: Game + DS layer (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian
      - name: Compile, link and smoke-test against the software DS layer
        run: |
          chmod +x symbian/tools/*.sh
          bash symbian/tools/host_check.sh

  build-sis:
    name: Build re4ds.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          # install-sdk.sh requires perl to resolve to /opt/homebrew/opt/perl/bin/perl, not the linked
          # /opt/homebrew/bin/perl symlink, so keep the keg unlinked (as on a stock Mac).
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Enable GLES 2.0 (required)
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          EPR="${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}epoc32"
          LIBDIR="$EPR/release/armv5/lib"
          EGL_LIB="$(ls "$LIBDIR" 2>/dev/null | grep -i '^libegl\.\(lib\|dso\)$' | head -1 || true)"
          GLES_LIB="$(ls "$LIBDIR" 2>/dev/null | grep -i '^libglesv2\.\(lib\|dso\)$' | head -1 || true)"
          echo "EGL header:   $(ls "$EPR/include/EGL/egl.h" 2>&1 | tail -1)"
          echo "GLES2 header: $(ls "$EPR/include/GLES2/gl2.h" 2>&1 | tail -1)"
          echo "EGL lib:      '$EGL_LIB'   GLES2 lib: '$GLES_LIB'"
          if [ -f "$EPR/include/EGL/egl.h" ] && [ -f "$EPR/include/GLES2/gl2.h" ] && [ -n "$EGL_LIB" ] && [ -n "$GLES_LIB" ]; then
            E="$(echo "$EGL_LIB" | sed 's/\.dso$/.lib/')"
            G="$(echo "$GLES_LIB" | sed 's/\.dso$/.lib/')"
            printf '\nMACRO           RE4_GLES2\nLIBRARY         %s %s\n' "$E" "$G" >> symbian/group/re4ds.mmp
            echo "GLES 2.0 renderer ENABLED ($E $G)"
          else
            echo "ERROR: this SDK has no EGL + GLES 2.0 (headers/libs listed above). There is no software renderer any more, so the build stops here."
            exit 1
          fi

      - name: Build RE4 DS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          cd symbian/group
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || true
          echo "=========== compile errors ==========="
          grep -E "error:|fatal error|undefined reference|\*\*\* \[|cannot find" "$GITHUB_WORKSPACE/build.log" \
            | sed 's|/Users/runner/work/[^/]*/[^/]*/||g' | sort -u | head -80 || true
          test -f "${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}epoc32/release/gcce/urel/re4ds.exe" || { echo "re4ds.exe was not built"; exit 1; }

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/sis/re4ds.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Symbol table (to resolve stall addresses from re4ds.log)
        run: |
          source toolchain/Scripts/env.sh
          D="${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}epoc32/release/gcce/urel"
          ls -l "$D" | grep re4ds || true
          NM="$(command -v arm-none-symbianelf-nm || true)"
          echo "nm: $NM"
          for f in "$D/re4ds.exe.sym" "$D/re4ds.exe"; do
            if [ -f "$f" ] && [ -n "$NM" ]; then
              "$NM" -n -C "$f" > "$GITHUB_WORKSPACE/dist/re4ds-symbols.txt" 2>/dev/null || true
              [ -s "$GITHUB_WORKSPACE/dist/re4ds-symbols.txt" ] && echo "symbols from $f" && break
            fi
          done
          ls -l "$GITHUB_WORKSPACE/dist"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: re4ds-symbian3
          path: dist/re4ds.sisx

      - uses: actions/upload-artifact@v4
        with:
          name: re4ds-symbols
          path: dist/re4ds-symbols.txt
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/re4ds.sisx

  convert-data:
    name: Convert RE4 data (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.convert }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the Zeebo zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force input | Out-Null
          $url = '${{ inputs.zip_url }}'
          $gid = '${{ inputs.gdrive_id }}'
          if ($gid) {
            python -m pip install --quiet gdown
            python -m gdown $gid -O input/zeebo.zip
            if ($LASTEXITCODE -ne 0) { throw 'gdown failed - is the file shared as "Anyone with the link"?' }
          } elseif ($url) {
            Invoke-WebRequest -Uri $url -OutFile input/zeebo.zip -MaximumRedirection 10
          } else {
            gh release download '${{ inputs.release_tag }}' --repo '${{ github.repository }}' --pattern '*.zip' --dir input --clobber
            $z = Get-ChildItem input -Filter *.zip | Select-Object -First 1
            if (-not $z) { throw 'no zip found in the release' }
            Move-Item $z.FullName input/zeebo.zip -Force
          }
          $len = (Get-Item input/zeebo.zip).Length
          Write-Host "zip size: $len bytes"
          if ($len -lt 1MB) { throw 'downloaded file is too small - not the game zip (wrong link / login page?)' }

      - name: Title picture placeholder (only if the repo has none)
        shell: pwsh
        run: |
          $p = 'assets/title/title_ds_edition_source.png'
          if (-not (Test-Path $p)) {
            New-Item -ItemType Directory -Force assets/title | Out-Null
            Add-Type -AssemblyName System.Drawing
            $bmp = [System.Drawing.Bitmap]::new(1109, 832)
            $bmp.Save((Join-Path (Get-Location) $p), [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host 'wrote a black placeholder title picture'
          }

      - name: Convert
        shell: pwsh
        run: |
          Get-ChildItem -Recurse re4zeebo | Unblock-File
          if (-not (Test-Path re4zeebo/export_all.ps1)) { throw 're4zeebo/export_all.ps1 is missing in this repository' }
          ./re4zeebo/export_all.ps1 -InputPath (Resolve-Path input/zeebo.zip).Path -NoMusic

      - name: Silent music.bin (the game needs the file to exist)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ds/data | Out-Null
          if (-not (Test-Path ds/data/music.bin)) {
            # "RMU1", 0 tracks, 16384 Hz
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'ds/data/music.bin'), [byte[]](0x52,0x4D,0x55,0x31,0,0,0,0x40))
            Write-Host 'wrote an empty music.bin'
          }

      - name: Pack for the phone
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/RE4DS | Out-Null
          Copy-Item ds/data out/RE4DS/data -Recurse
          Copy-Item ds/nitrofs out/RE4DS/nitrofs -Recurse
          Get-ChildItem out/RE4DS -Recurse -File | Measure-Object Length -Sum | ForEach-Object { Write-Host "$($_.Count) files, $([math]::Round($_.Sum/1MB,1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: RE4DS
          path: out/RE4DS
          retention-days: 1
